spec_version: '1'
type: resource
name: reviews
description: Paginated product reviews from the external retail API.
integration: retail_api
api:
  endpoint: /reviews
  method: GET
  query_params:
    page_size: '17'
input:
  product_id: { type: string }
query:
  filters:
    product_id:
      operators: [eq]
      bind:
        eq: { input: product_id }
output:
  review_id: { type: string, path: $.review_id }
  product_id: { type: string, path: $.product_id }
  rating: { type: integer, path: $.rating }
  review_text: { type: string, path: $.review_text }
  reviewed_at: { type: timestamp, path: $.reviewed_at }
  verified_purchase: { type: boolean, path: $.verified_purchase }
extract:
  record_path: $.data
  pagination:
    type: cursor
    cursor_path: $.meta.next_cursor
    cursor_param: cursor
  table:
    primary_key: [review_id]
    load_strategy: full_refresh
