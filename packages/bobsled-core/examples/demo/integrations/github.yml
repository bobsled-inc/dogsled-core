spec_version: '1'
type: integration
name: github
auth_env_vars: [GITHUB_READ_TOKEN]
description: GitHub REST API
transport:
  type: http
  base_url: https://api.github.com
  auth:
    type: bearer
    token: '${{ env.GITHUB_READ_TOKEN }}'
  timeout_ms: 30000
  retry:
    retry_on: [429, 503]
    max_retries: 3
    backoff: exponential
    retry_after_header: true
  headers:
    Accept: application/vnd.github+json
    User-Agent: dogsled-example
