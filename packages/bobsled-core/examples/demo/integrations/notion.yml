spec_version: '1'
type: integration
name: notion
auth_env_vars: [NOTION_API_TOKEN]
description: Notion API
transport:
  type: http
  base_url: https://api.notion.com
  auth:
    type: bearer
    token: '${{ env.NOTION_API_TOKEN }}'
  timeout_ms: 30000
  retry:
    retry_on: [429, 500, 502, 503]
    max_retries: 3
    backoff: exponential
    retry_after_header: true
  rate_limit:
    requests_per_second: 3
    burst: 5
  headers:
    Notion-Version: '2022-06-28'
    User-Agent: dogsled-example
