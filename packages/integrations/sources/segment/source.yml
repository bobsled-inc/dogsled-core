spec_version: '2'
type: source
name: segment
description: Segment Public API for workspaces, sources, destinations, and tracking plans.
transports:
  - id: default
    base_url: https://api.segmentapis.com
    auth:
      type: bearer
      token: ${{ env.SEGMENT_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 2
      burst: 4
    headers:
      Accept: application/json
      User-Agent: bobsled-core-extractor
default_transport: default
