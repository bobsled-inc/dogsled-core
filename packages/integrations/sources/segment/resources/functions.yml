type: resource
name: functions
description: Functions in the Segment workspace.
api:
  endpoint: /functions
  method: GET
  query_params:
    pagination.count: ${{ input.pagination_count }}
    pagination.cursor: ${{ input.pagination_cursor }}
input:
  pagination_count:
    type: integer
    default: 100
  pagination_cursor:
    type: string
output:
  id:
    type: string
    path: $.id
  name:
    type: string
    path: $.name
  display_name:
    type: string
    path: $.displayName
  code:
    type: string
    path: $.code
  updated_at:
    type: timestamp
    path: $.updatedAt
  source_id:
    type: string
    path: $.sourceId
extract:
  record_path: $.data.functions
  table:
    primary_key:
      - id
  pagination:
    type: cursor
    cursor_path: $.data.pagination.next
    cursor_param: pagination.cursor
