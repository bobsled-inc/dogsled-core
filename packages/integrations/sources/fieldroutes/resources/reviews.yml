type: resource
name: reviews
description: Post-service review events for quality and NPS-like reporting.
api:
  endpoint: /review/search
  method: POST
  query_params:
    officeIDs: '${{ input.office_ids }}'
    customerIDs: '${{ input.customer_ids }}'
    appointmentIDs: '${{ input.appointment_ids }}'
    favorable: '${{ input.favorable }}'
    starRating: '${{ input.star_rating }}'
    includeData: '${{ input.include_data }}'

input:
  office_ids:
    type: integer
    description: Optional office filter.
  customer_ids:
    type: string
    description: Optional customer filter.
  appointment_ids:
    type: string
    description: Optional appointment filter.
  favorable:
    type: integer
    description: Favorable review flag.
  star_rating:
    type: integer
    description: Minimum/target star rating.
  include_data:
    type: integer
    description: Set to `1` to request resolved records.
    default: 1

output:
  feedback_id:
    type: integer
    path: $.feedbackID
    description: Review feedback ID.
  customer_id:
    type: integer
    path: $.customerID
    description: Reviewed customer.
  office_ids:
    type: array
    path: $.officeIDs
    description: Offices associated with review context.
  appointment_id:
    type: integer
    path: $.appointmentID
    description: Related appointment.
  date:
    type: timestamp
    path: $.date
    description: Review date/time.
  star_rating:
    type: integer
    path: $.starRating
    description: Star rating.
  favorable:
    type: integer
    path: $.favorable
    description: Favorable flag.
  feedback:
    type: string
    path: $.feedback
    description: Free-form review text.

extract:
  record_path: '$..[?(@.feedbackID)]'
  table:
    primary_key:
      - feedback_id
    trust_tier: silver
