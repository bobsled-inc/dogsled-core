type: resource
name: subscriptions
description: Recurring subscription plans for customer schedules and forecasting.
api:
  endpoint: /subscription/search
  method: POST
  query_params:
    officeIDs: '${{ input.office_ids }}'
    active: '${{ input.active }}'
    customerIDs: '${{ input.customer_ids }}'
    soldBy: '${{ input.sold_by }}'
    preferredTech: '${{ input.preferred_tech }}'
    serviceType: '${{ input.service_type }}'
    dateAddedStart: '${{ input.date_added_start }}'
    dateAddedEnd: '${{ input.date_added_end }}'
    dateUpdatedStart: '${{ input.date_updated_start }}'
    dateUpdatedEnd: '${{ input.date_updated_end }}'
    includeData: '${{ input.include_data }}'

input:
  office_ids:
    type: integer
    description: Optional office filter.
  active:
    type: integer
    description: Active status filter.
  customer_ids:
    type: string
    description: Optional customer filter.
  sold_by:
    type: integer
    description: Preferred sales rep filter.
  preferred_tech:
    type: integer
    description: Preferred tech ID.
  service_type:
    type: integer
    description: Recurring service type ID.
  date_added_start:
    type: string
    description: Lower bound for `dateAdded`.
  date_added_end:
    type: string
    description: Upper bound for `dateAdded`.
  date_updated_start:
    type: string
    description: Lower bound for `dateUpdated`.
  date_updated_end:
    type: string
    description: Upper bound for `dateUpdated`.
  include_data:
    type: integer
    description: Set to `1` to request resolved records.
    default: 1

output:
  subscription_id:
    type: integer
    path: $.subscriptionID
    description: Subscription unique ID.
  customer_id:
    type: integer
    path: $.customerID
    description: Customer receiving the service.
  office_id:
    type: integer
    path: $.officeID
    description: Home office.
  active:
    type: integer
    path: $.active
    description: Active flag.
  status_text:
    type: string
    path: $.activeText
    description: Friendly active-status text.
  service_type:
    type: integer
    path: $.serviceType
    description: Service type ID.
  service_id:
    type: integer
    path: $.serviceID
    description: Linked recurring service ID.
  frequency:
    type: integer
    path: $.frequency
    description: Recurrence cadence.
  date_added:
    type: timestamp
    path: $.dateAdded
    description: Subscription creation date.
  date_cancelled:
    type: timestamp
    path: $.dateCancelled
    description: Cancellation date if canceled.
  date_updated:
    type: timestamp
    path: $.dateUpdated
    description: Last update.
  next_service:
    type: string
    path: $.nextService
    description: Next scheduled service indicator/date.
  initial_quote:
    type: number
    path: $.initialQuote
    description: Initial quoted amount.
  initial_discount:
    type: number
    path: $.initialDiscount
    description: Initial discount amount.
  recurring_charge:
    type: number
    path: $.recurringCharge
    description: Current recurring charge.
  contract_value:
    type: number
    path: $.contractValue
    description: Total contract value.

extract:
  record_path: '$..[?(@.subscriptionID)]'
  table:
    primary_key:
      - subscription_id
    trust_tier: silver
