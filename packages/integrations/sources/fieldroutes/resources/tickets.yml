type: resource
name: tickets
description: Tickets (invoices/jobs) for revenue attribution and status tracking.
api:
  endpoint: /ticket/search
  method: POST
  query_params:
    officeIDs: '${{ input.office_ids }}'
    customerIDs: '${{ input.customer_ids }}'
    status: '${{ input.status }}'
    dateCreated: '${{ input.date_created }}'
    invoiceDate: '${{ input.invoice_date }}'
    includeData: '${{ input.include_data }}'

input:
  office_ids:
    type: integer
    description: Optional office filter.
  customer_ids:
    type: string
    description: Optional customer filter.
  status:
    type: integer
    description: Ticket status code.
  date_created:
    type: string
    description: Lower/upper bound support via FieldRoutes query object.
  invoice_date:
    type: string
    description: Invoice date bound or query object.
  include_data:
    type: integer
    description: Set to `1` to request resolved records.
    default: 1

output:
  ticket_id:
    type: integer
    path: $.ticketID
    description: Ticket unique ID.
  customer_id:
    type: integer
    path: $.customerID
    description: Owning customer.
  office_id:
    type: integer
    path: $.officeID
    description: Owning office.
  subscription_id:
    type: integer
    path: $.subscriptionID
    description: Linked subscription ID.
  date_created:
    type: timestamp
    path: $.dateCreated
    description: Ticket creation timestamp.
  invoice_date:
    type: timestamp
    path: $.invoiceDate
    description: Invoice date if invoiced.
  active:
    type: integer
    path: $.active
    description: Ticket active flag.
  sub_total:
    type: number
    path: $.subTotal
    description: Ticket sub-total amount.
  tax_amount:
    type: number
    path: $.taxAmount
    description: Total tax value.
  total:
    type: number
    path: $.total
    description: Final ticket total.
  production_value:
    type: number
    path: $.productionValue
    description: Production value at ticket level.
  service_charge:
    type: number
    path: $.serviceCharge
    description: Service charge amount.
  balance:
    type: number
    path: $.balance
    description: Outstanding balance.
  service_id:
    type: integer
    path: $.serviceID
    description: Base service/product ID.

extract:
  record_path: '$..[?(@.ticketID)]'
  table:
    primary_key:
      - ticket_id
    trust_tier: silver
