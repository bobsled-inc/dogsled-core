type: resource
name: users_followers
description: Followers for the authenticated X user.
api:
  endpoint: /2/users/${{ input.id }}/followers
  method: GET
  query_params:
    max_results: ${{ input.max_results }}
    pagination_token: ${{ input.pagination_token }}
input:
  id:
    type: string
    default: '2244994945'
  max_results:
    type: integer
    default: 100
  pagination_token:
    type: string
output:
  id:
    type: string
    path: $.id
  name:
    type: string
    path: $.name
  username:
    type: string
    path: $.username
  description:
    type: string
    path: $.description
  created_at:
    type: timestamp
    path: $.created_at
  followers_count:
    type: integer
    path: $.public_metrics.followers_count
extract:
  record_path: $.data
  table:
    primary_key:
      - id
  pagination:
    type: cursor
    cursor_path: $.meta.next_token
    cursor_param: pagination_token
  for_each:
    resource: users_me
    field: id
    input: id
