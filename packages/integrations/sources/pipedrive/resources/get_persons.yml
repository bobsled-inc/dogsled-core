type: resource
name: get_persons
description: Get all persons
api:
  endpoint: /persons
  method: GET
  query_params:
    user_id: ${{ input.user_id }}
    filter_id: ${{ input.filter_id }}
    first_char: ${{ input.first_char }}
    start: ${{ input.start }}
    limit: ${{ input.limit }}
    sort: ${{ input.sort }}
input:
  user_id:
    type: integer
    description: If supplied, only persons owned by the given user will be returned. However,
      `filter_id` takes precedence over `user_id` when both are supplied.
  filter_id:
    type: integer
    description: ID of the filter to use.
  first_char:
    type: string
    description:
      If supplied, only persons whose name starts with the specified letter will be returned
      (case insensitive).
  start:
    type: integer
    description: Pagination start
    default: 0
  limit:
    type: integer
    description: Items shown per page
  sort:
    type: string
    description:
      Field names and sorting mode separated by a comma (`field_name_1 ASC`, `field_name_2
      DESC`). Only first-level field keys are supported (no nested keys).
output:
  id:
    type: integer
    path: $.id
    description: Pipedrive person identifier
  name:
    type: string
    path: $.name
    description: Person full name
  owner_id:
    type: integer
    path: $.owner_id
    description: Owning user identifier
  org_id:
    type: integer
    path: $.org_id
    description: Related organization identifier
  phone:
    type: array
    path: $.phone
    description: Phone values attached to the person
  email:
    type: array
    path: $.email
    description: Email values attached to the person
  add_time:
    type: timestamp
    path: $.add_time
    description: Person creation timestamp
  update_time:
    type: timestamp
    path: $.update_time
    description: Person update timestamp
extract:
  record_path: $.data
  pagination:
    type: offset
    offset_param: start
    limit_param: limit
  table:
    primary_key:
      - id
    trust_tier: silver
lookup:
  description: Get details of a person
  api:
    endpoint: /persons/${{ input.id }}
    method: GET
  input:
    id:
      type: integer
      required: true
