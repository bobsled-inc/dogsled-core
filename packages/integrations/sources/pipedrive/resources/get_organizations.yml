type: resource
name: get_organizations
description: Get all organizations
api:
  endpoint: /organizations
  method: GET
  query_params:
    user_id: ${{ input.user_id }}
    filter_id: ${{ input.filter_id }}
    first_char: ${{ input.first_char }}
    start: ${{ input.start }}
    limit: ${{ input.limit }}
    sort: ${{ input.sort }}
input:
  user_id:
    type: integer
    description: If supplied, only organizations owned by the given user will be returned. However,
      `filter_id` takes precedence over `user_id` when both are supplied.
  filter_id:
    type: integer
    description: ID of the filter to use
  first_char:
    type: string
    description: If supplied, only organizations whose name starts with the specified letter will be
      returned (case insensitive).
  start:
    type: integer
    description: Pagination start
    default: 0
  limit:
    type: integer
    description: Items shown per page
  sort:
    type: string
    description:
      Field names and sorting mode separated by a comma (`field_name_1 ASC`, `field_name_2
      DESC`). Only first-level field keys are supported (no nested keys).
output:
  id:
    type: integer
    path: $.id
    description: Pipedrive organization identifier
  name:
    type: string
    path: $.name
    description: Organization name
  owner_id:
    type: integer
    path: $.owner_id
    description: Owning user identifier
  address:
    type: string
    path: $.address
    description: Organization address
  visible_to:
    type: string
    path: $.visible_to
    description: Visibility setting for the organization
  add_time:
    type: timestamp
    path: $.add_time
    description: Organization creation timestamp
  update_time:
    type: timestamp
    path: $.update_time
    description: Organization update timestamp
extract:
  record_path: $.data
  pagination:
    type: offset
    offset_param: start
    limit_param: limit
  table:
    primary_key:
      - id
    trust_tier: silver
lookup:
  description: Get details of an organization
  api:
    endpoint: /organizations/${{ input.id }}
    method: GET
  input:
    id:
      type: integer
      required: true
