type: resource
name: pull_requests
description: Pull requests for a GitHub repository representing proposed code changes with review and merge metadata
api:
  endpoint: /repos/${{ input.owner }}/${{ input.repo }}/pulls
  method: GET
  query_params:
    state: ${{ input.state }}
    sort: ${{ input.sort }}
    direction: ${{ input.direction }}
    per_page: ${{ input.per_page }}
input:
  owner:
    type: string
    description: Repository owner (user or organization login)
    default: my-org
  repo:
    type: string
    description: Repository name
    default: my-repo
  repository_full_name:
    type: string
    description: Optional fully qualified owner/repository name populated by repos fanout and passed to downstream child resources.
  state:
    type: string
    description: Filter pull requests by state
    default: open
    enum:
      - open
      - closed
      - all
  sort:
    type: string
    description: Field to sort results by
    default: created
    enum:
      - created
      - updated
      - popularity
      - long-running
  direction:
    type: string
    description: Sort order direction
    default: desc
    enum:
      - asc
      - desc
  per_page:
    type: integer
    description: Number of pull requests to return per page (max 100)
    default: 100
query:
  filters:
    state:
      operators:
        - eq
      enum:
        - open
        - closed
        - all
      description: Filter pull requests by state
      bind:
        eq:
          input: state
      compile:
        eq:
          mode: http_query
          param: state
output:
  repository_owner:
    type: string
    semantic_role: name
    path: $.__input__.owner
    description: Repository owner login from the parent repository fanout context
  repository_name:
    type: string
    semantic_role: name
    path: $.__input__.repo
    description: Repository name from the parent repository fanout context
  repository_full_name:
    type: string
    semantic_role: identifier
    path: $.__input__.repository_full_name
    description: Fully qualified owner/repository name from the parent repository fanout context
  id:
    type: integer
    semantic_role: entity_id
    path: $.id
    description: Unique numeric identifier assigned by GitHub to the pull request across all repositories
  node_id:
    type: string
    semantic_role: entity_id
    path: $.node_id
    description: Global relay ID used by the GitHub GraphQL API
  number:
    type: integer
    semantic_role: identifier
    path: $.number
    description: Repository-scoped pull request number displayed in the UI (e.g.
  title:
    type: string
    semantic_role: name
    path: $.title
    description: Short summary title of the pull request describing the proposed changes
  html_url:
    type: string
    semantic_role: url
    path: $.html_url
    description: Browser-accessible URL for viewing the pull request on github.com
  diff_url:
    type: string
    semantic_role: url
    path: $.diff_url
    description: URL to download the pull request diff in unified diff format
  patch_url:
    type: string
    semantic_role: url
    path: $.patch_url
    description: URL to download the pull request as a git patch file
  state:
    type: string
    semantic_role: categorical
    path: $.state
    description: "Current state of the pull request \u2014 \"open\" if pending review/merge or \"closed\" if merged or dismissed"
  locked:
    type: boolean
    semantic_role: categorical
    path: $.locked
    description: True if the pull request conversation has been locked by a maintainer
  draft:
    type: boolean
    semantic_role: categorical
    path: $.draft
    description: True if the pull request is marked as a draft and not yet ready for review
  user_login:
    type: string
    semantic_role: name
    path: $.user.login
    description: GitHub username of the user who opened the pull request
  user_id:
    type: integer
    semantic_role: entity_id
    path: $.user.id
    description: Unique numeric identifier of the pull request author
  author_association:
    type: string
    semantic_role: categorical
    path: $.author_association
    description: "Relationship of the PR author to the repository \u2014 \"OWNER\", \"MEMBER\", \"COLLABORATOR\", \"CONTRIBUTOR\", \"FIRST_TIMER\", \"FIRST_TIME_CONTRIBUTOR\", or \"NONE\""
  assignee_login:
    type: string
    semantic_role: name
    path: $.assignee.login
    description: GitHub username of the primary assignee, or null if unassigned
  labels:
    type: string
    semantic_role: categorical
    path: $.labels[*].name
    description: Comma-separated list of label names applied to the pull request
  milestone_title:
    type: string
    semantic_role: name
    path: $.milestone.title
    description: Title of the milestone this pull request is associated with, or null if not milestoned
  head_ref:
    type: string
    semantic_role: identifier
    path: $.head.ref
    description: Name of the source branch containing the proposed changes (e.g. "feature/my-feature")
  head_sha:
    type: string
    semantic_role: identifier
    path: $.head.sha
    description: Full 40-character SHA of the latest commit on the source branch
  head_repo_full_name:
    type: string
    semantic_role: name
    path: $.head.repo.full_name
    description: Full name of the repository containing the head branch (differs from base for cross-fork PRs)
  base_ref:
    type: string
    semantic_role: identifier
    path: $.base.ref
    description: Name of the target branch the pull request will be merged into (e.g. "main")
  base_sha:
    type: string
    semantic_role: identifier
    path: $.base.sha
    description: Full 40-character SHA of the latest commit on the base branch at time of PR creation
  merged:
    type: boolean
    semantic_role: categorical
    path: $.merged
    description: True if the pull request has been merged into the base branch
  mergeable:
    type: boolean
    semantic_role: categorical
    path: $.mergeable
    description: True if the pull request can be cleanly merged without conflicts, null if not yet computed
  merge_commit_sha:
    type: string
    semantic_role: identifier
    path: $.merge_commit_sha
    description: SHA of the merge commit if the PR has been merged, or the test merge commit SHA if still open
  merged_by_login:
    type: string
    semantic_role: name
    path: $.merged_by.login
    description: GitHub username of the user who merged the pull request, null if not yet merged
  requested_reviewers:
    type: string
    semantic_role: categorical
    path: $.requested_reviewers[*].login
    description: Comma-separated list of GitHub usernames who have been requested to review but have not yet submitted a review
  body:
    type: string
    semantic_role: categorical
    path: $.body
    description: Full Markdown body text of the pull request description
  comments:
    type: integer
    semantic_role: count
    path: $.comments
    description: Number of general comments on the pull request (not review comments)
  review_comments:
    type: integer
    semantic_role: count
    path: $.review_comments
    description: Number of inline code review comments on the pull request diff
  commits:
    type: integer
    semantic_role: count
    path: $.commits
    description: Total number of commits in the pull request
  additions:
    type: integer
    semantic_role: count
    path: $.additions
    description: Total number of lines added across all files in the pull request
  deletions:
    type: integer
    semantic_role: count
    path: $.deletions
    description: Total number of lines deleted across all files in the pull request
  changed_files:
    type: integer
    semantic_role: count
    path: $.changed_files
    description: Total number of files modified, added, or deleted in the pull request
  created_at:
    type: timestamp
    semantic_role: event_timestamp
    path: $.created_at
    description: Timestamp when the pull request was first opened
  updated_at:
    type: timestamp
    semantic_role: event_timestamp
    path: $.updated_at
    description: Timestamp of the most recent update to the pull request (push, comment, review, label change, etc.)
  closed_at:
    type: timestamp
    semantic_role: event_timestamp
    path: $.closed_at
    description: Timestamp when the pull request was closed or merged, null if still open
  merged_at:
    type: timestamp
    semantic_role: event_timestamp
    path: $.merged_at
    description: Timestamp when the pull request was merged, null if not merged
extract:
  record_path: $
  pagination:
    type: link_header
  table:
    primary_key:
      - id
    trust_tier: silver
  for_each:
    resource: repos
    bindings:
      - field: owner_login
        input: owner
      - field: name
        input: repo
      - field: full_name
        input: repository_full_name
lookup:
  description: Fetch a single pull request by repository owner, name, and PR number
  api:
    endpoint: /repos/${{ input.owner }}/${{ input.repo }}/pulls/${{ input.pull_number }}
    method: GET
  input:
    owner:
      type: string
      required: true
      description: Repository owner (user or organization login)
    repo:
      type: string
      required: true
      description: Repository name
    pull_number:
      type: integer
      required: true
      description: The pull request number (e.g. 123)
  extract:
    record_path: $
via: rest
