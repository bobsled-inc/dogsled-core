spec_version: '2'
type: source
name: github
description: GitHub REST and GraphQL APIs
transports:
  - id: rest
    base_url: https://api.github.com
    auth: &a1
      type: bearer
      token: ${{ env.GITHUB_TOKEN }}
    timeout_ms: 30000
    retry: &a2
      retry_on:
        - 429
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    headers: &a3
      Accept: application/vnd.github+json
      User-Agent: bobsled-core-extractor
  - id: graphql
    base_url: https://api.github.com
    auth: *a1
    timeout_ms: 30000
    retry: *a2
    headers: *a3
default_transport: rest
