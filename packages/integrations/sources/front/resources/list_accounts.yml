type: resource
name: list_accounts
description: List Accounts
api:
  endpoint: /accounts
  method: GET
  query_params:
    limit: ${{ input.limit }}
    page_token: ${{ input.page_token }}
    sort_by: ${{ input.sort_by }}
    sort_order: ${{ input.sort_order }}
input:
  limit:
    type: integer
    description: Max number of results per [page](https://dev.frontapp.com/docs/pagination)
    maximum: 100
  page_token:
    type: string
    description: Token to use to request the [next page](https://dev.frontapp.com/docs/pagination)
  sort_by:
    type: string
    description: Field used to sort the accounts. Either `created_at` or `updated_at`.
  sort_order:
    type: string
    description: Order by which results should be sorted
    enum:
      - asc
      - desc
output:
  links_self:
    type: string
    path: $._links.self
    description: Link to resource
  links_related:
    type: object
    path: $._links.related
  id:
    type: string
    path: $.id
    description: Unique identifier of the account
  name:
    type: string
    path: $.name
    description: Account name
  logo_url:
    type: string
    path: $.logo_url
    description: URL of the Account's logo
  description:
    type: string
    path: $.description
    description: Account Description
  domains:
    type: array
    path: $.domains
    description: List of domains associated to the Account
  external_id:
    type: string
    path: $.external_id
    description: ID of the Account in an External system, such as your backoffice system or CRM
  custom_fields:
    type: object
    path: $.custom_fields
    description: Custom fields for this account
  created_at:
    type: number
    path: $.created_at
    description: Timestamp when the account was created
  updated_at:
    type: number
    path: $.updated_at
    description: Timestamp when the account was updated
extract:
  record_path: $._results
  paginated: false
  table:
    primary_key:
      - id
    trust_tier: silver
lookup:
  description: Fetch an account
  api:
    endpoint: /accounts/${{ input.account_id }}
    method: GET
  input:
    account_id:
      type: string
      required: true
test:
  fixtures:
    - name: list_accounts_smoke
      input:
        limit: 25
        page_token: example_page_token
        sort_order: asc
