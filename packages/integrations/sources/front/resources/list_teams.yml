type: resource
name: list_teams
description: List teams
api:
  endpoint: /teams
  method: GET
input: {}
output:
  links_self:
    type: string
    path: $._links.self
    description: Link to resource
  id:
    type: string
    path: $.id
    description: Unique identifier of the team
  name:
    type: string
    path: $.name
    description: Name of the team
extract:
  record_path: $._results
  table:
    primary_key:
      - id
    trust_tier: silver
lookup:
  description: Get team
  api:
    endpoint: /teams/${{ input.team_id }}
    method: GET
  input:
    team_id:
      type: string
      required: true
