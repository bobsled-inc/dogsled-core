type: resource
name: list_channels
description: List channels
api:
  endpoint: /channels
  method: GET
input: {}
output:
  links_self:
    type: string
    path: $._links.self
    description: Link to resource
  links_related:
    type: object
    path: $._links.related
  id:
    type: string
    path: $.id
    description: Unique identifier for the channel
  name:
    type: string
    path: $.name
    description: The name of the channel
  address:
    type: string
    path: $.address
    description: Address receiving the messages
  type:
    type: string
    path: $.type
    description: Type of the channel
  send_as:
    type: string
    path: $.send_as
    description: Address which appears as the sender for messages sent from Front
  settings_undo_send_time:
    type: integer
    path: $.settings.undo_send_time
    description: The time (measured in seconds) that users have to undo a send operation in the channel.
  settings_all_teammates_can_reply:
    type: boolean
    path: $.settings.all_teammates_can_reply
    description: Whether teammates without inbox access can reply on this channel.
  is_private:
    type: boolean
    path: $.is_private
    description: Whether or not the channel is individual
  is_valid:
    type: boolean
    path: $.is_valid
    description: Whether or not the channel configuration is valid
extract:
  record_path: $._results
  table:
    primary_key:
      - id
    trust_tier: silver
lookup:
  description: Get channel
  api:
    endpoint: /channels/${{ input.channel_id }}
    method: GET
  input:
    channel_id:
      type: string
      required: true
