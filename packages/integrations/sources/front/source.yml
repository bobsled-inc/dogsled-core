spec_version: '2'
type: source
name: front
description: Front core API for accounts, contacts, conversations, inboxes, and teams
transports:
  - id: default
    base_url: https://api2.frontapp.com
    auth:
      type: bearer
      token: ${{ env.FRONT_API_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 5
      burst: 10
    headers:
      Accept: application/json
      User-Agent: dogsled-extractor
default_transport: default
