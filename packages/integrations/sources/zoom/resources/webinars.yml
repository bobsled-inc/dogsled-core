type: resource
name: webinars
description: Webinars scheduled by a Zoom user.
api:
  endpoint: /users/${{ input.user_id }}/webinars
  method: GET
  query_params:
    page_size: ${{ input.page_size }}
input:
  user_id:
    type: string
    default: me
  page_size:
    type: integer
    default: 30
output:
  id:
    type: string
    path: $.id
  topic:
    type: string
    path: $.topic
  type:
    type: integer
    path: $.type
  start_time:
    type: timestamp
    path: $.start_time
  duration:
    type: integer
    path: $.duration
  timezone:
    type: string
    path: $.timezone
  created_at:
    type: timestamp
    path: $.created_at
extract:
  record_path: $.webinars
  table:
    primary_key:
      - id
  pagination:
    type: cursor
    cursor_path: $.next_page_token
    cursor_param: next_page_token
  for_each:
    resource: users
    field: id
    input: user_id
