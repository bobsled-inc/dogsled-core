type: resource
name: profiles
description: User profiles from Mixpanel Engage.
api:
  endpoint: /engage
  method: GET
input: {}
output:
  distinct_id:
    type: string
    path: $['$distinct_id']
  email:
    type: string
    path: $['$email']
  name:
    type: string
    path: $['$name']
  created:
    type: timestamp
    path: $['$created']
  last_seen:
    type: timestamp
    path: $['$last_seen']
  city:
    type: string
    path: $['$city']
extract:
  record_path: $.results
  table:
    primary_key:
      - distinct_id
