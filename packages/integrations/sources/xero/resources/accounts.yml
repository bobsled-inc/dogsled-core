type: resource
name: accounts
description: Chart of accounts configured in Xero.
api:
  endpoint: /Accounts
  method: GET
  query_params:
    where: ${{ input.where }}
    order: ${{ input.order }}
input:
  where:
    type: string
    description: Filter by an any element
  order:
    type: string
    description: Order by an any element
output:
  code:
    type: string
    path: $.Code
    description: Customer defined alpha numeric account code e.
  name:
    type: string
    path: $.Name
    description: Name of account (max length = 150)
  account_id:
    type: string
    path: $.AccountID
    description: The Xero identifier for an account – specified as a string following  the endpoint name   e.
  type:
    type: string
    path: $.Type
    description: See Account Types
  bank_account_number:
    type: string
    path: $.BankAccountNumber
    description: For bank accounts only (Account Type BANK)
  status:
    type: string
    path: $.Status
    description: Accounts with a status of ACTIVE can be updated to ARCHIVED.
  description:
    type: string
    path: $.Description
    description: Description of the Account.
  bank_account_type:
    type: string
    path: $.BankAccountType
    description: For bank accounts only.
  currency_code:
    type: string
    path: $.CurrencyCode
    description: 3 letter alpha code for the currency – see list of currency codes
  tax_type:
    type: string
    path: $.TaxType
    description: The tax type from taxRates
  enable_payments_to_account:
    type: boolean
    path: $.EnablePaymentsToAccount
    description: Boolean – describes whether account can have payments applied to it
  show_in_expense_claims:
    type: boolean
    path: $.ShowInExpenseClaims
    description: Boolean – describes whether account code is available for use with expense claims
  class:
    type: string
    path: $.Class
    description: See Account Class Types
  system_account:
    type: string
    path: $.SystemAccount
    description: If this is a system account then this element is returned.
  reporting_code:
    type: string
    path: $.ReportingCode
    description: Shown if set
  reporting_code_name:
    type: string
    path: $.ReportingCodeName
    description: Shown if set
  has_attachments:
    type: boolean
    path: $.HasAttachments
    description: boolean to indicate if an account has an attachment (read only)
  updated_date_utc:
    type: string
    path: $.UpdatedDateUTC
    description: Last modified date UTC format
  add_to_watchlist:
    type: boolean
    path: $.AddToWatchlist
    description: Boolean – describes whether the account is shown in the watchlist widget on the dashboard
  validation_errors:
    type: array
    path: $.ValidationErrors
    description: Displays array of validation error messages from the API
extract:
  record_path: $.Accounts
  table:
    primary_key:
      - account_id
