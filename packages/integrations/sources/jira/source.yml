spec_version: '2'
type: source
name: jira
description: Jira Cloud REST API for issues, comments, projects, users, and audit records
transports:
  - id: default
    base_url: https://${{ env.JIRA_SITE }}.atlassian.net
    auth:
      type: basic
      username: ${{ env.JIRA_EMAIL }}
      password: ${{ env.JIRA_API_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 5
      burst: 10
    headers:
      Accept: application/json
      User-Agent: bobsled-core-extractor
default_transport: default
