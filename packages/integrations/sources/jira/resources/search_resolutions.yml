type: resource
name: search_resolutions
description: Search Jira issue resolutions
api:
  endpoint: /rest/api/3/resolution/search
  method: GET
  query_params:
    startAt: ${{ input.start_at }}
    maxResults: ${{ input.max_results }}
    onlyDefault: ${{ input.only_default }}
input:
  start_at:
    type: integer
    description: The index of the first resolution to return
    default: 0
  max_results:
    type: integer
    description: The maximum number of resolutions to return per page
    default: 50
  only_default:
    type: boolean
    description: Whether to only return default resolutions
output:
  id:
    type: string
    path: $.id
    description: Jira resolution identifier
  name:
    type: string
    path: $.name
    description: Resolution name
  description:
    type: string
    path: $.description
    description: Resolution description
  default:
    type: boolean
    path: $.default
    description: Whether the resolution is marked as default
extract:
  record_path: $.values
  pagination:
    type: offset
    offset_param: startAt
    limit_param: maxResults
  table:
    primary_key:
      - id
    trust_tier: silver
verify:
  suppress:
    - PAGINATION_MISMATCH
