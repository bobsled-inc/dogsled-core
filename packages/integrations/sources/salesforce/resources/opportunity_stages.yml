type: resource
name: opportunity_stages
description: Opportunity stages from Salesforce.
api:
  endpoint: /query
  method: GET
  query_params:
    q: SELECT Id,MasterLabel,DefaultProbability,SortOrder,IsClosed,IsWon FROM OpportunityStage
input: {}
output:
  id:
    type: string
    path: $.Id
  master_label:
    type: string
    path: $.MasterLabel
  default_probability:
    type: number
    path: $.DefaultProbability
  sort_order:
    type: integer
    path: $.SortOrder
  is_closed:
    type: boolean
    path: $.IsClosed
  is_won:
    type: boolean
    path: $.IsWon
extract:
  record_path: $.records
  pagination:
    type: next_url
    next_url_path: $.nextRecordsUrl
  table:
    primary_key:
      - id
    trust_tier: silver
