type: resource
name: campaigns
description: Campaigns from Salesforce.
api:
  endpoint: /query
  method: GET
  query_params:
    q: SELECT Id,Name,Status,Type,StartDate,EndDate FROM Campaign
input: {}
output:
  id:
    type: string
    path: $.Id
  name:
    type: string
    path: $.Name
  status:
    type: string
    path: $.Status
  type:
    type: string
    path: $.Type
  start_date:
    type: string
    path: $.StartDate
  end_date:
    type: string
    path: $.EndDate
extract:
  record_path: $.records
  pagination:
    type: next_url
    next_url_path: $.nextRecordsUrl
  table:
    primary_key:
      - id
    trust_tier: silver
