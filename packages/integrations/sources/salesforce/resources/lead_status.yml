type: resource
name: lead_status
description: Lead status values from Salesforce.
api:
  endpoint: /query
  method: GET
  query_params:
    q: SELECT Id,MasterLabel,IsConverted,SortOrder FROM LeadStatus
input: {}
output:
  id:
    type: string
    path: $.Id
  master_label:
    type: string
    path: $.MasterLabel
  is_converted:
    type: boolean
    path: $.IsConverted
  sort_order:
    type: integer
    path: $.SortOrder
extract:
  record_path: $.records
  pagination:
    type: next_url
    next_url_path: $.nextRecordsUrl
  table:
    primary_key:
      - id
    trust_tier: silver
