type: resource
name: users
description: Users from Salesforce.
api:
  endpoint: /query
  method: GET
  query_params:
    q: SELECT Id,Name,Email,IsActive,UserRoleId,LastModifiedDate FROM User
input: {}
output:
  id:
    type: string
    path: $.Id
  name:
    type: string
    path: $.Name
  email:
    type: string
    path: $.Email
  is_active:
    type: boolean
    path: $.IsActive
  user_role_id:
    type: string
    path: $.UserRoleId
  updated_at:
    type: timestamp
    path: $.LastModifiedDate
extract:
  record_path: $.records
  pagination:
    type: next_url
    next_url_path: $.nextRecordsUrl
  table:
    primary_key:
      - id
    trust_tier: silver
