spec_version: '2'
type: source
name: salesforce
description: Salesforce REST API for core CRM objects and user directories.
transports:
  - id: default
    base_url: https://${{ env.SALESFORCE_DOMAIN }}/services/data/${{ env.SALESFORCE_API_VERSION }}
    auth:
      type: bearer
      token: ${{ env.SALESFORCE_ACCESS_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 2
      burst: 4
    headers:
      Accept: application/json
      User-Agent: bobsled-core-extractor
default_transport: default
