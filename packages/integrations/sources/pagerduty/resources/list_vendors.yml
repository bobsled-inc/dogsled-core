type: resource
name: list_vendors
description: List PagerDuty vendor definitions available to the account
api:
  endpoint: /vendors
  method: GET
  query_params:
    limit: ${{ input.limit }}
    offset: ${{ input.offset }}
input:
  limit:
    type: integer
    description: Number of vendors to return per page
    default: 100
  offset:
    type: integer
    description: Pagination offset
    default: 0
output:
  id:
    type: string
    path: $.id
    description: PagerDuty vendor identifier
  summary:
    type: string
    path: $.summary
    description: Vendor summary
  description:
    type: string
    path: $.description
    description: Vendor description
  self:
    type: string
    path: $.self
    description: API URL for the vendor
  html_url:
    type: string
    path: $.html_url
    description: Browser URL for the vendor
extract:
  record_path: $.vendors
  pagination:
    type: offset
    offset_param: offset
    limit_param: limit
  table:
    primary_key:
      - id
    trust_tier: silver
