type: resource
name: list_teams
description: List PagerDuty teams configured in the account
api:
  endpoint: /teams
  method: GET
  query_params:
    limit: ${{ input.limit }}
    offset: ${{ input.offset }}
input:
  limit:
    type: integer
    description: Number of teams to return per page
    default: 100
  offset:
    type: integer
    description: Pagination offset
    default: 0
output:
  id:
    type: string
    path: $.id
    description: PagerDuty team identifier
  summary:
    type: string
    path: $.summary
    description: Team summary
  description:
    type: string
    path: $.description
    description: Team description
  self:
    type: string
    path: $.self
    description: API URL for the team
  html_url:
    type: string
    path: $.html_url
    description: Browser URL for the team
extract:
  record_path: $.teams
  pagination:
    type: offset
    offset_param: offset
    limit_param: limit
  table:
    primary_key:
      - id
    trust_tier: silver
