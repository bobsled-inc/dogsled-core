type: resource
name: list_users
description: List PagerDuty users in the account
api:
  endpoint: /users
  method: GET
  query_params:
    limit: ${{ input.limit }}
    offset: ${{ input.offset }}
    query: ${{ input.query }}
input:
  limit:
    type: integer
    description: Number of users to return per page
    default: 100
  offset:
    type: integer
    description: Pagination offset
    default: 0
  query:
    type: string
    description: Optional search string for user names or emails
query:
  search:
    dialect: provider_search
    bind:
      input: query
output:
  id:
    type: string
    path: $.id
    description: PagerDuty user identifier
  name:
    type: string
    path: $.name
    description: Full name of the user
  email:
    type: string
    path: $.email
    description: Primary email address
  role:
    type: string
    path: $.role
    description: PagerDuty role for the user
  job_title:
    type: string
    path: $.job_title
    description: Job title configured on the user profile
  time_zone:
    type: string
    path: $.time_zone
    description: User time zone
extract:
  record_path: $.users
  pagination:
    type: offset
    offset_param: offset
    limit_param: limit
  table:
    primary_key:
      - id
    trust_tier: silver
