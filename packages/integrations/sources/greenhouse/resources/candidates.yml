type: resource
name: candidates
description: List Greenhouse candidates
api:
  endpoint: /candidates
  method: GET
  query_params:
    per_page: ${{ input.per_page }}
input:
  per_page:
    type: integer
    description: Number of candidates to return per page
    default: 100
output:
  id:
    type: integer
    path: $.id
    description: Greenhouse candidate identifier
  first_name:
    type: string
    path: $.first_name
    description: Candidate first name
  last_name:
    type: string
    path: $.last_name
    description: Candidate last name
  company:
    type: string
    path: $.company
    description: Candidate current company
  created_at:
    type: timestamp
    path: $.created_at
    description: Candidate creation timestamp
  updated_at:
    type: timestamp
    path: $.updated_at
    description: Candidate last update timestamp
  last_activity:
    type: timestamp
    path: $.last_activity
    description: Last recorded candidate activity
extract:
  record_path: $
  pagination:
    type: link_header
  table:
    primary_key:
      - id
    trust_tier: silver
