type: resource
name: users
description: List Greenhouse users
api:
  endpoint: /users
  method: GET
  query_params:
    per_page: ${{ input.per_page }}
input:
  per_page:
    type: integer
    description: Number of users to return per page
    default: 100
output:
  id:
    type: integer
    path: $.id
    description: Greenhouse user identifier
  name:
    type: string
    path: $.name
    description: User full name
  employee_id:
    type: string
    path: $.employee_id
    description: External employee identifier
  disabled:
    type: boolean
    path: $.disabled
    description: Whether the user is disabled
  created_at:
    type: timestamp
    path: $.created_at
    description: User creation timestamp
  updated_at:
    type: timestamp
    path: $.updated_at
    description: User last update timestamp
extract:
  record_path: $
  pagination:
    type: link_header
  table:
    primary_key:
      - id
    trust_tier: silver
