type: resource
name: jobs
description: List Greenhouse jobs
api:
  endpoint: /jobs
  method: GET
  query_params:
    per_page: ${{ input.per_page }}
input:
  per_page:
    type: integer
    description: Number of jobs to return per page
    default: 100
output:
  id:
    type: integer
    path: $.id
    description: Greenhouse job identifier
  name:
    type: string
    path: $.name
    description: Job name
  requisition_id:
    type: string
    path: $.requisition_id
    description: External requisition identifier
  status:
    type: string
    path: $.status
    description: Job status
  created_at:
    type: timestamp
    path: $.created_at
    description: Job creation timestamp
  updated_at:
    type: timestamp
    path: $.updated_at
    description: Job last update timestamp
extract:
  record_path: $
  pagination:
    type: link_header
  table:
    primary_key:
      - id
    trust_tier: silver
