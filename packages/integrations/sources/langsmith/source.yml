spec_version: '2'
type: source
# Self-describing custom API source — no bundled connector module is required.
# `source_type` is read by Dogsled; `bobsled_source_kind` is the orchestrator/
# host application marker (stripped + ignored by the Dogsled CLI).
source_type: custom_api
bobsled_source_kind: custom_api
name: langsmith
description: LangSmith observability and evaluation platform by LangChain.
# Declares the env vars the inline transport interpolates, in lieu of a
# meta.yml auth_setup block.
auth_env_vars:
  - LANGSMITH_API_KEY
  - LANGSMITH_WORKSPACE_ID
transports:
  - id: default
    base_url: https://api.smith.langchain.com
    auth:
      type: api-key
      header: x-api-key
      key: ${{ env.LANGSMITH_API_KEY }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 10
      burst: 20
    headers:
      Accept: application/json
  - id: workspace
    base_url: https://api.smith.langchain.com
    auth:
      type: api-key
      header: x-api-key
      key: ${{ env.LANGSMITH_API_KEY }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 10
      burst: 20
    headers:
      Accept: application/json
      X-Tenant-Id: ${{ env.LANGSMITH_WORKSPACE_ID }}
default_transport: workspace
