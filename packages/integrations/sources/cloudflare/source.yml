spec_version: '2'
type: source
name: cloudflare
description: Cloudflare API for accounts, zones, and DNS records
transports:
  - id: default
    base_url: https://api.cloudflare.com/client/v4
    auth:
      type: bearer
      token: ${{ env.CLOUDFLARE_API_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 4
      burst: 8
    headers:
      Accept: application/json
      User-Agent: dogsled-extractor
default_transport: default
