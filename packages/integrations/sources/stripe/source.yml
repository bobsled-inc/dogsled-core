spec_version: '2'
type: source
name: stripe
description: Stripe API for payments and billing
transports:
  - id: default
    base_url: https://api.stripe.com
    auth:
      type: bearer
      token: ${{ env.STRIPE_SECRET_KEY }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 25
      burst: 50
    headers:
      User-Agent: dogsled-extractor
default_transport: default
