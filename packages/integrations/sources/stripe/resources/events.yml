type: resource
name: events
description: Stripe events representing webhook and API activity log entries that record changes to
  objects in your account
api:
  endpoint: /v1/events
  method: GET
  query_params:
    limit: ${{ input.limit }}
    created[gte]: ${{ input.created_gte }}
input:
  limit:
    type: integer
    description: Number of events to return per page (max 100)
    default: 100
  created_gte:
    type: integer
    description: Only return records created on or after this Unix timestamp.
query:
  filters:
    created:
      operators:
        - gte
      description: Only return records created on or after this Unix timestamp.
      bind:
        gte:
          input: created_gte
      compile:
        gte:
          mode: http_query
          param: created[gte]
output:
  id:
    type: string
    path: $.id
    description: Unique event identifier prefixed with evt_ (e.g. evt_1A2b3C4d5E6f7G). Events are
      retained for 30 days
  type:
    type: string
    path: $.type
    description: Description of the event type in dot notation (e.g. charge.succeeded, invoice.paid,
      customer.subscription.created, payment_intent.succeeded). Over 100 event types exist across
      all Stripe resources
  api_version:
    type: string
    path: $.api_version
    description:
      Stripe API version used to render the event data (e.g. 2023-10-16). Events are rendered
      using the API version active when the event occurred
  created:
    type: integer
    path: $.created
    description: Unix timestamp (seconds since epoch) when the event occurred
  data_object_id:
    type: string
    path: $.data.object.id
    description: ID of the Stripe object that triggered this event (e.g. ch_xxx for charge events,
      in_xxx for invoice events, sub_xxx for subscription events)
  request_id:
    type: string
    path: $.request.id
    description:
      ID of the API request (req_xxx) that triggered this event. Null for events generated by
      the Stripe Dashboard or automated processes
  request_idempotency_key:
    type: string
    path: $.request.idempotency_key
    description:
      Idempotency key provided with the API request that triggered this event, if any. Used
      to prevent duplicate operations
  pending_webhooks:
    type: integer
    path: $.pending_webhooks
    description:
      Number of webhook endpoints that have not yet been notified about this event. Decreases
      as webhooks are delivered
  livemode:
    type: boolean
    path: $.livemode
    description:
      Whether this event occurred in live mode (true) or test mode (false). Test mode events
      only appear when using test API keys
extract:
  record_path: $.data
  pagination:
    type: cursor
    cursor_path: $.data[-1].id
    cursor_param: starting_after
  table:
    primary_key:
      - id
    trust_tier: silver
incremental:
  strategy: server_filter
  cursor_field: created
  cursor_type: integer
  since_argument: created[gte]
  value_format: unix_seconds
  initial_lookback_seconds: 2592000
  lookback_seconds: 86400
