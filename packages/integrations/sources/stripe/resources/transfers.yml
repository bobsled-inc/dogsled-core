type: resource
name: transfers
description: Stripe fund transfers to connected accounts
api:
  endpoint: /v1/transfers
  method: GET
  query_params:
    limit: ${{ input.limit }}
    created[gte]: ${{ input.created_gte }}
input:
  limit:
    type: integer
    description: Number of transfers per page (max 100)
    default: 100
  created_gte:
    type: integer
    description: Only return records created on or after this Unix timestamp.
query:
  filters:
    created:
      operators:
        - gte
      description: Only return records created on or after this Unix timestamp.
      bind:
        gte:
          input: created_gte
      compile:
        gte:
          mode: http_query
          param: created[gte]
output:
  id:
    type: string
    path: $.id
    description: Transfer ID (tr_xxx)
  amount:
    type: integer
    path: $.amount
    description: Transfer amount in cents
  currency:
    type: string
    path: $.currency
    description: Three-letter ISO currency code
  description:
    type: string
    path: $.description
    description: Transfer description
  destination:
    type: string
    path: $.destination
    description: Connected account ID
  source_type:
    type: string
    path: $.source_type
    description: Source type for the transfer
  created:
    type: integer
    path: $.created
    description: Unix timestamp when transfer was created
extract:
  record_path: $.data
  pagination:
    type: cursor
    cursor_path: $.data[-1].id
    cursor_param: starting_after
  table:
    primary_key:
      - id
    trust_tier: silver
incremental:
  strategy: server_filter
  cursor_field: created
  cursor_type: integer
  since_argument: created[gte]
  value_format: unix_seconds
  initial_lookback_seconds: 2592000
  lookback_seconds: 86400
