type: resource
name: invoices
description: Stripe invoices representing statements of amounts owed by customers
api:
  endpoint: /v1/invoices
  method: GET
  query_params:
    limit: ${{ input.limit }}
    created[gte]: ${{ input.created_gte }}
    status: ${{ input.status }}
    customer: ${{ input.customer }}
    subscription: ${{ input.subscription }}
input:
  limit:
    type: integer
    description: Number of invoices to return per page (max 100)
    default: 100
  status:
    type: string
    description:
      'Filter by invoice status. Possible values: draft (not yet finalized), open (finalized
      and awaiting payment), paid (successfully paid), uncollectible (marked as unlikely to be
      paid), void (canceled and no longer valid)'
  customer:
    type: string
    description: Filter invoices by customer ID (cus_xxx) to retrieve all invoices for a specific customer
  subscription:
    type: string
    description: Filter invoices by subscription ID (sub_xxx) to retrieve invoices generated by a
      specific subscription
  created_gte:
    type: integer
    description: Only return records created on or after this Unix timestamp.
query:
  filters:
    created:
      operators:
        - gte
      description: Only return records created on or after this Unix timestamp.
      bind:
        gte:
          input: created_gte
      compile:
        gte:
          mode: http_query
          param: created[gte]
    customer:
      operators:
        - eq
      description: Filter invoices by customer ID (cus_xxx) to retrieve all invoices for a specific customer
      bind:
        eq:
          input: customer
      compile:
        eq:
          mode: http_query
          param: customer
    status:
      operators:
        - eq
      description:
        'Filter by invoice status. Possible values: draft (not yet finalized), open (finalized
        and awaiting payment), paid (successfully paid), uncollectible (marked as unlikely to be
        paid), void (canceled and no longer valid)'
      bind:
        eq:
          input: status
      compile:
        eq:
          mode: http_query
          param: status
    subscription:
      operators:
        - eq
      description: Filter invoices by subscription ID (sub_xxx) to retrieve invoices generated by a
        specific subscription
      bind:
        eq:
          input: subscription
      compile:
        eq:
          mode: http_query
          param: subscription
output:
  id:
    type: string
    path: $.id
    description: Unique invoice identifier prefixed with in_ (e.g. in_1A2b3C4d5E6f7G)
  customer:
    type: string
    path: $.customer
    description: ID of the customer (cus_xxx) this invoice belongs to
  subscription:
    type: string
    path: $.subscription
    description: ID of the subscription (sub_xxx) that generated this invoice. Null for one-off invoices
  status:
    type: string
    path: $.status
    description:
      'Current status of the invoice. Possible values: draft (editable, not yet sent), open
      (finalized and sent to customer), paid (payment received), uncollectible (all collection
      attempts exhausted), void (canceled by merchant)'
  amount_due:
    type: integer
    path: $.amount_due
    description: Total amount due in the smallest currency unit (e.g. cents for USD) after applying
      discounts and credits
  amount_paid:
    type: integer
    path: $.amount_paid
    description: Amount that has been paid toward this invoice in the smallest currency unit
  amount_remaining:
    type: integer
    path: $.amount_remaining
    description: Amount still owed on this invoice in the smallest currency unit. Equals amount_due
      minus amount_paid
  currency:
    type: string
    path: $.currency
    description: Three-letter ISO 4217 currency code in lowercase (e.g. usd, eur, gbp)
  due_date:
    type: integer
    path: $.due_date
    description:
      Unix timestamp when payment for this invoice is due. Only applicable for invoices with
      collection_method set to send_invoice
  paid:
    type: boolean
    path: $.paid
    description: Whether the invoice has been paid in full
  attempted:
    type: boolean
    path: $.attempted
    description: Whether an automatic payment attempt has been made for this invoice
  attempt_count:
    type: integer
    path: $.attempt_count
    description: Number of automatic payment attempts made for this invoice. Stripe retries failed
      payments according to your retry settings
  hosted_invoice_url:
    type: string
    path: $.hosted_invoice_url
    description: URL for the Stripe-hosted invoice page where the customer can pay or download the invoice
  invoice_pdf:
    type: string
    path: $.invoice_pdf
    description: URL for the PDF version of the invoice. Available after the invoice is finalized
  number:
    type: string
    path: $.number
    description: Human-readable invoice number that appears on the invoice PDF and hosted page (e.g. INV-{number})
  period_start:
    type: integer
    path: $.period_start
    description: Unix timestamp marking the start of the billing period covered by this invoice
  period_end:
    type: integer
    path: $.period_end
    description: Unix timestamp marking the end of the billing period covered by this invoice
  total:
    type: integer
    path: $.total
    description: Total amount of the invoice in the smallest currency unit including tax and discounts
  subtotal:
    type: integer
    path: $.subtotal
    description: Total amount of the invoice before tax in the smallest currency unit
  tax:
    type: integer
    path: $.tax
    description:
      Total tax amount applied to the invoice in the smallest currency unit. Null if tax was
      not calculated
  created:
    type: integer
    path: $.created
    description: Unix timestamp (seconds since epoch) when the invoice was created
extract:
  record_path: $.data
  pagination:
    type: cursor
    cursor_path: $.data[-1].id
    cursor_param: starting_after
  table:
    primary_key:
      - id
    trust_tier: silver
incremental:
  strategy: server_filter
  cursor_field: created
  cursor_type: integer
  since_argument: created[gte]
  value_format: unix_seconds
  initial_lookback_seconds: 2592000
  lookback_seconds: 86400
