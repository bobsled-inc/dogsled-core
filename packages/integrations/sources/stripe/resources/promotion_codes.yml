type: resource
name: promotion_codes
description: Stripe promotion codes for coupons
api:
  endpoint: /v1/promotion_codes
  method: GET
  query_params:
    limit: ${{ input.limit }}
    created[gte]: ${{ input.created_gte }}
input:
  limit:
    type: integer
    description: Number of promotion codes per page (max 100)
    default: 100
  created_gte:
    type: integer
    description: Only return records created on or after this Unix timestamp.
query:
  filters:
    created:
      operators:
        - gte
      description: Only return records created on or after this Unix timestamp.
      bind:
        gte:
          input: created_gte
      compile:
        gte:
          mode: http_query
          param: created[gte]
output:
  id:
    type: string
    path: $.id
    description: Promotion code ID (promo_xxx)
  code:
    type: string
    path: $.code
    description: The promotion code string
  coupon:
    type: string
    path: $.coupon
    description: Coupon ID associated with the promotion code
  active:
    type: boolean
    path: $.active
    description: Whether the promotion code is currently active
  max_redemptions:
    type: integer
    path: $.max_redemptions
    description: Maximum number of times the promotion code can be redeemed
  times_redeemed:
    type: integer
    path: $.times_redeemed
    description: Number of times the promotion code has been redeemed
  expires_at:
    type: integer
    path: $.expires_at
    description: Unix timestamp when the promotion code expires or null
  created:
    type: integer
    path: $.created
    description: Unix timestamp when promotion code was created
extract:
  record_path: $.data
  pagination:
    type: cursor
    cursor_path: $.data[-1].id
    cursor_param: starting_after
  table:
    primary_key:
      - id
    trust_tier: silver
incremental:
  strategy: server_filter
  cursor_field: created
  cursor_type: integer
  since_argument: created[gte]
  value_format: unix_seconds
  initial_lookback_seconds: 2592000
  lookback_seconds: 86400
