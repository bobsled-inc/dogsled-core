type: resource
name: get_authorized_teams
description: Get Authorized Workspaces
api:
  endpoint: /v2/team
  method: GET
input: {}
output:
  id:
    type: string
    path: $.id
  name:
    type: string
    path: $.name
  color:
    type: string
    path: $.color
  avatar:
    type: string
    path: $.avatar
  members:
    type: array
    path: $.members
extract:
  record_path: $.teams
  table:
    primary_key:
      - id
    trust_tier: silver
