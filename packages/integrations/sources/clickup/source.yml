spec_version: '2'
type: source
name: clickup
description: ClickUp project management API
transports:
  - id: default
    base_url: https://api.clickup.com/api
    auth:
      type: bearer
      token: ${{ env.CLICKUP_API_KEY }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 10
      burst: 20
    headers:
      Accept: application/json
      User-Agent: dogsled-extractor
default_transport: default
