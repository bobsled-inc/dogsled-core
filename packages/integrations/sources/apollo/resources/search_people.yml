type: resource
name: search_people
description: Search Apollo people
api:
  endpoint: /api/v1/mixed_people/search
  method: POST
  request_body:
    page: 1
    per_page: 100
input: {}
output:
  id:
    type: string
    path: $.id
    description: Person identifier
  first_name:
    type: string
    path: $.first_name
    description: First name
  last_name:
    type: string
    path: $.last_name
    description: Last name
  email:
    type: string
    path: $.email
    description: Email address
  organization_name:
    type: string
    path: $.organization.name
    description: Organization name
extract:
  record_path: $.people
  table:
    primary_key:
      - id
    trust_tier: silver
