spec_version: '2'
type: source
name: apollo
description: Apollo API for people, companies, contacts, tasks, and sequences
transports:
  - id: default
    base_url: https://api.apollo.io
    auth:
      type: api-key
      header: X-Api-Key
      key: ${{ env.APOLLO_API_KEY }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 5
      burst: 10
    headers:
      Accept: application/json
      User-Agent: bobsled-core-extractor
default_transport: default
