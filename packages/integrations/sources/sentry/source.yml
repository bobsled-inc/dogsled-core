spec_version: '2'
type: source
name: sentry
description: Extract organizations, projects, teams, releases, and issue data from Sentry.
transports:
  - id: default
    base_url: https://sentry.io
    auth:
      type: bearer
      token: ${{ env.SENTRY_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 10
      burst: 20
    headers:
      Accept: application/json
      User-Agent: bobsled-core-extractor
default_transport: default
