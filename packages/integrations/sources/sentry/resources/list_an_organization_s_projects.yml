    path: $.hasInsightsAgentMonitoring
  has_insights_mcp:
    type: boolean
    path: $.hasInsightsMCP
  has_logs:
    type: boolean
    path: $.hasLogs
  has_trace_metrics:
    type: boolean
    path: $.hasTraceMetrics
  team_id:
    type: string
    path: $.team.id
  team_name:
    type: string
    path: $.team.name
  team_slug:
    type: string
    path: $.team.slug
  teams:
