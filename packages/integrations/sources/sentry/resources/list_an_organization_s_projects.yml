type: resource
name: list_an_organization_s_projects
description: Return a list of projects bound to a organization.
api:
  endpoint: /api/0/organizations/${{ input.organization_id_or_slug }}/projects/
  method: GET
  query_params:
    cursor: ${{ input.cursor }}
input:
  organization_id_or_slug:
    type: string
    required: true
    description: The ID or slug of the organization the resource belongs to.
  cursor:
    type: string
    description:
      A pointer to the last object fetched and its sort order; used to retrieve the next or
      previous results.
    minLength: 1
output:
  latest_deploys:
    type: object
    path: $.latestDeploys
  options:
    type: object
    path: $.options
  stats:
    type: string
    path: $.stats
  transaction_stats:
    type: string
    path: $.transactionStats
  session_stats:
    type: string
    path: $.sessionStats
  id:
    type: string
    path: $.id
  slug:
    type: string
    path: $.slug
  name:
    type: string
    path: $.name
  platform:
    type: string
    path: $.platform
  date_created:
    type: timestamp
    path: $.dateCreated
  is_bookmarked:
    type: boolean
    path: $.isBookmarked
  is_member:
    type: boolean
    path: $.isMember
  features:
    type: array
    path: $.features
  first_event:
    type: timestamp
    path: $.firstEvent
  first_transaction_event:
    type: boolean
    path: $.firstTransactionEvent
  access:
    type: array
    path: $.access
  has_access:
    type: boolean
    path: $.hasAccess
  has_feedbacks:
    type: boolean
    path: $.hasFeedbacks
  has_flags:
    type: boolean
    path: $.hasFlags
  has_minified_stack_trace:
    type: boolean
    path: $.hasMinifiedStackTrace
  has_monitors:
    type: boolean
    path: $.hasMonitors
  has_new_feedbacks:
    type: boolean
    path: $.hasNewFeedbacks
  has_profiles:
    type: boolean
    path: $.hasProfiles
  has_replays:
    type: boolean
    path: $.hasReplays
  has_sessions:
    type: boolean
    path: $.hasSessions
  has_insights_http:
    type: boolean
    path: $.hasInsightsHttp
  has_insights_db:
    type: boolean
    path: $.hasInsightsDb
  has_insights_assets:
    type: boolean
    path: $.hasInsightsAssets
  has_insights_app_start:
    type: boolean
    path: $.hasInsightsAppStart
  has_insights_screen_load:
