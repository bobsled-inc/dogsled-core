type: resource
name: list_an_organization_s_repositories
description: Return a list of version control repositories for a given organization.
api:
  endpoint: /api/0/organizations/${{ input.organization_id_or_slug }}/repos/
  method: GET
  query_params:
    cursor: ${{ input.cursor }}
input:
  organization_id_or_slug:
    type: string
    required: true
    description: The organization short name.
  cursor:
    type: string
    description:
      A pointer to the last object fetched and its sort order; used to retrieve the next or
      previous results.
output:
  date_created:
    type: string
    path: $.dateCreated
  id:
    type: string
    path: $.id
  name:
    type: string
    path: $.name
extract:
  record_path: $
  pagination:
    type: link_header
  for_each:
    resource: list_your_organizations
    field: slug
    input: organization_id_or_slug
  table:
    primary_key:
      - id
