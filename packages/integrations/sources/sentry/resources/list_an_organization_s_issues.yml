type: resource
name: list_an_organization_s_issues
description: Return a list of issues for an organization.
api:
  endpoint: /api/0/organizations/${{ input.organization_id_or_slug }}/issues/
  method: GET
  query_params:
    environment: ${{ input.environment }}
    project: ${{ input.project }}
    statsPeriod: ${{ input.stats_period }}
    start: ${{ input.start }}
    end: ${{ input.end }}
    groupStatsPeriod: ${{ input.group_stats_period }}
    shortIdLookup: ${{ input.short_id_lookup }}
    query: ${{ input.query }}
    viewId: ${{ input.view_id }}
    sort: ${{ input.sort }}
    limit: ${{ input.limit }}
    expand: ${{ input.expand }}
    collapse: ${{ input.collapse }}
    cursor: ${{ input.cursor }}
input:
  organization_id_or_slug:
    type: string
    required: true
    description: The ID or slug of the organization the resource belongs to.
  environment:
    type: array
    description: The name of environments to filter by.
  project:
    type: array
    description: |
      The IDs of projects to filter by. `-1` means all available projects.
      For example, the following are valid parameters:
      - `/?project=1234&project=56789`
      - `/?project=-1`
  stats_period:
    type: string
    description: >-
      The period of time for the query, will override the start & end parameters, a number followed
      by one of:

      - `d` for days

      - `h` for hours

      - `m` for minutes

      - `s` for seconds

      - `w` for weeks


      For example, `24h`, to mean query data starting from 24 hours ago to now.
  start:
    type: timestamp
    description: The start of the period of time for the query, expected in ISO-8601 format. For
      example, `2001-12-14T12:34:56.7890`.
  end:
    type: timestamp
    description:
      The end of the period of time for the query, expected in ISO-8601 format. For example,
      `2001-12-14T12:34:56.7890`.
  group_stats_period:
    type: string
    description: The timeline on which stats for the groups should be presented.
    enum:
      - ''
      - 14d
      - 24h
      - auto
  short_id_lookup:
    type: string
    description: If this is set to `1` then the query will be parsed for issue short IDs. These may
      ignore other filters (e.g. projects), which is why it is an opt-in.
    enum:
      - '0'
      - '1'
  query:
    type: string
    description: An optional search query for filtering issues. A default query will apply if no
      view/query is set. For all results use this parameter with an empty string.
    default: is:unresolved
  view_id:
    type: string
    description:
      The ID of the view to use. If no query is present, the view's query and filters will be
      applied.
  sort:
    type: string
    description:
      The sort order of the view. Options include 'Last Seen' (`date`), 'First Seen' (`new`),
      'Trends' (`trends`), 'Events' (`freq`), 'Users' (`user`), and 'Date Added' (`inbox`).
    enum:
      - date
      - freq
      - inbox
      - new
      - trends
      - user
    default: date
  limit:
    type: integer
    description: The maximum number of issues to affect. The maximum is 100.
    default: 100
  expand:
    type: array
    description: Additional data to include in the response.
  collapse:
    type: array
    description: Fields to remove from the response to improve query performance.
  cursor:
    type: string
    description:
      A pointer to the last object fetched and its sort order; used to retrieve the next or
      previous results.
    minLength: 1
query:
  search:
    dialect: sentry_issue_query
    bind:
      input: query
output:
  id:
    type: string
    path: $.id
  share_id:
    type: string
    path: $.shareId
  short_id:
    type: string
