type: resource
name: composition
description: Fetch composition report rows from Amplitude
api:
  endpoint: /api/2/composition
  method: GET
  query_params:
    start: ${{ input.start }}
    end: ${{ input.end }}
    p: ${{ input.property }}
input:
  start:
    type: string
    description: Start date in YYYYMMDD format
  end:
    type: string
    description: End date in YYYYMMDD format
  property:
    type: string
    description: Property to break down by
output:
  value:
    type: string
    path: $.value
    description: Dimension value
  count:
    type: number
    path: $.count
    description: Observed count
  percentage:
    type: number
    path: $.percentage
    description: Percentage share
extract:
  record_path: $.data
  table:
    primary_key:
      - value
    trust_tier: silver
