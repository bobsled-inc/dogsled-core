type: resource
name: user_search
description: Search for Amplitude users
api:
  endpoint: /api/2/usersearch
  method: GET
  query_params:
    user: ${{ input.user }}
input:
  user:
    type: string
    description: Amplitude ID or user ID to search for
output:
  amplitude_id:
    type: string
    path: $.amplitude_id
    description: Amplitude user identifier
  user_id:
    type: string
    path: $.user_id
    description: External user identifier
  last_seen:
    type: timestamp
    path: $.last_seen
    description: Last seen timestamp
extract:
  record_path: $.matches
  table:
    primary_key:
      - amplitude_id
    trust_tier: silver
