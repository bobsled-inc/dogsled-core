spec_version: '2'
type: source
name: linear
description: Linear GraphQL API
transports:
  - id: graphql
    base_url: https://api.linear.app
    auth:
      type: api-key
      header: Authorization
      key: ${{ env.LINEAR_API_KEY }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 1.3
      burst: 5
    headers:
      User-Agent: bobsled-core-extractor
  - id: mcp
    type: mcp_http
    url: https://mcp.linear.app/mcp
    auth:
      type: bearer
      token: ${{ env.LINEAR_API_KEY }}
    timeout_ms: 30000
    retry:
      max_retries: 3
      backoff: exponential
    rate_limit:
      requests_per_second: 5
      burst: 10
default_transport: graphql
