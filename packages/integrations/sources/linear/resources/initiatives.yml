type: resource
name: initiatives
description: Strategic initiatives from Linear representing high-level organizational goals that group multiple projects together for tracking company-wide objectives
api:
  endpoint: /graphql
  method: POST
  request_body:
    query: "query($after: String, $updatedAfter: DateTimeOrDuration) {\n  initiatives(first: 50, after: $after, filter: { updatedAt: { gte: $updatedAfter } }) {\n    nodes {\n      id name description color icon slugId\n      status\n      createdAt updatedAt\n    }\n    pageInfo { hasNextPage endCursor }\n  }\n}"
    variables:
      after: null
      updatedAfter: ${{ input.updated_after }}
input:
  updated_after:
    type: string
    description: "ISO 8601 timestamp \u2014 only fetch records updated on or after this date (default fetches all)"
    default: 2000-01-01 00:00:00+00:00
output:
  id:
    type: string
    path: $.id
    description: Unique initiative UUID assigned by Linear
  name:
    type: string
    path: $.name
    description: Human-readable initiative name representing the strategic goal or theme (e.g. "Q1 Platform Reliability", "Customer Onboarding Revamp")
  description:
    type: string
    path: $.description
    description: Detailed initiative description in markdown format outlining the strategic objective, success criteria, and scope
  color:
    type: string
    path: $.color
    description: Hex color code used to visually distinguish the initiative in the Linear UI and roadmap views
  icon:
    type: string
    path: $.icon
    description: Emoji or icon identifier displayed alongside the initiative name for quick visual recognition
  slug_id:
    type: string
    path: $.slugId
    description: URL-safe slug identifier used in the initiative's web URL path
  status:
    type: string
    path: $.status
    description: Current lifecycle status of the initiative indicating its progress stage within the organization's planning workflow
  created_at:
    type: timestamp
    path: $.createdAt
    description: ISO 8601 timestamp when the initiative was first created
  updated_at:
    type: timestamp
    path: $.updatedAt
    description: ISO 8601 timestamp when the initiative was last modified, including changes to associated projects
extract:
  record_path: $.data.initiatives.nodes
  pagination:
    type: cursor
    cursor_path: $.data.initiatives.pageInfo.endCursor
    cursor_param: variables.after
  table:
    primary_key:
      - id
    trust_tier: silver
incremental:
  strategy: cursor
  cursor_field: updated_at
  cursor_param: variables.updatedAfter
via: graphql
