type: resource
name: issues_graphql
via: graphql
entity: issues
description: Issues from Linear with state, assignee, team, and project metadata
api:
  endpoint: /graphql
  method: POST
  request_body:
    query: "query($after: String, $updatedAfter: DateTimeOrDuration) {\n  issues(first: 50, after: $after, orderBy: updatedAt, filter: { updatedAt: { gte: $updatedAfter } }) {\n    nodes {\n      id identifier title description\n      priority priorityLabel estimate\n      state { id name type }\n      assignee { id name email }\n      team { id name key }\n      project { id name }\n      createdAt updatedAt completedAt canceledAt dueDate\n    }\n    pageInfo { hasNextPage endCursor }\n  }\n}"
    variables:
      after: null
      updatedAfter: ${{ input.updated_after }}
input:
  updated_after:
    type: string
    description: "ISO 8601 timestamp \u2014 only fetch issues updated on or after this date (default fetches all)"
    default: 2000-01-01 00:00:00+00:00
output:
  id:
    type: string
    path: $.id
    description: Unique issue UUID
  identifier:
    type: string
    path: $.identifier
    description: Human-readable issue identifier (e.g. TEAM-{number})
  title:
    type: string
    path: $.title
    description: Issue title
  description:
    type: string
    path: $.description
    description: Issue description in markdown
  priority:
    type: integer
    path: $.priority
    description: Priority as integer (0=none, 1=urgent, 2=high, 3=medium, 4=low)
  priority_label:
    type: string
    path: $.priorityLabel
    description: Human-readable priority label
  estimate:
    type: number
    path: $.estimate
    description: Effort estimate in points
  state_id:
    type: string
    path: $.state.id
    description: UUID of the workflow state
  state_name:
    type: string
    path: $.state.name
    description: Name of the workflow state (e.g. In Progress, Done)
  state_type:
    type: string
    path: $.state.type
    description: "State category \u2014 backlog, unstarted, started, completed, cancelled"
  assignee_id:
    type: string
    path: $.assignee.id
    description: UUID of the assigned user
  assignee_name:
    type: string
    path: $.assignee.name
    description: Display name of the assignee
  assignee_email:
    type: string
    path: $.assignee.email
    description: Email of the assignee
  team_id:
    type: string
    path: $.team.id
    description: UUID of the team
  team_name:
    type: string
    path: $.team.name
    description: Team display name
  team_key:
    type: string
    path: $.team.key
    description: Team key prefix used in issue identifiers
  project_id:
    type: string
    path: $.project.id
    description: UUID of the parent project
  project_name:
    type: string
    path: $.project.name
    description: Project display name
  created_at:
    type: timestamp
    path: $.createdAt
    description: Timestamp when the issue was created
  updated_at:
    type: timestamp
    path: $.updatedAt
    description: Timestamp when the issue was last updated
  completed_at:
    type: timestamp
    path: $.completedAt
    description: Timestamp when the issue was completed
  canceled_at:
    type: timestamp
    path: $.canceledAt
    description: Timestamp when the issue was cancelled
  due_date:
    type: string
    path: $.dueDate
    description: Due date as YYYY-MM-DD string
query:
  filters:
    updated_at:
      operators:
        - gte
      description: Only return records updated on or after the given ISO 8601 timestamp.
      bind:
        gte:
          input: updated_after
          preserve_default: true
      compile:
        gte:
          mode: direct_arg
          argument: updated_after
extract:
  record_path: $.data.issues.nodes
  pagination:
    type: cursor
    cursor_path: $.data.issues.pageInfo.endCursor
    cursor_param: variables.after
  table:
    primary_key:
      - id
    trust_tier: silver
incremental:
  strategy: cursor
  cursor_field: updated_at
  cursor_param: variables.updatedAfter
