type: resource
name: teams_mcp
via: mcp
entity: teams
description: Teams from Linear workspace
tool:
  tool_name: list_teams
input:
  limit:
    type: integer
    description: Maximum number of teams per MCP page
    default: 250
  query:
    type: string
    description: Optional team search string
  orderBy:
    type: string
    description: Sort field for Linear MCP pagination
    default: updatedAt
    enum:
      - createdAt
      - updatedAt
  createdAt:
    type: string
    description: Optional created-after ISO 8601 date or duration
  updatedAt:
    type: string
    description: Optional updated-after ISO 8601 date or duration
  includeArchived:
    type: boolean
    description: Include archived teams
    default: false
output:
  id:
    type: string
    path: $.id
    description: Unique team UUID
  name:
    type: string
    path: $.name
    description: Team display name
  key:
    type: string
    path: $.key
    description: Team key prefix used in issue identifiers
  description:
    type: string
    path: $.description
    description: Team description
extract:
  record_path: $.teams
  pagination:
    type: mcp_cursor
    cursor_path: $.pageInfo.endCursor
    cursor_argument: cursor
  table:
    primary_key:
      - id
