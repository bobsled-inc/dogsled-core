type: resource
name: compatibility
description: Compatibility checks for dimensions and metrics on a property.
api:
  endpoint: /properties/${{ input.property_id }}:checkCompatibility
  method: POST
  request_body:
    dimensions:
      - name: date
    metrics:
      - name: activeUsers
input:
  property_id:
    type: string
    required: true
    default: '123456789'
output:
  api_name:
    type: string
    path: $.dimensionMetadata.apiName
  ui_name:
    type: string
    path: $.dimensionMetadata.uiName
  compatibility:
    type: string
    path: $.compatibility
  category:
    type: string
    path: $.dimensionMetadata.category
extract:
  record_path: $.dimensionCompatibilities
  table:
    primary_key:
      - api_name
