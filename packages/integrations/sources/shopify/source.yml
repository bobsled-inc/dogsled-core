spec_version: '2'
type: source
name: shopify
description: Shopify Admin REST API for customers, orders, products, and collections.
transports:
  - id: default
    base_url: https://${{ env.SHOPIFY_STORE }}.myshopify.com/admin/api/2026-04
    auth:
      type: api-key
      header: X-Shopify-Access-Token
      key: ${{ env.SHOPIFY_ADMIN_ACCESS_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 10
      burst: 20
    headers:
      Accept: application/json
      User-Agent: bobsled-core-extractor
default_transport: default
