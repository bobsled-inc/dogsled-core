type: resource
name: blogs
description: Store blogs in Shopify.
api:
  endpoint: /blogs.json
  method: GET
  query_params:
    limit: ${{ input.limit }}
    page_info: ${{ input.page_info }}
    updated_at_min: ${{ input.updated_at_min }}
input:
  limit:
    type: integer
    description: Number of records to retrieve per page.
    default: 250
  page_info:
    type: string
    description: Cursor returned in Shopify Link response headers.
  updated_at_min:
    type: timestamp
    description: Only return records updated on or after this timestamp.
output:
  id:
    type: integer
    path: $.id
    description: Shopify object identifier.
  title:
    type: string
    path: $.title
    description: Blog title.
  handle:
    type: string
    path: $.handle
    description: URL-friendly blog handle.
  commentable:
    type: string
    path: $.commentable
    description: Comment policy for the blog.
  tags:
    type: string
    path: $.tags
    description: Tags associated with the blog.
  created_at:
    type: timestamp
    path: $.created_at
    description: Creation timestamp.
  updated_at:
    type: timestamp
    path: $.updated_at
    description: Last update timestamp.
extract:
  record_path: $.blogs
  pagination:
    type: link_header
  table:
    primary_key:
      - id
    trust_tier: silver
incremental:
  strategy: cursor
  cursor_field: updated_at
  cursor_param: updated_at_min
