type: resource
name: themes
description: Store themes in Shopify.
api:
  endpoint: /themes.json
  method: GET
  query_params:
    limit: ${{ input.limit }}
    page_info: ${{ input.page_info }}
    updated_at_min: ${{ input.updated_at_min }}
input:
  limit:
    type: integer
    description: Number of records to retrieve per page.
    default: 250
  page_info:
    type: string
    description: Cursor returned in Shopify Link response headers.
  updated_at_min:
    type: timestamp
    description: Only return records updated on or after this timestamp.
output:
  id:
    type: integer
    path: $.id
    description: Shopify object identifier.
  name:
    type: string
    path: $.name
    description: Theme name.
  role:
    type: string
    path: $.role
    description: Theme role (main, unpublished, demo).
  theme_store_id:
    type: integer
    path: $.theme_store_id
    description: ID of the theme in the Shopify Theme Store.
  previewable:
    type: boolean
    path: $.previewable
    description: Whether the theme can be previewed.
  processing:
    type: boolean
    path: $.processing
    description: Whether the theme is currently being processed.
  created_at:
    type: timestamp
    path: $.created_at
    description: Creation timestamp.
  updated_at:
    type: timestamp
    path: $.updated_at
    description: Last update timestamp.
extract:
  record_path: $.themes
  pagination:
    type: link_header
  table:
    primary_key:
      - id
    trust_tier: silver
incremental:
  strategy: cursor
  cursor_field: updated_at
  cursor_param: updated_at_min
