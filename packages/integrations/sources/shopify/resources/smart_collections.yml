type: resource
name: smart_collections
description: Automated product collections in Shopify.
api:
  endpoint: /smart_collections.json
  method: GET
  query_params:
    limit: ${{ input.limit }}
    page_info: ${{ input.page_info }}
    updated_at_min: ${{ input.updated_at_min }}
input:
  limit:
    type: integer
    description: Number of records to retrieve per page.
    default: 250
  page_info:
    type: string
    description: Cursor returned in Shopify Link response headers.
  updated_at_min:
    type: timestamp
    description: Only return records updated on or after this timestamp.
output:
  id:
    type: integer
    path: $.id
    description: Shopify object identifier.
  title:
    type: string
    path: $.title
    description: Collection title.
  handle:
    type: string
    path: $.handle
    description: URL-friendly collection handle.
  body_html:
    type: string
    path: $.body_html
    description: HTML description of the collection.
  published_at:
    type: timestamp
    path: $.published_at
    description: Publication timestamp.
  sort_order:
    type: string
    path: $.sort_order
    description: Sort order for products in the collection.
  template_suffix:
    type: string
    path: $.template_suffix
    description: Liquid template suffix for the collection page.
  published_scope:
    type: string
    path: $.published_scope
    description: Visibility scope of the collection.
  created_at:
    type: timestamp
    path: $.created_at
    description: Creation timestamp.
  updated_at:
    type: timestamp
    path: $.updated_at
    description: Last update timestamp.
extract:
  record_path: $.smart_collections
  pagination:
    type: link_header
  table:
    primary_key:
      - id
    trust_tier: silver
incremental:
  strategy: cursor
  cursor_field: updated_at
  cursor_param: updated_at_min
