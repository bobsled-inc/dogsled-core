type: resource
name: orders
description: Orders in Shopify.
api:
  endpoint: /orders.json
  method: GET
  query_params:
    limit: ${{ input.limit }}
    page_info: ${{ input.page_info }}
    updated_at_min: ${{ input.updated_at_min }}
input:
  limit:
    type: integer
    description: Number of records to retrieve per page.
    default: 250
  page_info:
    type: string
    description: Cursor returned in Shopify Link response headers.
  updated_at_min:
    type: timestamp
    description: Only return records updated on or after this timestamp.
output:
  id:
    type: integer
    path: $.id
    description: Shopify object identifier.
  name:
    type: string
    path: $.name
    description: Order name.
  email:
    type: string
    path: $.email
    description: Customer email on the order.
  financial_status:
    type: string
    path: $.financial_status
    description: Financial status of the order.
  fulfillment_status:
    type: string
    path: $.fulfillment_status
    description: Fulfillment status of the order.
  created_at:
    type: timestamp
    path: $.created_at
    description: Creation timestamp.
  updated_at:
    type: timestamp
    path: $.updated_at
    description: Last update timestamp.
extract:
  record_path: $.orders
  pagination:
    type: link_header
  table:
    primary_key:
      - id
    trust_tier: silver
incremental:
  strategy: cursor
  cursor_field: updated_at
  cursor_param: updated_at_min
