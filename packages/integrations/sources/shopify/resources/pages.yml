type: resource
name: pages
description: CMS pages in Shopify.
api:
  endpoint: /pages.json
  method: GET
  query_params:
    limit: ${{ input.limit }}
    page_info: ${{ input.page_info }}
    updated_at_min: ${{ input.updated_at_min }}
input:
  limit:
    type: integer
    description: Number of records to retrieve per page.
    default: 250
  page_info:
    type: string
    description: Cursor returned in Shopify Link response headers.
  updated_at_min:
    type: timestamp
    description: Only return records updated on or after this timestamp.
output:
  id:
    type: integer
    path: $.id
    description: Shopify object identifier.
  title:
    type: string
    path: $.title
    description: Page title.
  handle:
    type: string
    path: $.handle
    description: URL-friendly page handle.
  body_html:
    type: string
    path: $.body_html
    description: HTML content of the page.
  author:
    type: string
    path: $.author
    description: Page author name.
  published_at:
    type: timestamp
    path: $.published_at
    description: Publication timestamp.
  template_suffix:
    type: string
    path: $.template_suffix
    description: Liquid template suffix for the page.
  created_at:
    type: timestamp
    path: $.created_at
    description: Creation timestamp.
  updated_at:
    type: timestamp
    path: $.updated_at
    description: Last update timestamp.
extract:
  record_path: $.pages
  pagination:
    type: link_header
  table:
    primary_key:
      - id
    trust_tier: silver
incremental:
  strategy: cursor
  cursor_field: updated_at
  cursor_param: updated_at_min
