type: resource
name: invoices
description: Invoice entities from QuickBooks Online.
api:
  endpoint: /query
  method: GET
  query_params:
    query: select * from Invoice maxresults 1000
input: {}
output:
  id:
    type: string
    path: $.Id
  doc_number:
    type: string
    path: $.DocNumber
  customer_id:
    type: string
    path: $.CustomerRef.value
  total_amt:
    type: number
    path: $.TotalAmt
  balance:
    type: number
    path: $.Balance
  due_date:
    type: string
    path: $.DueDate
  sync_token:
    type: string
    path: $.SyncToken
  created_at:
    type: timestamp
    path: $.MetaData.CreateTime
  updated_at:
    type: timestamp
    path: $.MetaData.LastUpdatedTime
extract:
  record_path: $.QueryResponse.Invoice
  table:
    primary_key:
      - id
