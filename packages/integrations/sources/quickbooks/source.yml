spec_version: '2'
type: source
name: quickbooks
description: QuickBooks Online Accounting API for customers, vendors, and ledger objects.
transports:
  - id: default
    base_url: https://quickbooks.api.intuit.com/v3/company/${{ env.QUICKBOOKS_COMPANY_ID }}
    auth:
      type: oauth2
      grant_type: authorization_code
      token_url: https://oauth.platform.intuit.com/oauth2/v1/tokens/bearer
      client_id: ${{ env.QUICKBOOKS_CLIENT_ID }}
      client_secret: ${{ env.QUICKBOOKS_CLIENT_SECRET }}
      refresh_token: ${{ env.QUICKBOOKS_REFRESH_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 2
      burst: 4
    headers:
      Accept: application/json
      User-Agent: bobsled-core-extractor
default_transport: default
