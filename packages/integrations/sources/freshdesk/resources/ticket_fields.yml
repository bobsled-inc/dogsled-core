type: resource
name: ticket_fields
description: List all ticket fields
api:
  endpoint: /ticket_fields
  method: GET
input: {}
output:
  id:
    type: integer
    path: $.id
    description: Freshdesk ticket field identifier
  name:
    type: string
    path: $.name
    description: Internal field name
  label:
    type: string
    path: $.label
    description: Display label shown in the UI
  type:
    type: string
    path: $.type
    description: Field data type
  required_for_closure:
    type: boolean
    path: $.required_for_closure
    description: Whether the field is required before closing a ticket
  position:
    type: integer
    path: $.position
    description: Display order of the field
extract:
  record_path: $
  table:
    primary_key:
      - id
    trust_tier: silver
