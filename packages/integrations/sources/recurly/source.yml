spec_version: '2'
type: source
name: recurly
description: Recurly API for accounts, subscriptions, invoices, plans, and coupons
transports:
  - id: default
    base_url: https://v3.recurly.com
    auth:
      type: bearer
      token: ${{ env.RECURLY_API_KEY }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 5
      burst: 10
    headers:
      Accept: application/json
      User-Agent: dogsled-extractor
default_transport: default
