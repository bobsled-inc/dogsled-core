type: resource
name: list_views
description: List views for an Airtable table
api:
  endpoint: /v0/meta/bases/${{ input.base_id }}/tables/${{ input.table_id }}/views
  method: GET
input:
  base_id:
    type: string
    required: true
    description: Airtable base identifier
  table_id:
    type: string
    required: true
    description: Airtable table identifier
output:
  id:
    type: string
    path: $.id
    description: View identifier
  name:
    type: string
    path: $.name
    description: View name
  type:
    type: string
    path: $.type
    description: View type
  visible_field_ids:
    type: array
    path: $.visibleFieldIds
    description: Visible field identifiers
extract:
  record_path: $.views
  for_each:
    resource: list_tables
    bindings:
      - source: input
        field: base_id
        input: base_id
      - field: id
        input: table_id
  table:
    primary_key:
      - id
    trust_tier: silver
