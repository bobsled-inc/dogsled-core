spec_version: '2'
type: source
name: zendesk
description: Extract support users, groups, organizations, tickets, and configuration from Zendesk.
transports:
  - id: default
    base_url: https://${{ env.ZENDESK_SUBDOMAIN }}.zendesk.com/api/v2
    auth:
      type: bearer
      token: ${{ env.ZENDESK_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
        - 504
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 5
      burst: 10
    headers:
      Accept: application/json
      User-Agent: bobsled-core-extractor
default_transport: default
