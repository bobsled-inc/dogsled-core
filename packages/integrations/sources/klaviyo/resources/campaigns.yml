type: resource
name: campaigns
description: Campaigns configured in Klaviyo.
api:
  endpoint: /campaigns
  method: GET
  query_params:
    page[size]: ${{ input.page_size }}
    page[cursor]: ${{ input.page_cursor }}
input:
  page_size:
    type: integer
    description: Number of records to retrieve per page.
    default: 100
  page_cursor:
    type: string
    description: Cursor returned by the previous page.
output:
  id:
    type: string
    path: $.id
    description: Klaviyo object identifier.
  type:
    type: string
    path: $.type
    description: JSON:API resource type.
  name:
    type: string
    path: $.attributes.name
    description: Campaign name.
  created_at:
    type: timestamp
    path: $.attributes.created_at
    description: Creation timestamp.
  updated_at:
    type: timestamp
    path: $.attributes.updated_at
    description: Last update timestamp.
  status:
    type: string
    path: $.attributes.status
    description: Campaign status.
extract:
  record_path: $.data
  pagination:
    type: next_url
    next_url_path: $.links.next
  table:
    primary_key:
      - id
    trust_tier: silver
