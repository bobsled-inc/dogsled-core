type: resource
name: segments
description: Segments configured in Klaviyo.
api:
  endpoint: /segments
  method: GET
  query_params:
    page[size]: ${{ input.page_size }}
    page[cursor]: ${{ input.page_cursor }}
input:
  page_size:
    type: integer
    description: Number of records to retrieve per page.
    default: 100
  page_cursor:
    type: string
    description: Cursor returned by the previous page.
output:
  id:
    type: string
    path: $.id
    description: Klaviyo object identifier.
  type:
    type: string
    path: $.type
    description: JSON:API resource type.
  name:
    type: string
    path: $.attributes.name
    description: Segment name.
  created:
    type: timestamp
    path: $.attributes.created
    description: Creation timestamp.
  updated:
    type: timestamp
    path: $.attributes.updated
    description: Last update timestamp.
  definition_type:
    type: string
    path: $.attributes.definition_type
    description: Segment definition type.
extract:
  record_path: $.data
  pagination:
    type: next_url
    next_url_path: $.links.next
  table:
    primary_key:
      - id
    trust_tier: silver
