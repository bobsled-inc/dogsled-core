spec_version: '2'
type: source
name: klaviyo
description: Klaviyo API for profiles, events, campaigns, flows, lists, and segments.
transports:
  - id: default
    base_url: https://a.klaviyo.com/api
    auth:
      type: api-key
      header: Authorization
      key: Klaviyo-API-Key ${{ env.KLAVIYO_API_KEY }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 10
      burst: 20
    headers:
      Accept: application/json
      User-Agent: dogsled-extractor
      revision: 2026-01-15
default_transport: default
