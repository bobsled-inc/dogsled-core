type: resource
name: tags
description: Cloud resource tags across providers
api:
  endpoint: /tags
  method: GET
  query_params:
    providers: ${{ input.providers }}
    search_query: ${{ input.search_query }}
    sort_direction: ${{ input.sort_direction }}
    page: ${{ input.page }}
    limit: ${{ input.limit }}
input:
  providers:
    type: array
    description: An array of providers to scope Tags by.
  search_query:
    type: string
    description: A search query to filter Tags by tag key.
  sort_direction:
    type: string
    description: The direction in which to sort the data.
    enum:
      - asc
      - desc
  page:
    type: integer
    description: The page of results to return.
    default: 1
  limit:
    type: integer
    description: The number of results to return per page. The maximum is 1000.
    default: 1000
output:
  tag_key:
    type: string
    path: $.tag_key
    description: The Tag key.
  hidden:
    type: boolean
    path: $.hidden
    description: Whether the Tag has been hidden from the Vantage UI.
  providers:
    type: array
    path: $.providers
    description: The unique providers that are covered by the Tag key.
extract:
  record_path: $.tags
  pagination:
    type: page_number
    page_param: page
    per_page_param: limit
  table:
    primary_key:
      - tag_key
    trust_tier: silver
