type: resource
name: folders
description: Organizational folders for cost reports and resources
api:
  endpoint: /folders
  method: GET
  query_params:
    page: ${{ input.page }}
    limit: ${{ input.limit }}
    type: ${{ input.type }}
input:
  page:
    type: integer
    description: The page of results to return.
  limit:
    type: integer
    description: The amount of results to return. The maximum is 1000.
    default: 1000
  type:
    type: string
    description: Filter by folder type.
    enum:
      - CostFolder
      - ProviderResourceFolder
query:
  filters:
    type:
      operators:
        - eq
      enum:
        - CostFolder
        - ProviderResourceFolder
      description: Filter by folder type.
      bind:
        eq:
          input: type
      compile:
        eq:
          mode: http_query
          param: type
output:
  token:
    type: string
    path: $.token
    description: Unique token identifier for the folder.
  title:
    type: string
    path: $.title
    description: The title of the Folder.
  type:
    type: string
    path: $.type
    description: The type of the Folder.
  parent_folder_token:
    type: string
    path: $.parent_folder_token
    description: The token for the parent Folder, if any.
  saved_filter_tokens:
    type: array
    path: $.saved_filter_tokens
    description: The tokens for the SavedFilters assigned to the Folder.
  workspace_token:
    type: string
    path: $.workspace_token
    description: The token for the Workspace the Folder is a part of.
  created_at:
    type: timestamp
    path: $.created_at
    description: The date and time, in UTC, the Folder was created.
  updated_at:
    type: timestamp
    path: $.updated_at
    description: The date and time, in UTC, the Folder was last updated.
extract:
  record_path: $.folders
  pagination:
    type: page_number
    page_param: page
    per_page_param: limit
  table:
    primary_key:
      - token
    trust_tier: silver
lookup:
  description: Get folder by token
  api:
    endpoint: /folders/${{ input.folder_token }}
    method: GET
  input:
    folder_token:
      type: string
      required: true
