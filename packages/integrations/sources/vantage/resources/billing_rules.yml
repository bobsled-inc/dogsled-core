type: resource
name: billing_rules
description: Billing rules for MSP cost allocation and markup
api:
  endpoint: /billing_rules
  method: GET
  query_params:
    page: ${{ input.page }}
    limit: ${{ input.limit }}
input:
  page:
    type: integer
    description: The page of results to return.
  limit:
    type: integer
    description: The amount of results to return. The maximum is 1000.
output:
  token:
    type: string
    path: $.token
    description: Unique token identifier for the billing rule.
  title:
    type: string
    path: $.title
    description: The title of the BillingRule.
  type:
    type: string
    path: $.type
    description: The type of billing rule.
  percentage:
    type: number
    path: $.percentage
    description: The percentage markup or discount.
  start_period:
    type: timestamp
    path: $.start_period
    description: The start period for the billing rule.
  end_period:
    type: timestamp
    path: $.end_period
    description: The end period for the billing rule.
  created_at:
    type: timestamp
    path: $.created_at
    description: The date and time, in UTC, the billing rule was created.
extract:
  record_path: $.billing_rules
  pagination:
    type: page_number
    page_param: page
    per_page_param: limit
  table:
    primary_key:
      - token
    trust_tier: silver
lookup:
  description: Get billing rule by token
  api:
    endpoint: /billing_rules/${{ input.billing_rule_token }}
    method: GET
  input:
    billing_rule_token:
      type: string
      required: true
