type: resource
name: anomaly_notifications
description: Anomaly notification configurations for cost report monitoring
api:
  endpoint: /anomaly_notifications
  method: GET
  query_params:
    page: ${{ input.page }}
    limit: ${{ input.limit }}
input:
  page:
    type: integer
    description: The page of results to return.
  limit:
    type: integer
    description: The amount of results to return. The maximum is 1000.
output:
  token:
    type: string
    path: $.token
    description: Unique token identifier for the anomaly notification.
  cost_report_token:
    type: string
    path: $.cost_report_token
    description: The token of the CostReport being monitored.
  workspace_token:
    type: string
    path: $.workspace_token
    description: The token of the Workspace.
  user_token:
    type: string
    path: $.user_token
    description: The token of the User who created this notification.
  created_at:
    type: timestamp
    path: $.created_at
    description: The date and time, in UTC, the notification was created.
extract:
  record_path: $.anomaly_notifications
  pagination:
    type: page_number
    page_param: page
    per_page_param: limit
  table:
    primary_key:
      - token
    trust_tier: silver
lookup:
  description: Get anomaly notification by token
  api:
    endpoint: /anomaly_notifications/${{ input.anomaly_notification_token }}
    method: GET
  input:
    anomaly_notification_token:
      type: string
      required: true
