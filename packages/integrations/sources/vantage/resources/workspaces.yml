type: resource
name: workspaces
description: Vantage workspaces with currency settings
health_check:
  preferred: true
api:
  endpoint: /workspaces
  method: GET
  query_params:
    page: ${{ input.page }}
    limit: ${{ input.limit }}
input:
  page:
    type: integer
    description: The page of results to return.
  limit:
    type: integer
    description: The amount of results to return. The maximum is 1000.
    default: 1000
output:
  token:
    type: string
    path: $.token
    description: Unique token identifier for the workspace.
  name:
    type: string
    path: $.name
    description: The name of the Workspace.
  currency:
    type: string
    path: $.currency
    description: The currency code for the Workspace.
  enable_currency_conversion:
    type: boolean
    path: $.enable_currency_conversion
    description: Whether currency conversion is enabled for the Workspace.
  created_at:
    type: timestamp
    path: $.created_at
    description: The date and time, in UTC, the Workspace was created.
extract:
  record_path: $.workspaces
  pagination:
    type: page_number
    page_param: page
    per_page_param: limit
  table:
    primary_key:
      - token
    trust_tier: silver
lookup:
  description: Get workspace by token
  api:
    endpoint: /workspaces/${{ input.workspace_token }}
    method: GET
  input:
    workspace_token:
      type: string
      required: true
