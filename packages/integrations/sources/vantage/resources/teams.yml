type: resource
name: teams
description: Vantage teams with workspace and member assignments
api:
  endpoint: /teams
  method: GET
  query_params:
    page: ${{ input.page }}
    limit: ${{ input.limit }}
input:
  page:
    type: integer
    description: The page of results to return.
  limit:
    type: integer
    description: The amount of results to return. The maximum is 1000.
    default: 1000
output:
  token:
    type: string
    path: $.token
    description: Unique token identifier for the team.
  name:
    type: string
    path: $.name
    description: The name of the Team.
  description:
    type: string
    path: $.description
    description: The description of the Team.
  workspace_tokens:
    type: array
    path: $.workspace_tokens
    description: The tokens for any Workspaces that the Team belongs to.
  user_tokens:
    type: array
    path: $.user_tokens
    description: The tokens for Users that belong to the Team.
  default_dashboard_token:
    type: string
    path: $.default_dashboard_token
    description: The token of the default Dashboard for the Team.
extract:
  record_path: $.teams
  pagination:
    type: page_number
    page_param: page
    per_page_param: limit
  table:
    primary_key:
      - token
    trust_tier: silver
lookup:
  description: Get team by token
  api:
    endpoint: /teams/${{ input.team_token }}
    method: GET
  input:
    team_token:
      type: string
      required: true
