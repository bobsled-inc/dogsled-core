type: resource
name: business_metrics
description: Business metrics for unit cost tracking
api:
  endpoint: /business_metrics
  method: GET
  query_params:
    page: ${{ input.page }}
    limit: ${{ input.limit }}
input:
  page:
    type: integer
    description: The page of results to return.
  limit:
    type: integer
    description: The amount of results to return. The maximum is 1000.
    default: 1000
output:
  token:
    type: string
    path: $.token
    description: The token of the BusinessMetric.
  title:
    type: string
    path: $.title
    description: The title of the BusinessMetric.
  created_by_token:
    type: string
    path: $.created_by_token
    description: The token of the Creator of the BusinessMetric.
  cost_report_tokens_with_metadata:
    type: array
    path: $.cost_report_tokens_with_metadata
    description: The tokens for any CostReports that use the BusinessMetric.
  import_type:
    type: string
    path: $.import_type
    description: The type of import for the BusinessMetric.
  integration_token:
    type: string
    path: $.integration_token
    description: The Integration token used to import the BusinessMetric.
extract:
  record_path: $.business_metrics
  pagination:
    type: page_number
    page_param: page
    per_page_param: limit
  table:
    primary_key:
      - token
    trust_tier: silver
lookup:
  description: Get business metric by token
  api:
    endpoint: /business_metrics/${{ input.business_metric_token }}
    method: GET
  input:
    business_metric_token:
      type: string
      required: true
