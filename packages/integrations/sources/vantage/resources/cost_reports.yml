type: resource
name: cost_reports
description: Cost reports with filters, groupings, and settings
api:
  endpoint: /cost_reports
  method: GET
  query_params:
    page: ${{ input.page }}
    limit: ${{ input.limit }}
    folder_token: ${{ input.folder_token }}
input:
  page:
    type: integer
    description: The page of results to return.
  limit:
    type: integer
    description: The amount of results to return. The maximum is 1000.
    default: 1000
  folder_token:
    type: string
    description: The token for the Folder you would like to fetch Reports from.
query:
  filters:
    folder_token:
      operators:
        - eq
      description: The token for the Folder you would like to fetch Reports from.
      bind:
        eq:
          input: folder_token
      compile:
        eq:
          mode: http_query
          param: folder_token
output:
  token:
    type: string
    path: $.token
    description: Unique token identifier for the cost report.
  title:
    type: string
    path: $.title
    description: The title of the CostReport.
  folder_token:
    type: string
    path: $.folder_token
    description: The token for the Folder the CostReport is a part of.
  saved_filter_tokens:
    type: array
    path: $.saved_filter_tokens
    description: The tokens for the SavedFilters assigned to the CostReport.
  filter:
    type: string
    path: $.filter
    description: The filter applied to the CostReport.
  groupings:
    type: string
    path: $.groupings
    description: The grouping aggregations applied to the filtered data.
  start_date:
    type: timestamp
    path: $.start_date
    description: The start date of the CostReport.
  end_date:
    type: timestamp
    path: $.end_date
    description: The end date of the CostReport.
  date_interval:
    type: string
    path: $.date_interval
    description: The date interval of the CostReport.
  date_bin:
    type: string
    path: $.date_bin
    description: The date bin of the CostReport.
  chart_type:
    type: string
    path: $.chart_type
    description: The chart type of the CostReport.
  workspace_token:
    type: string
    path: $.workspace_token
    description: The token for the Workspace the CostReport is a part of.
  created_at:
    type: timestamp
    path: $.created_at
    description: The date and time, in UTC, the report was created.
extract:
  record_path: $.cost_reports
  pagination:
    type: page_number
    page_param: page
    per_page_param: limit
  table:
    primary_key:
      - token
    trust_tier: silver
lookup:
  description: Get cost report by token
  api:
    endpoint: /cost_reports/${{ input.cost_report_token }}
    method: GET
  input:
    cost_report_token:
      type: string
      required: true
