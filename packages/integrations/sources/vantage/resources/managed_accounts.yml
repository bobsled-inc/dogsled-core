type: resource
name: managed_accounts
description: MSP managed accounts
api:
  endpoint: /managed_accounts
  method: GET
  query_params:
    page: ${{ input.page }}
    limit: ${{ input.limit }}
input:
  page:
    type: integer
    description: The page of results to return.
  limit:
    type: integer
    description: The amount of results to return. The maximum is 1000.
output:
  token:
    type: string
    path: $.token
    description: Unique token identifier for the managed account.
  name:
    type: string
    path: $.name
    description: The name of the managed account.
  contact_email:
    type: string
    path: $.contact_email
    description: Contact email for the managed account.
  parent_account_token:
    type: string
    path: $.parent_account_token
    description: The token for the parent Account.
  email_domain:
    type: string
    path: $.email_domain
    description: Email domain associated with this Managed Account for SSO.
extract:
  record_path: $.managed_accounts
  pagination:
    type: page_number
    page_param: page
    per_page_param: limit
  table:
    primary_key:
      - token
    trust_tier: silver
lookup:
  description: Get managed account by token
  api:
    endpoint: /managed_accounts/${{ input.managed_account_token }}
    method: GET
  input:
    managed_account_token:
      type: string
      required: true
