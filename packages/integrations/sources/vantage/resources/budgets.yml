type: resource
name: budgets
description: Budgets with periods and performance tracking
api:
  endpoint: /budgets
  method: GET
  query_params:
    page: ${{ input.page }}
    limit: ${{ input.limit }}
input:
  page:
    type: integer
    description: The page of results to return.
  limit:
    type: integer
    description: The number of results to return. The maximum is 1000.
    default: 1000
output:
  token:
    type: string
    path: $.token
    description: Unique token identifier for the budget.
  name:
    type: string
    path: $.name
    description: The name of the Budget.
  workspace_token:
    type: string
    path: $.workspace_token
    description: The token for the Workspace the Budget is a part of.
  user_token:
    type: string
    path: $.user_token
    description: The token for the User who created this Budget.
  created_by_token:
    type: string
    path: $.created_by_token
    description: The token of the Creator of the Budget.
  cost_report_token:
    type: string
    path: $.cost_report_token
    description: The token of the Report associated with the Budget.
  budget_alert_tokens:
    type: array
    path: $.budget_alert_tokens
    description: The tokens of the BudgetAlerts associated with the Budget.
  child_budget_tokens:
    type: array
    path: $.child_budget_tokens
    description: The tokens of the child Budgets associated with the hierarchical Budget.
  periods:
    type: array
    path: $.periods
    description: The budget periods associated with the Budget.
  performance:
    type: array
    path: $.performance
    description: The historical performance of the Budget.
  created_at:
    type: timestamp
    path: $.created_at
    description: The date and time, in UTC, the Budget was created.
extract:
  record_path: $.budgets
  pagination:
    type: page_number
    page_param: page
    per_page_param: limit
  table:
    primary_key:
      - token
    trust_tier: silver
lookup:
  description: Get budget by token
  api:
    endpoint: /budgets/${{ input.budget_token }}
    method: GET
  input:
    budget_token:
      type: string
      required: true
