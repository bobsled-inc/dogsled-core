type: resource
name: cost_services
description: Available cloud cost services by provider
api:
  endpoint: /cost_services
  method: GET
  query_params:
    workspace_token: ${{ input.workspace_token }}
input:
  workspace_token:
    type: string
    description: The token of the Workspace to list CostServices for.
query:
  filters:
    workspace_token:
      operators:
        - eq
      description: The token of the Workspace to list CostServices for.
      bind:
        eq:
          input: workspace_token
      compile:
        eq:
          mode: http_query
          param: workspace_token
output:
  workspace_token:
    type: string
    path: $.__input__.workspace_token
    description: The workspace this service belongs to (from for_each iteration).
  name:
    type: string
    path: $.name
    description: The name of the CostService.
  provider:
    type: string
    path: $.provider
    description: The key value of the CostProvider.
extract:
  record_path: $.cost_services
  for_each:
    resource: workspaces
    field: token
    input: workspace_token
  table:
    primary_key:
      - workspace_token
      - name
      - provider
    load_strategy: full_refresh
    trust_tier: silver
