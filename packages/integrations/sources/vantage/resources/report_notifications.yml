type: resource
name: report_notifications
description: Scheduled report notification configurations
api:
  endpoint: /report_notifications
  method: GET
  query_params:
    page: ${{ input.page }}
    limit: ${{ input.limit }}
input:
  page:
    type: integer
    description: The page of results to return.
  limit:
    type: integer
    description: The amount of results to return. The maximum is 1000.
output:
  token:
    type: string
    path: $.token
    description: Unique token identifier for the report notification.
  title:
    type: string
    path: $.title
    description: The title of the ReportNotification.
  cost_report_token:
    type: string
    path: $.cost_report_token
    description: The token of the CostReport being monitored.
  frequency:
    type: string
    path: $.frequency
    description: The frequency of the notification.
  change:
    type: string
    path: $.change
    description: The change type that triggers the notification.
  workspace_token:
    type: string
    path: $.workspace_token
    description: The token of the Workspace.
  user_token:
    type: string
    path: $.user_token
    description: The token of the User who created this notification.
  created_at:
    type: timestamp
    path: $.created_at
    description: The date and time, in UTC, the notification was created.
extract:
  record_path: $.report_notifications
  pagination:
    type: page_number
    page_param: page
    per_page_param: limit
  table:
    primary_key:
      - token
    trust_tier: silver
lookup:
  description: Get report notification by token
  api:
    endpoint: /report_notifications/${{ input.report_notification_token }}
    method: GET
  input:
    report_notification_token:
      type: string
      required: true
