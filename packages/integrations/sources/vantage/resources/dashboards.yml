type: resource
name: dashboards
description: Cost dashboards with widgets and date settings
api:
  endpoint: /dashboards
  method: GET
  query_params:
    page: ${{ input.page }}
    limit: ${{ input.limit }}
input:
  page:
    type: integer
    description: The page of results to return.
  limit:
    type: integer
    description: The amount of results to return. The maximum is 1000.
    default: 1000
output:
  token:
    type: string
    path: $.token
    description: Unique token identifier for the dashboard.
  title:
    type: string
    path: $.title
    description: The title of the Dashboard.
  widgets:
    type: array
    path: $.widgets
    description: The widgets on the Dashboard.
  saved_filter_tokens:
    type: array
    path: $.saved_filter_tokens
    description: The tokens of the Saved Filters used in the Dashboard.
  date_bin:
    type: string
    path: $.date_bin
    description: Determines how to group costs in the Dashboard.
  date_interval:
    type: string
    path: $.date_interval
    description: Determines the date range for Reports in the Dashboard.
  start_date:
    type: timestamp
    path: $.start_date
    description: The start date for the Dashboard.
  end_date:
    type: timestamp
    path: $.end_date
    description: The end date for the Dashboard.
  workspace_token:
    type: string
    path: $.workspace_token
    description: The token for the Workspace the Dashboard is a part of.
  created_at:
    type: timestamp
    path: $.created_at
    description: The date and time, in UTC, the Dashboard was created.
  updated_at:
    type: timestamp
    path: $.updated_at
    description: The date and time, in UTC, the Dashboard was last updated.
extract:
  record_path: $.dashboards
  pagination:
    type: page_number
    page_param: page
    per_page_param: limit
  table:
    primary_key:
      - token
    trust_tier: silver
lookup:
  description: Get dashboard by token
  api:
    endpoint: /dashboards/${{ input.dashboard_token }}
    method: GET
  input:
    dashboard_token:
      type: string
      required: true
