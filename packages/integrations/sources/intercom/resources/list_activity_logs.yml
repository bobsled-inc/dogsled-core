type: resource
name: list_activity_logs
description: List all activity logs
api:
  endpoint: /admins/activity_logs
  method: GET
  query_params:
    created_at_after: ${{ input.created_at_after }}
    created_at_before: ${{ input.created_at_before }}
input:
  created_at_after:
    type: string
    required: true
    description: The start date that you request data for. It must be formatted as a UNIX timestamp.
  created_at_before:
    type: string
    description: The end date that you request data for. It must be formatted as a UNIX timestamp.
output:
  id:
    type: string
    path: $.id
    description: The id representing the activity.
  performed_by_type:
    type: string
    path: $.performed_by.type
    description: String representing the object's type.
  performed_by_id:
    type: string
    path: $.performed_by.id
    description: The id representing the admin.
  performed_by_email:
    type: string
    path: $.performed_by.email
    description: The email of the admin.
  performed_by_ip:
    type: string
    path: $.performed_by.ip
    description: The IP address of the admin.
  metadata:
    type: object
    path: $.metadata
    description: Additional data provided about Admin activity.
  created_at:
    type: integer
    path: $.created_at
    description: The time the activity was created.
  activity_type:
    type: string
    path: $.activity_type
  activity_description:
    type: string
    path: $.activity_description
    description: A sentence or two describing the activity.
extract:
  record_path: $.activity_logs
  table:
    primary_key:
      - id
    trust_tier: silver
test:
  fixtures:
    - name: list_activity_logs_smoke
      input:
        intercom_version: '2.14'
        created_at_after: '1677253093'
        created_at_before: '1677861493'
incremental:
  strategy: server_filter
  cursor_field: created_at
  cursor_type: integer
  since_argument: created_at_after
  until_argument: created_at_before
  value_format: unix_seconds
  lookback_seconds: 3600
  initial_lookback_seconds: 86400
  window_size_seconds: 86400
