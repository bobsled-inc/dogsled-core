spec_version: '2'
type: source
name: intercom
description: Intercom REST API for contacts, conversations, admins, and workspace metadata
transports:
  - id: default
    base_url: https://api.intercom.io
    auth:
      type: bearer
      token: ${{ env.INTERCOM_ACCESS_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 5
      burst: 10
    headers:
      Accept: application/json
      User-Agent: bobsled-core-extractor
default_transport: default
