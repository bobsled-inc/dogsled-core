spec_version: '2'
type: source
name: sendgrid
description: Twilio SendGrid marketing contacts API for lists, recipients, and custom fields
transports:
  - id: default
    base_url: https://api.sendgrid.com
    auth:
      type: bearer
      token: ${{ env.SENDGRID_API_KEY }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 5
      burst: 10
    headers:
      Accept: application/json
      User-Agent: bobsled-core-extractor
default_transport: default
