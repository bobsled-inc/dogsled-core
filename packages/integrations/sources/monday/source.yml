spec_version: '2'
type: source
name: monday
description: Monday.com GraphQL API for boards, users, teams, and board details.
transports:
  - id: graphql
    base_url: https://api.monday.com/v2
    auth:
      type: api-key
      header: Authorization
      key: ${{ env.MONDAY_API_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 5
      burst: 10
    headers:
      Accept: application/json
      User-Agent: bobsled-core-extractor
default_transport: graphql
