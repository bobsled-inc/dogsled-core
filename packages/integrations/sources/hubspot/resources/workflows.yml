type: resource
name: workflows
description: HubSpot automation workflows
api:
  endpoint: /automation/v4/flows
  method: GET
  query_params:
    limit: ${{ input.limit }}
input:
  limit:
    type: integer
    description: Number of workflows to return per page (max 100)
    default: 100
output:
  id:
    type: string
    path: $.id
    description: Unique identifier for the workflow
  name:
    type: string
    path: $.name
    description: Name of the workflow
  type:
    type: string
    path: $.flowType
    description: Type of the workflow
  enabled:
    type: boolean
    path: $.isEnabled
    description: Whether the workflow is currently active
  created_at:
    type: timestamp
    path: $.createdAt
    description: When the workflow was created
  updated_at:
    type: timestamp
    path: $.updatedAt
    description: When the workflow was last updated
extract:
  record_path: $.results
  pagination:
    type: cursor
    cursor_path: $.paging.next.after
    cursor_param: after
  table:
    primary_key:
      - id
    trust_tier: silver
