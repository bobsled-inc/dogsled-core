type: resource
name: notes
description: HubSpot CRM note records
api:
  endpoint: /crm/v3/objects/notes
  method: GET
  query_params:
    limit: ${{ input.limit }}
    properties: ${{ input.properties }}
input:
  limit:
    type: integer
    description: Number of note records to return per page (max 100)
    default: 100
  properties:
    type: string
    description: Comma-separated list of note properties to return
    default: hs_timestamp,hs_note_body,hubspot_owner_id,hs_createdate,hs_lastmodifieddate
output:
  id:
    type: string
    path: $.id
    description: Unique HubSpot identifier for the note record
  timestamp:
    type: timestamp
    path: $.properties.hs_timestamp
    description: When the note was created or logged
  body:
    type: string
    path: $.properties.hs_note_body
    description: Content of the note
  owner_id:
    type: string
    path: $.properties.hubspot_owner_id
    description: HubSpot owner ID assigned to this note
  created_at:
    type: timestamp
    path: $.properties.hs_createdate
    description: When the note record was created
  updated_at:
    type: timestamp
    path: $.properties.hs_lastmodifieddate
    description: When the note record was last modified
extract:
  record_path: $.results
  pagination:
    type: cursor
    cursor_path: $.paging.next.after
    cursor_param: after
  table:
    primary_key:
      - id
    trust_tier: silver
incremental:
  strategy: cursor
  cursor_field: updated_at
  cursor_param: filterGroups
