type: resource
name: marketing_events
description: HubSpot marketing events
api:
  endpoint: /marketing/v3/marketing-events/events
  method: GET
  query_params:
    limit: ${{ input.limit }}
input:
  limit:
    type: integer
    description: Number of marketing events to return per page (max 100)
    default: 100
output:
  event_id:
    type: string
    path: $.id
    description: Unique identifier for the marketing event
  name:
    type: string
    path: $.eventName
    description: Name of the marketing event
  type:
    type: string
    path: $.eventType
    description: Type of the marketing event
  start_date:
    type: timestamp
    path: $.startDateTime
    description: Start date and time of the event
  end_date:
    type: timestamp
    path: $.endDateTime
    description: End date and time of the event
  organizer:
    type: string
    path: $.eventOrganizer
    description: Organizer of the marketing event
  cancelled:
    type: boolean
    path: $.eventCancelled
    description: Whether the event has been cancelled
  created_at:
    type: timestamp
    path: $.createdAt
    description: When the marketing event was created
  updated_at:
    type: timestamp
    path: $.updatedAt
    description: When the marketing event was last updated
extract:
  record_path: $.results
  pagination:
    type: cursor
    cursor_path: $.paging.next.after
    cursor_param: after
  table:
    primary_key:
      - event_id
    trust_tier: silver
