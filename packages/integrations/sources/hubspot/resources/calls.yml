type: resource
name: calls
description: HubSpot CRM call engagement records
api:
  endpoint: /crm/v3/objects/calls
  method: GET
  query_params:
    limit: ${{ input.limit }}
    properties: ${{ input.properties }}
input:
  limit:
    type: integer
    description: Number of call records to return per page (max 100)
    default: 100
  properties:
    type: string
    description: Comma-separated list of call properties to return
    default: hs_timestamp,hs_call_title,hs_call_body,hs_call_duration,hs_call_status,hs_call_direction,hubspot_owner_id,hs_createdate,hs_lastmodifieddate
output:
  id:
    type: string
    path: $.id
    description: Unique HubSpot identifier for the call record
  timestamp:
    type: timestamp
    path: $.properties.hs_timestamp
    description: When the call occurred
  title:
    type: string
    path: $.properties.hs_call_title
    description: Title of the call
  body:
    type: string
    path: $.properties.hs_call_body
    description: Body or notes of the call
  duration:
    type: integer
    path: $.properties.hs_call_duration
    description: Duration of the call in milliseconds
  status:
    type: string
    path: $.properties.hs_call_status
    description: Status of the call (e.g. COMPLETED, BUSY, NO_ANSWER)
  direction:
    type: string
    path: $.properties.hs_call_direction
    description: Direction of the call (INBOUND or OUTBOUND)
  owner_id:
    type: string
    path: $.properties.hubspot_owner_id
    description: HubSpot owner ID assigned to this call
  created_at:
    type: timestamp
    path: $.properties.hs_createdate
    description: When the call record was created
  updated_at:
    type: timestamp
    path: $.properties.hs_lastmodifieddate
    description: When the call record was last modified
extract:
  record_path: $.results
  pagination:
    type: cursor
    cursor_path: $.paging.next.after
    cursor_param: after
  table:
    primary_key:
      - id
    trust_tier: silver
incremental:
  strategy: cursor
  cursor_field: updated_at
  cursor_param: filterGroups
