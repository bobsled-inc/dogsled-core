spec_version: '2'
type: source
name: hubspot
description: HubSpot CRM API
transports:
  - id: default
    base_url: https://api.hubapi.com
    auth:
      type: bearer
      token: ${{ env.HUBSPOT_ACCESS_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 5
      burst: 10
    headers:
      User-Agent: bobsled-core-extractor
default_transport: default
