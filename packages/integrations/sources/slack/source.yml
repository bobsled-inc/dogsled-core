spec_version: '2'
type: source
name: slack
description: Slack Web API
transports:
  - id: default
    base_url: https://slack.com/api
    auth:
      type: bearer
      token: ${{ env.SLACK_BOT_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 1
      burst: 3
    headers:
      User-Agent: dogsled-extractor
default_transport: default
