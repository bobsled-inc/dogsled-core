spec_version: '2'
type: source
name: customer_io
description: Customer.io App API for activities, messages, newsletters, and segments.
transports:
  - id: default
    base_url: https://api.customer.io
    auth:
      type: bearer
      token: ${{ env.CUSTOMER_IO_APP_API_KEY }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 10
      burst: 20
    headers:
      Accept: application/json
      User-Agent: dogsled-extractor
default_transport: default
