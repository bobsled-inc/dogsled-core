spec_version: '2'
type: source
name: findymail
description: Findymail email finder API
transports:
  - id: default
    base_url: https://app.findymail.com
    auth:
      type: bearer
      token: ${{ env.FINDYMAIL_API_KEY }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 5
      burst: 10
    headers:
      Accept: application/json
      Content-Type: application/json
default_transport: default
