spec_version: '2'
type: source
name: confluence
description: Confluence Cloud REST API for spaces, content, groups, and users
transports:
  - id: default
    base_url: https://${{ env.CONFLUENCE_SITE }}.atlassian.net
    auth:
      type: basic
      username: ${{ env.CONFLUENCE_EMAIL }}
      password: ${{ env.CONFLUENCE_API_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 5
      burst: 10
    headers:
      Accept: application/json
      User-Agent: dogsled-extractor
default_transport: default
