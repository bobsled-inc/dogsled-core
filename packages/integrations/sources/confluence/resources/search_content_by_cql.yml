type: resource
name: search_content_by_cql
description: Search content by CQL
api:
  endpoint: /wiki/rest/api/content/search
  method: GET
  query_params:
    cql: ${{ input.cql }}
    cqlcontext: ${{ input.cqlcontext }}
    expand: ${{ input.expand }}
    cursor: ${{ input.cursor }}
    limit: ${{ input.limit }}
input:
  cql:
    type: string
    required: true
    description: The CQL string that is used to find the requested content.
  cqlcontext:
    type: string
    description: |-
      The space, content, and content status to execute the search against.
      Specify this as an object with the following properties:

      - `spaceKey` Key of the space to search against. Optional.
      - `contentId` ID of the content to search against. Optional. Must
      be in the space spacified by `spaceKey`.
      - `contentStatuses` Content statuses to search against. Optional.
  expand:
    type: array
    description: >-
      A multi-value parameter indicating which properties of the content to expand.


      - `childTypes.all` returns whether the content has attachments, comments, or child
      pages/whiteboards.

      Use this if you only need to check whether the content has children of a particular type.

      - `childTypes.attachment` returns whether the content has attachments.

      - `childTypes.comment` returns whether the content has comments.

      - `childTypes.page` returns whether the content has child pages.

      - `childTypes.whiteboard` returns whether the content has child whiteboards.

      - `childTypes.database` returns whether the content has child databases.

      - `childTypes.embed` returns whether the content has child embeds (smartlinks).

      - `childTypes.folder` returns whether the content has child folders.

      - `container` returns the space that the content is in. This is the same as the information

      returned by [Get space](#api-space-spaceKey-get).

      - `metadata.currentuser` returns information about the current user in relation to the
      content,

      including when they last viewed it, modified it, contributed to it, or added it as a favorite.

      - `metadata.properties` returns content properties that have been set via the Confluence REST
      API.

      - `metadata.labels` returns the labels that have been added to the content.

      - `metadata.frontend` this property is only used by Atlassian.

      - `operations` returns the operations for the content, which are used when setting
      permissions.

      - `children.page` returns pages that are descendants at the level immediately below the
      content.

      - `children.whiteboard` returns whiteboards that are descendants at the level immediately
      below the content.

      - `children.database` returns databases that are descendants at the level immediately below
      the content.

      - `children.embed` returns embeds (smartlinks) that are descendants at the level immediately
      below the content.

      - `children.folder` returns folders that are descendants at the level immediately below the
      content.

      - `children.attachment` returns all attachments for the content.

      - `children.comment` returns all comments on the content.

      - `restrictions.read.restrictions.user` returns the users that have permission to read the
      content.

      - `restrictions.read.restrictions.group` returns the groups that have permission to read the
      content. Note that

      this may return deleted groups, because deleting a group doesn't remove associated
      restrictions.

      - `restrictions.update.restrictions.user` returns the users that have permission to update the
      content.

      - `restrictions.update.restrictions.group` returns the groups that have permission to update
      the content. Note that

      this may return deleted groups because deleting a group doesn't remove associated
      restrictions.

      - `history` returns the history of the content, including the date it was created.

      - `history.lastUpdated` returns information about the most recent update of the content,
      including

      who updated it and when it was updated.

      - `history.previousVersion` returns information about the update prior to the current content
      update.

      - `history.contributors` returns all of the users who have contributed to the content.

      - `history.nextVersion` returns information about the update after to the current content
      update.

      - `ancestors` returns the parent content, if the content is a page or whiteboard.

      - `body` returns the body of the content in different formats, including the editor format,

      view format, and export format.

      - `body.storage` returns the body of content in storage format.

      - `body.view` returns the body of content in view format.

      - `version` returns information about the most recent update of the content, including who
      updated it

      and when it was updated.

      - `descendants.page` returns pages that are descendants at any level below the content.

      - `descendants.whiteboard` returns whiteboards that are descendants at any level below the
      content.

      - `descendants.database` returns databases that are descendants at any level below the
      content.

      - `descendants.embed` returns embeds (smartlinks) that are descendants at any level below the
      content.

      - `descendants.folder` returns folders that are descendants at any level below the content.

      - `descendants.attachment` returns all attachments for the content, same as
      `children.attachment`.

      - `descendants.comment` returns all comments on the content, same as `children.comment`.

      - `space` returns the space that the content is in. This is the same as the information
      returned by

      [Get space](#api-space-spaceKey-get).


      In addition, the following comment-specific expansions can be used:

      - `extensions.inlineProperties` returns inline comment-specific properties.

      - `extensions.resolution` returns the resolution status of each comment.
  cursor:
    type: string
    description:
      Pointer to a set of search results, returned as part of the `next` or `prev` URL from
      the previous search call.
  limit:
    type: integer
    description: |-
      The maximum number of content objects to return per page.
      Note, this may be restricted by fixed system limits.
    default: 25
    minimum: 0
output:
  id:
    type: string
    path: $.id
  type:
    type: string
    path: $.type
    description: Can be "page", "blogpost", "attachment" or "content"
  status:
    type: string
    path: $.status
  title:
    type: string
    path: $.title
  space:
    type: object
    path: $.space
  history:
    type: object
    path: $.history
  version:
    type: object
    path: $.version
  ancestors:
    type: array
    path: $.ancestors
  operations:
    type: array
    path: $.operations
  children_attachment:
    type: object
    path: $.children.attachment
  children_comment:
    type: object
    path: $.children.comment
  children_page:
    type: object
    path: $.children.page
  children_whiteboard:
    type: object
    path: $.children.whiteboard
  children_database:
    type: object
    path: $.children.database
  children_embed:
    type: object
    path: $.children.embed
  children_folder:
    type: object
    path: $.children.folder
  children_expandable:
    type: object
    path: $.children._expandable
  children_links:
    type: object
    path: $.children._links
  child_types_attachment:
    type: object
    path: $.childTypes.attachment
  child_types_comment:
    type: object
    path: $.childTypes.comment
  child_types_page:
    type: object
    path: $.childTypes.page
  child_types_expandable:
    type: object
    path: $.childTypes._expandable
  descendants_attachment:
    type: object
    path: $.descendants.attachment
  descendants_comment:
    type: object
    path: $.descendants.comment
  descendants_page:
    type: object
    path: $.descendants.page
  descendants_whiteboard:
    type: object
    path: $.descendants.whiteboard
  descendants_database:
    type: object
    path: $.descendants.database
  descendants_embed:
    type: object
    path: $.descendants.embed
  descendants_folder:
    type: object
    path: $.descendants.folder
  descendants_expandable:
    type: object
    path: $.descendants._expandable
  descendants_links:
    type: object
    path: $.descendants._links
  container:
    type: object
    path: $.container
    description: Container for content.
  body:
    type: object
    path: $.body
  restrictions_read:
    type: object
    path: $.restrictions.read
  restrictions_update:
    type: object
    path: $.restrictions.update
  restrictions_expandable:
    type: object
    path: $.restrictions._expandable
  restrictions_links:
    type: object
    path: $.restrictions._links
  metadata_currentuser:
    type: object
    path: $.metadata.currentuser
  metadata_properties:
    type: object
    path: $.metadata.properties
  metadata_frontend:
    type: object
    path: $.metadata.frontend
  metadata_labels:
    type: string
    path: $.metadata.labels
  macro_rendered_output:
    type: object
    path: $.macroRenderedOutput
  extensions:
    type: object
    path: $.extensions
  expandable:
    type: object
    path: $._expandable
  links:
    type: object
    path: $._links
extract:
  record_path: $.results
  paginated: false
  table:
    primary_key:
      - id
    trust_tier: silver
