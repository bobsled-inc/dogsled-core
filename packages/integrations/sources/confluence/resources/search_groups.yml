type: resource
name: search_groups
description: Search groups by partial query
api:
  endpoint: /wiki/rest/api/group/picker
  method: GET
  query_params:
    query: ${{ input.query }}
    start: ${{ input.start }}
    limit: ${{ input.limit }}
    shouldReturnTotalSize: ${{ input.should_return_total_size }}
input:
  query:
    type: string
    required: true
    description: the search term used to query results.
  start:
    type: integer
    description: The starting index of the returned groups.
    default: 0
    minimum: 0
  limit:
    type: integer
    description: |-
      The maximum number of groups to return per page.
      Note, this is restricted to a maximum limit of 200 groups.
    default: 200
    minimum: 0
  should_return_total_size:
    type: boolean
    description: >-
      Whether to include total size parameter in the results.

      Note, fetching total size property is an expensive operation; use it if your use case needs
      this value.
    default: false
output:
  type:
    type: string
    path: $.type
  name:
    type: string
    path: $.name
  id:
    type: string
    path: $.id
  usage_type:
    type: string
    path: $.usageType
    description: 'This property represents how this collection of users is used:'
  managed_by:
    type: string
    path: $.managedBy
    description: 'This property represents how this collection of users is managed:'
  links:
    type: object
    path: $._links
extract:
  record_path: $.results
  paginated: false
  table:
    primary_key:
      - name
    trust_tier: silver
