spec_version: '2'
type: source
name: freshsales
description: Freshsales CRM API for contacts, accounts, deals, tasks, and appointments.
transports:
  - id: default
    base_url: https://${{ env.FRESHSALES_DOMAIN }}.myfreshworks.com/crm/sales/api
    auth:
      type: api-key
      header: Authorization
      key: Token token=${{ env.FRESHSALES_API_KEY }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 10
      burst: 20
    headers:
      Accept: application/json
      User-Agent: bobsled-core-extractor
default_transport: default
