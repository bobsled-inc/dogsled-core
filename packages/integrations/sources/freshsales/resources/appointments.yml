type: resource
name: appointments
description: Appointments in Freshsales CRM.
api:
  endpoint: /appointments
  method: GET
  query_params:
    per_page: ${{ input.per_page }}
    filter: ${{ input.filter }}
input:
  per_page:
    type: integer
    default: 100
  filter:
    type: string
    default: open
output:
  id:
    type: integer
    path: $.id
  title:
    type: string
    path: $.title
  description:
    type: string
    path: $.description
  from_date:
    type: timestamp
    path: $.from_date
  end_date:
    type: timestamp
    path: $.end_date
  location:
    type: string
    path: $.location
  created_at:
    type: timestamp
    path: $.created_at
  updated_at:
    type: timestamp
    path: $.updated_at
extract:
  record_path: $.appointments
  table:
    primary_key:
      - id
  pagination:
    type: page_number
    page_param: page
    per_page_param: per_page
    total_pages_path: $.meta.total_pages
