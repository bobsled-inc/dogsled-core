type: resource
name: list_contexts
description: List contexts
api:
  endpoint: /context
  method: GET
  query_params:
    owner-id: ${{ input.owner_id }}
    owner-slug: ${{ input.owner_slug }}
    owner-type: ${{ input.owner_type }}
    page-token: ${{ input.page_token }}
input:
  owner_id:
    type: string
    description:
      The unique ID of the owner of the context. This is the organization ID. Specify either
      owner/organization ID or the owner/organization slug. Find the organization ID and slug in the
      CircleCI web app (Organization Settings > Overview). Owner/organization slug is not supported
      for CircleCI server.
  owner_slug:
    type: string
    description:
      A string that represents an organization. This is the organization slug. Specify either
      this or organization/owner ID. Find the organization ID and slug in the CircleCI web app
      (Organization Settings > Overview). Owner/organization slug is not supported for CircleCI
      server.
  owner_type:
    type: string
    description: The type of the owner. Defaults to "organization". Use "account" if you are using
      CircleCI server.
    enum:
      - account
      - organization
    default: organization
  page_token:
    type: string
    description: A token to specify which page of results to fetch.
output:
  id:
    type: string
    path: $.id
    description: The unique ID of the context.
  name:
    type: string
    path: $.name
    description: The user defined name of the context.
  created_at:
    type: timestamp
    path: $.created_at
    description: The date and time the context was created.
extract:
  record_path: $.items
  paginated: false
  for_each:
    resource: get_collaborations
    field: id
    input: owner_id
  table:
    primary_key:
      - id
    trust_tier: silver
lookup:
  description: Get a context
  api:
    endpoint: /context/${{ input.context_id }}
    method: GET
  input:
    context_id:
      type: string
      required: true
