type: resource
name: trackers
description: Trackers configured in Gong.
api:
  endpoint: /trackers
  method: GET
input: {}
output:
  id:
    type: string
    path: $.id
  name:
    type: string
    path: $.name
  description:
    type: string
    path: $.description
  active:
    type: boolean
    path: $.active
  owner_id:
    type: string
    path: $.ownerId
  updated_at:
    type: timestamp
    path: $.updatedAt
extract:
  record_path: $.trackers
  table:
    primary_key:
      - id
