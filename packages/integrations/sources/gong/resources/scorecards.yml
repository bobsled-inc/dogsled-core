type: resource
name: scorecards
description: Scorecards created in Gong.
api:
  endpoint: /scorecards
  method: GET
input: {}
output:
  id:
    type: string
    path: $.id
  name:
    type: string
    path: $.name
  score:
    type: number
    path: $.score
  call_id:
    type: string
    path: $.callId
  reviewer_id:
    type: string
    path: $.reviewerId
  created_at:
    type: timestamp
    path: $.createdAt
extract:
  record_path: $.scorecards
  table:
    primary_key:
      - id
