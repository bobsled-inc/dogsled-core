spec_version: '2'
type: source
name: gong
description: Gong API for users, calls, meetings, and related conversation artifacts.
transports:
  - id: default
    base_url: https://api.gong.io/v2
    auth:
      type: bearer
      token: ${{ env.GONG_ACCESS_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 2
      burst: 4
    headers:
      Accept: application/json
      User-Agent: dogsled-extractor
default_transport: default
