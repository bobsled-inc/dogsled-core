type: resource
name: tasks
description: List Close CRM tasks
api:
  endpoint: /task/
  method: GET
  query_params:
    _skip: ${{ input.skip }}
    _limit: ${{ input.limit }}
input:
  skip:
    type: integer
    description: Pagination offset
    default: 0
  limit:
    type: integer
    description: Page size
    default: 100
output:
  id:
    type: string
    path: $.id
    description: Task identifier
  lead_id:
    type: string
    path: $.lead_id
    description: Associated lead identifier
  text:
    type: string
    path: $.text
    description: Task text
  status:
    type: string
    path: $.status
    description: Task status
  date_created:
    type: timestamp
    path: $.date_created
    description: Task creation timestamp
extract:
  record_path: $.data
  table:
    primary_key:
      - id
    trust_tier: silver
  pagination:
    type: offset
    offset_param: _skip
    limit_param: _limit
