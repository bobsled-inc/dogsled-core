type: resource
name: opportunities
description: List Close CRM opportunities
api:
  endpoint: /opportunity/
  method: GET
  query_params:
    _skip: ${{ input.skip }}
    _limit: ${{ input.limit }}
input:
  skip:
    type: integer
    description: Pagination offset
    default: 0
  limit:
    type: integer
    description: Page size
    default: 100
output:
  id:
    type: string
    path: $.id
    description: Opportunity identifier
  lead_id:
    type: string
    path: $.lead_id
    description: Associated lead identifier
  status_label:
    type: string
    path: $.status_label
    description: Opportunity status label
  value:
    type: number
    path: $.value
    description: Opportunity value
  date_created:
    type: timestamp
    path: $.date_created
    description: Opportunity creation timestamp
extract:
  record_path: $.data
  table:
    primary_key:
      - id
    trust_tier: silver
  pagination:
    type: offset
    offset_param: _skip
    limit_param: _limit
