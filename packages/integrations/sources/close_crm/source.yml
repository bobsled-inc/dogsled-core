spec_version: '2'
type: source
name: close_crm
description: Close CRM API for leads, contacts, opportunities, tasks, and users
transports:
  - id: default
    base_url: https://api.close.com/api/v1
    auth:
      type: basic
      username: ${{ env.CLOSE_API_KEY }}
      password: ''
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 5
      burst: 10
    headers:
      Accept: application/json
      User-Agent: dogsled-extractor
default_transport: default
