spec_version: '2'
type: source
name: calendly
description: Calendly scheduling API
transports:
  - id: default
    base_url: https://api.calendly.com
    auth:
      type: bearer
      token: ${{ env.CALENDLY_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 10
      burst: 20
    headers:
      Accept: application/json
      User-Agent: bobsled-core-extractor
default_transport: default
