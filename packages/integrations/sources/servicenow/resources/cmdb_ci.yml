type: resource
name: cmdb_ci
description: Configuration items from the ServiceNow CMDB.
api:
  endpoint: /table/cmdb_ci
  method: GET
  query_params:
    sysparm_fields: ${{ input.fields }}
    sysparm_limit: ${{ input.limit }}
    sysparm_display_value: ${{ input.display_value }}
    sysparm_query: ${{ input.query }}
input:
  fields:
    type: string
    default: sys_id,name,sys_class_name,category,subcategory,operational_status,install_status,assigned_to,sys_updated_on
  query:
    type: string
    default: ORDERBYsys_updated_on^ORDERBYsys_id
  limit:
    type: integer
    default: 1000
  display_value:
    type: string
    default: 'true'
query:
  search:
    dialect: servicenow_sysparm_query
    append: ^ORDERBYsys_updated_on^ORDERBYsys_id
    bind:
      input: query
      preserve_default: true
output:
  sys_id:
    type: string
    path: $.sys_id
  name:
    type: string
    path: $.name
  sys_class_name:
    type: string
    path: $.sys_class_name
  category:
    type: string
    path: $.category
  subcategory:
    type: string
    path: $.subcategory
  operational_status:
    type: string
    path: $.operational_status
  install_status:
    type: string
    path: $.install_status
  assigned_to:
    type: string
    path: $.assigned_to
  sys_updated_on:
    type: timestamp
    path: $.sys_updated_on
extract:
  record_path: $.result
  table:
    primary_key:
      - sys_id
  pagination:
    type: offset
    offset_param: sysparm_offset
    limit_param: sysparm_limit
