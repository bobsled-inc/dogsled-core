type: resource
name: groups
description: Groups from the ServiceNow sys_user_group table.
api:
  endpoint: /table/sys_user_group
  method: GET
  query_params:
    sysparm_fields: ${{ input.fields }}
    sysparm_limit: ${{ input.limit }}
    sysparm_display_value: ${{ input.display_value }}
    sysparm_query: ${{ input.query }}
input:
  fields:
    type: string
    default: sys_id,name,description,active,type,manager,sys_updated_on
  query:
    type: string
    default: ORDERBYsys_updated_on^ORDERBYsys_id
  limit:
    type: integer
    default: 1000
  display_value:
    type: string
    default: 'true'
query:
  search:
    dialect: servicenow_sysparm_query
    append: ^ORDERBYsys_updated_on^ORDERBYsys_id
    bind:
      input: query
      preserve_default: true
output:
  sys_id:
    type: string
    path: $.sys_id
  name:
    type: string
    path: $.name
  description:
    type: string
    path: $.description
  active:
    type: boolean
    path: $.active
  type:
    type: string
    path: $.type
  manager:
    type: string
    path: $.manager
  sys_updated_on:
    type: timestamp
    path: $.sys_updated_on
extract:
  record_path: $.result
  table:
    primary_key:
      - sys_id
  pagination:
    type: offset
    offset_param: sysparm_offset
    limit_param: sysparm_limit
