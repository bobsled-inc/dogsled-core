type: resource
name: change_requests
description: Change requests from the ServiceNow change_request table.
api:
  endpoint: /table/change_request
  method: GET
  query_params:
    sysparm_fields: ${{ input.fields }}
    sysparm_limit: ${{ input.limit }}
    sysparm_display_value: ${{ input.display_value }}
    sysparm_query: ${{ input.query }}
input:
  fields:
    type: string
    default: sys_id,number,short_description,description,state,priority,type,assigned_to,start_date,end_date,sys_updated_on
  query:
    type: string
    default: ORDERBYsys_updated_on^ORDERBYsys_id
  limit:
    type: integer
    default: 1000
  display_value:
    type: string
    default: 'true'
query:
  search:
    dialect: servicenow_sysparm_query
    append: ^ORDERBYsys_updated_on^ORDERBYsys_id
    bind:
      input: query
      preserve_default: true
output:
  sys_id:
    type: string
    path: $.sys_id
  number:
    type: string
    path: $.number
  short_description:
    type: string
    path: $.short_description
  description:
    type: string
    path: $.description
  state:
    type: string
    path: $.state
  priority:
    type: string
    path: $.priority
  type:
    type: string
    path: $.type
  assigned_to:
    type: string
    path: $.assigned_to
  start_date:
    type: timestamp
    path: $.start_date
  end_date:
    type: timestamp
    path: $.end_date
  sys_updated_on:
    type: timestamp
    path: $.sys_updated_on
extract:
  record_path: $.result
  table:
    primary_key:
      - sys_id
  pagination:
    type: offset
    offset_param: sysparm_offset
    limit_param: sysparm_limit
