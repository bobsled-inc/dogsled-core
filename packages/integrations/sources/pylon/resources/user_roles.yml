type: resource
name: user_roles
description: Role definitions that control user permissions
api:
  endpoint: /user-roles
  method: GET
input: {}
output:
  id:
    type: string
    path: $.id
    description: Unique user role identifier
  name:
    type: string
    path: $.name
    description: Role display name
  created_at:
    type: timestamp
    path: $.created_at
    description: When the role was created
  updated_at:
    type: timestamp
    path: $.updated_at
    description: When the role was last updated
extract:
  record_path: $.data
  table:
    primary_key:
      - id
