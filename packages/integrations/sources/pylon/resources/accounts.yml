type: resource
name: accounts
description: Customer accounts in Pylon with owner, tags, and custom field metadata
api:
  endpoint: /accounts
  method: GET
input: {}
output:
  id:
    type: string
    path: $.id
    description: Unique account identifier
  name:
    type: string
    path: $.name
    description: Account name
  domain:
    type: string
    path: $.domain
    description: Account domain (e.g. company website)
  owner_id:
    type: string
    path: $.owner_id
    description: User ID of the account owner
  tags:
    type: string
    path: $.tags
    description: Tags assigned to the account
  created_at:
    type: timestamp
    path: $.created_at
    description: When the account was created
  updated_at:
    type: timestamp
    path: $.updated_at
    description: When the account was last updated
extract:
  record_path: $.data
  pagination:
    type: cursor
    cursor_path: $.pagination.cursor
    cursor_param: cursor
  table:
    primary_key:
      - id
