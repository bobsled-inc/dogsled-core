spec_version: '2'
type: source
name: vercel
description: Vercel projects, deployments, billing, observability metrics, and sandbox usage.
transports:
  - id: default
    base_url: https://api.vercel.com
    auth:
      type: bearer
      token: ${{ env.VERCEL_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 408
        - 429
        - 500
        - 502
        - 503
        - 504
      max_retries: 5
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 1
      burst: 1
    headers:
      Accept: application/json
      Accept-Encoding: gzip
      User-Agent: bobsled-core-extractor
default_transport: default
