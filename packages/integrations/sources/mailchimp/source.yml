spec_version: '2'
type: source
name: mailchimp
description: Mailchimp Marketing API for audiences, campaigns, templates, and automations
transports:
  - id: default
    base_url: https://${{ env.MAILCHIMP_SERVER_PREFIX }}.api.mailchimp.com
    auth:
      type: basic
      username: anystring
      password: ${{ env.MAILCHIMP_API_KEY }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 5
      burst: 10
    headers:
      Accept: application/json
      User-Agent: bobsled-core-extractor
default_transport: default
