spec_version: '2'
type: source
name: tiktok_ads
description: TikTok Marketing API for advertisers, campaigns, ad groups, ads, and reports.
transports:
  - id: default
    base_url: https://business-api.tiktok.com/open_api/v1.3
    auth:
      type: api-key
      header: Access-Token
      key: ${{ env.TIKTOK_ACCESS_TOKEN }}
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 10
      burst: 20
    headers:
      Accept: application/json
      User-Agent: bobsled-core-extractor
default_transport: default
