type: resource
name: get_project_sections
description: List sections for each Asana project
api:
  endpoint: /projects/${{ input.project_gid }}/sections
  method: GET
  query_params:
    limit: ${{ input.limit }}
    offset: ${{ input.offset }}
input:
  project_gid:
    type: string
    description: Asana project GID to list sections from
    required: true
  limit:
    type: integer
    description: Number of sections to return per page
    default: 100
  offset:
    type: string
    description: Pagination cursor returned by the previous response
output:
  gid:
    type: string
    path: $.gid
    description: Asana section identifier
  name:
    type: string
    path: $.name
    description: Section name
  resource_type:
    type: string
    path: $.resource_type
    description: Asana resource type
extract:
  record_path: $.data
  pagination:
    type: cursor
    cursor_path: $.next_page.offset
    cursor_param: offset
  for_each:
    resource: get_projects
    field: gid
    input: project_gid
  table:
    primary_key:
      - gid
    trust_tier: silver
