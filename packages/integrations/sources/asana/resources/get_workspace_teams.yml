type: resource
name: get_workspace_teams
description: List teams in each Asana workspace accessible to the authenticated user
api:
  endpoint: /workspaces/${{ input.workspace_gid }}/teams
  method: GET
  query_params:
    limit: ${{ input.limit }}
    offset: ${{ input.offset }}
input:
  workspace_gid:
    type: string
    description: Asana workspace GID to list teams from
    required: true
  limit:
    type: integer
    description: Number of teams to return per page
    default: 100
  offset:
    type: string
    description: Pagination cursor returned by the previous response
output:
  gid:
    type: string
    path: $.gid
    description: Asana team identifier
  name:
    type: string
    path: $.name
    description: Team name
  resource_type:
    type: string
    path: $.resource_type
    description: Asana resource type
extract:
  record_path: $.data
  pagination:
    type: cursor
    cursor_path: $.next_page.offset
    cursor_param: offset
  for_each:
    resource: get_workspaces
    field: gid
    input: workspace_gid
  table:
    primary_key:
      - gid
    trust_tier: silver
