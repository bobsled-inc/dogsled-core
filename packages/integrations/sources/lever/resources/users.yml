type: resource
name: users
description: List Lever users
api:
  endpoint: /users
  method: GET
  query_params:
    offset: ${{ input.offset }}
    limit: ${{ input.limit }}
input:
  offset:
    type: integer
    description: Pagination offset
    default: 0
  limit:
    type: integer
    description: Page size
    default: 100
output:
  id:
    type: string
    path: $.id
    description: User identifier
  name:
    type: string
    path: $.name
    description: User name
  email:
    type: string
    path: $.email
    description: User email
  access_role:
    type: string
    path: $.accessRole
    description: Access role
extract:
  record_path: $.data
  table:
    primary_key:
      - id
    trust_tier: silver
  pagination:
    type: offset
    offset_param: offset
    limit_param: limit
