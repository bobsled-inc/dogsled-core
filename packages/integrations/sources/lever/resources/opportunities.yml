type: resource
name: opportunities
description: List Lever opportunities
api:
  endpoint: /opportunities
  method: GET
  query_params:
    offset: ${{ input.offset }}
    limit: ${{ input.limit }}
input:
  offset:
    type: integer
    description: Pagination offset
    default: 0
  limit:
    type: integer
    description: Page size
    default: 100
output:
  id:
    type: string
    path: $.id
    description: Opportunity identifier
  name:
    type: string
    path: $.name
    description: Candidate name
  stage:
    type: string
    path: $.stage
    description: Current stage
  archived_at:
    type: timestamp
    path: $.archivedAt
    description: Archived timestamp
extract:
  record_path: $.data
  table:
    primary_key:
      - id
    trust_tier: silver
  pagination:
    type: offset
    offset_param: offset
    limit_param: limit
