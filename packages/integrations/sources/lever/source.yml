spec_version: '2'
type: source
name: lever
description: Lever API for opportunities, postings, requisitions, feedback forms, and users
transports:
  - id: default
    base_url: https://api.lever.co/v1
    auth:
      type: basic
      username: ${{ env.LEVER_API_KEY }}
      password: ''
    timeout_ms: 30000
    retry:
      retry_on:
        - 429
        - 500
        - 502
        - 503
      max_retries: 3
      backoff: exponential
      retry_after_header: true
    rate_limit:
      requests_per_second: 10
      burst: 20
    headers:
      Accept: application/json
      User-Agent: dogsled-extractor
default_transport: default
