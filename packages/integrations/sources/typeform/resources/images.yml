type: resource
name: images
description: List Typeform images
api:
  endpoint: /images
  method: GET
  query_params:
    page_size: ${{ input.page_size }}
    after: ${{ input.after }}
input:
  page_size:
    type: integer
    description: Page size
    default: 100
  after:
    type: string
    description: Pagination cursor
output:
  id:
    type: string
    path: $.id
    description: Image identifier
  file_name:
    type: string
    path: $.file_name
    description: Image filename
  url:
    type: string
    path: $.src
    description: Image source URL
extract:
  record_path: $.items
  table:
    primary_key:
      - id
    trust_tier: silver
  pagination:
    type: cursor
    cursor_param: after
    cursor_path: $.page.next_token
