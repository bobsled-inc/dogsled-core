type: resource
name: themes
description: List Typeform themes
api:
  endpoint: /themes
  method: GET
  query_params:
    page_size: ${{ input.page_size }}
    after: ${{ input.after }}
input:
  page_size:
    type: integer
    description: Page size
    default: 100
  after:
    type: string
    description: Pagination cursor
output:
  id:
    type: string
    path: $.id
    description: Theme identifier
  name:
    type: string
    path: $.name
    description: Theme name
  visibility:
    type: string
    path: $.visibility
    description: Theme visibility
extract:
  record_path: $.items
  table:
    primary_key:
      - id
    trust_tier: silver
  pagination:
    type: cursor
    cursor_param: after
    cursor_path: $.page.next_token
