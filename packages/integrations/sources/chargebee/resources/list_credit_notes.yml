type: resource
name: list_credit_notes
description: List credit notes
api:
  endpoint: /credit_notes
  method: GET
  query_params:
    limit: ${{ input.limit }}
    offset: ${{ input.offset }}
    include_deleted: ${{ input.include_deleted }}
    id: ${{ input.id }}
    customer_id: ${{ input.customer_id }}
    subscription_id: ${{ input.subscription_id }}
    reference_invoice_id: ${{ input.reference_invoice_id }}
    type: ${{ input.type }}
    reason_code: ${{ input.reason_code }}
    create_reason_code: ${{ input.create_reason_code }}
    status: ${{ input.status }}
    date: ${{ input.date }}
    total: ${{ input.total }}
    price_type: ${{ input.price_type }}
    amount_allocated: ${{ input.amount_allocated }}
    amount_refunded: ${{ input.amount_refunded }}
    amount_available: ${{ input.amount_available }}
    voided_at: ${{ input.voided_at }}
    updated_at: ${{ input.updated_at }}
    sort_by: ${{ input.sort_by }}
    channel: ${{ input.channel }}
    einvoice: ${{ input.einvoice }}
input:
  limit:
    type: integer
    description: The number of resources to be returned.
    default: 10
    minimum: 1
    maximum: 100
  offset:
    type: string
    description: >-
      Determines your position in the list for pagination. To ensure that the next page is retrieved
      correctly, always set `offset`

      to the value of `next_offset`

      obtained in the previous iteration of the API call.
    maxLength: 1000
  include_deleted:
    type: boolean
    description: >-
      If set to true, includes the deleted resources in the response. For the deleted resources in
      the response, the '**deleted**

      ' attribute will be '**true**

      '.
    default: false
  id:
    type: object
    description: |-
      optional, string filter

      Credit-note id.
      **Supported operators :**
      is, is_not, starts_with, in, not_in

      **Example →**
      *id\[is\] = "CN_123"*
  customer_id:
    type: object
    description: |-
      optional, string filter

      The identifier of the customer this Credit Note belongs to.
      **Supported operators :**
      is, is_not, starts_with, in, not_in

      **Example →**
      *customer_id\[is\] = "4gmiXbsjdm"*
  subscription_id:
    type: object
    description: |-
      optional, string filter

      To filter based on subscription_id.
      NOTE: Not to be used if *consolidated invoicing*
      feature is enabled.
      **Supported operators :**
      is, is_not, starts_with, is_present, in, not_in

      **Example →**
      *subscription_id\[is\] = "4gmiXbsjdm"*
  reference_invoice_id:
    type: object
    description: |-
      optional, string filter

      The identifier of the invoice against which this Credit Note is issued.
      **Supported operators :**
      is, is_not, starts_with, in, not_in

      **Example →**
      *reference_invoice_id\[is\] = "INVOICE_876"*
  type:
    type: object
    description: |-
      optional, enumerated string filter

      The credit note type. Possible values are : adjustment, refundable.

      **Supported operators :**
      is, is_not, in, not_in

      **Example →**
      *type\[is_not\] = "adjustment"*
  reason_code:
    type: object
    description: >-
      optional, enumerated string filter


      The reason for issuing this Credit Note. The following reason codes are supported
      now\[Deprecated; use the
      [create_reason_code](/docs/api/credit_notes/credit_note-object#create_reason_code)

      parameter instead\]. Possible values are : write_off, subscription_change,
      subscription_cancellation, subscription_pause, chargeback, product_unsatisfactory,
      service_unsatisfactory, order_change, order_cancellation, waiver, other, fraudulent.


      **Supported operators :**

      is, is_not, in, not_in


      **Example →**

      *reason_code\[is\] = "waiver"*
  create_reason_code:
    type: object
    description: >-
      optional, string filter


      Reason code for creating the credit note. Must be one from a list of reason codes set in the
      Chargebee app in **Settings \> Configure Chargebee \> Reason Codes \> Credit Notes \> Create
      Credit Note** .

      Must be passed if set as mandatory in the app. The codes are case-sensitive.

      **Supported operators :**

      is, is_not, starts_with, in, not_in


      **Example →**

      *create_reason_code\[is\] = "Other"*
  status:
    type: object
    description: |-
      optional, enumerated string filter

      The credit note status. Possible values are : adjusted, refunded, refund_due, voided.

      **Supported operators :**
      is, is_not, in, not_in

      **Example →**
      *status\[is\] = "adjusted"*
  date:
    type: object
    description: |-
      optional, timestamp(UTC) in seconds filter

      The date the Credit Note is issued.
      **Supported operators :**
      after, before, on, between

      **Example →**
      *date\[on\] = "1435054328"*
  total:
    type: object
    description: |-
      optional, in cents filter

      Credit Note amount in cents.
      **Supported operators :**
      is, is_not, lt, lte, gt, gte, between

      **Example →**
      *total\[is\] = "1200"*
  price_type:
    type: object
    description: |-
      optional, enumerated string filter

      The price type of the Credit Note. Possible values are : tax_exclusive, tax_inclusive.

      **Supported operators :**
      is, is_not, in, not_in

      **Example →**
      *price_type\[is_not\] = "tax_exclusive"*
  amount_allocated:
    type: object
    description: |-
      optional, in cents filter

      The amount allocated to the invoices.
      **Supported operators :**
      is, is_not, lt, lte, gt, gte, between

      **Example →**
      *amount_allocated\[is\] = "1200"*
  amount_refunded:
    type: object
    description: |-
      optional, in cents filter

      The refunds issued from this Credit Note.
      **Supported operators :**
      is, is_not, lt, lte, gt, gte, between

      **Example →**
      *amount_refunded\[lte\] = "130"*
  amount_available:
    type: object
    description: |-
      optional, in cents filter

      The yet to be used credits of this Credit Note.
      **Supported operators :**
      is, is_not, lt, lte, gt, gte, between

      **Example →**
      *amount_available\[gt\] = "1400"*
  voided_at:
    type: object
    description: |-
      optional, timestamp(UTC) in seconds filter

      Timestamp indicating the date and time this Credit Note gets voided.
      **Supported operators :**
      after, before, on, between

      **Example →**
      *voided_at\[before\] = "1435054328"*
  updated_at:
    type: object
    description: >-
      optional, timestamp(UTC) in seconds filter


      To filter based on updated at. This attribute will be present only if the resource has been
      updated after 2016-09-28.

      **Supported operators :**

      after, before, on, between


      **Example →**

      *updated_at\[on\] = "1243545465"*
  sort_by:
    type: object
    description: |-
      optional, string filter

      Sorts based on the specified attribute.
      **Supported attributes :**
      date

      **Supported sort-orders :**
      asc, desc

      **Example →**
      *sort_by\[asc\] = "date"*

      This will sort the result based on the 'date' attribute in ascending(earliest first) order.
  channel:
    type: object
    description: >-
      optional, enumerated string filter


      The subscription channel this object originated from and is maintained in. Possible values are
      : web, app_store, play_store.


      **Supported operators :**

      is, is_not, in, not_in


      **Example →**

      *channel\[is\] = "APP STORE"*
  einvoice:
    type: object
    description: Parameters for einvoice
output:
  credit_note_id:
    type: string
    path: $.credit_note.id
    description: Unique Chargebee credit note identifier
  credit_note:
    type: object
    path: $.credit_note
    description: Resource object representing credit_note
extract:
  record_path: $.list
  pagination:
    type: offset
    offset_param: offset
    limit_param: limit
  table:
    primary_key:
      - credit_note_id
    trust_tier: silver
lookup:
  description: Retrieve a credit note
  api:
    endpoint: /credit_notes/${{ input.credit_note_id }}
    method: GET
  input:
    credit_note_id:
      type: string
      required: true
test:
  fixtures:
    - name: list_credit_notes_smoke
      input:
        chargebee_request_origin_device: Android
        chargebee_request_origin_user: user@example.com
        chargebee_request_origin_user_encoded: dXNlci7QutCy0ZbRgtC+0YfQutCwQGV4YW1wbGUuY29t
        chargebee_request_origin_ip: 192.168.1.2
        chargebee_business_entity_id: null
        limit: null
        offset: null
        include_deleted: null
        id: CN_123
        customer_id: 4gmiXbsjdm
        subscription_id: 4gmiXbsjdm
        reference_invoice_id: INVOICE_876
        type: adjustment
        reason_code: waiver
        create_reason_code: Other
        status: adjusted
        date: '1435054328'
        total: '1200'
        price_type: tax_exclusive
        amount_allocated: '1200'
        amount_refunded: '130'
        amount_available: '1400'
        voided_at: '1435054328'
        updated_at: '1243545465'
        sort_by: null
        channel: APP STORE
        einvoice: null
