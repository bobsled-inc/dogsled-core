type: resource
name: list_events
description: List events
api:
  endpoint: /events
  method: GET
  query_params:
    limit: ${{ input.limit }}
    offset: ${{ input.offset }}
    id: ${{ input.id }}
    webhook_status: ${{ input.webhook_status }}
    event_type: ${{ input.event_type }}
    source: ${{ input.source }}
    occurred_at: ${{ input.occurred_at }}
    sort_by: ${{ input.sort_by }}
input:
  limit:
    type: integer
    description: The number of resources to be returned.
    default: 10
    minimum: 1
    maximum: 100
  offset:
    type: string
    description: >-
      Determines your position in the list for pagination. To ensure that the next page is retrieved
      correctly, always set `offset`

      to the value of `next_offset`

      obtained in the previous iteration of the API call.
    maxLength: 1000
  id:
    type: object
    description: |-
      optional, string filter

      Uniquely identifies a event.
      **Supported operators :**
      is, is_not, starts_with, in, not_in

      **Example →**
      *id\[is\] = "8ndk0hbKm"*
  webhook_status:
    type: object
    description: >-
      optional, enumerated string filter


      Returns the events (occurred in the past 6 days) which has this status in any of the events'
      webhooks.

      **Note**:

      To retrieve events which have occurred before the 6 day period, use the
      occurred_at(start_time/end_time) attribute. Possible values are : not_configured, scheduled,
      succeeded, re_scheduled, failed, skipped, not_applicable.


      **Supported operators :**

      is, is_not, in, not_in


      **Example →**

      *webhook_status\[is\] = "succeeded"*
  event_type:
    type: object
    description: >-
      optional, enumerated string filter


      Specify it if you need to fetch events of a particular type. Possible values are :
      coupon_created, coupon_updated, coupon_deleted, coupon_set_created, coupon_set_updated,
      coupon_set_deleted, coupon_codes_added, coupon_codes_deleted, coupon_codes_updated,
      customer_created, customer_changed, customer_deleted, customer_moved_out, customer_moved_in,
      promotional_credits_added, promotional_credits_deducted, subscription_created,
      subscription_created_with_backdating, subscription_started, subscription_trial_end_reminder,
      subscription_activated, subscription_activated_with_backdating, subscription_changed,
      mrr_updated, subscription_changed_with_backdating, subscription_cancellation_scheduled,
      subscription_cancellation_reminder, subscription_cancelled,
      subscription_canceled_with_backdating, subscription_reactivated,
      subscription_reactivated_with_backdating, subscription_renewed,
      subscription_scheduled_cancellation_removed, subscription_changes_scheduled,
      subscription_scheduled_changes_removed, subscription_shipping_address_updated,
      subscription_deleted, subscription_paused, subscription_pause_scheduled,
      subscription_scheduled_pause_removed, subscription_resumed, subscription_resumption_scheduled,
      subscription_scheduled_resumption_removed, subscription_advance_invoice_schedule_added,
      subscription_advance_invoice_schedule_updated, subscription_advance_invoice_schedule_removed,
      pending_invoice_created, pending_invoice_updated, invoice_generated,
      invoice_generated_with_backdating, invoice_updated, invoice_deleted, credit_note_created,
      credit_note_created_with_backdating, credit_note_updated, credit_note_deleted,
      subscription_renewal_reminder, add_usages_reminder, transaction_created, transaction_updated,
      transaction_deleted, payment_succeeded, payment_failed, payment_refunded, payment_initiated,
      refund_initiated, authorization_succeeded, authorization_voided, card_added, card_updated,
      card_expiry_reminder, card_expired, card_deleted, payment_source_added,
      payment_source_updated, payment_source_deleted, payment_source_expiring,
      payment_source_expired, virtual_bank_account_added, virtual_bank_account_updated,
      virtual_bank_account_deleted, token_created, token_consumed, token_expired,
      unbilled_charges_created, unbilled_charges_voided, unbilled_charges_deleted,
      unbilled_charges_invoiced, order_created, order_updated, order_cancelled, order_delivered,
      order_returned, order_ready_to_process, order_ready_to_ship, order_deleted, order_resent,
      quote_created, quote_updated, quote_deleted, tax_withheld_recorded, tax_withheld_deleted,
      tax_withheld_refunded, gift_scheduled, gift_unclaimed, gift_claimed, gift_expired,
      gift_cancelled, gift_updated, hierarchy_created, hierarchy_deleted, payment_intent_created,
      payment_intent_updated, contract_term_created, contract_term_renewed,
      contract_term_terminated, contract_term_completed, contract_term_cancelled,
      item_family_created, item_family_updated, item_family_deleted, item_created, item_updated,
      item_deleted, item_price_created, item_price_updated, item_price_deleted,
      attached_item_created, attached_item_updated, attached_item_deleted,
      differential_price_created, differential_price_updated, differential_price_deleted,
      feature_created, feature_updated, feature_deleted, feature_activated, feature_reactivated,
      feature_archived, item_entitlements_updated, entitlement_overrides_updated,
      entitlement_overrides_removed, item_entitlements_removed, entitlement_overrides_auto_removed,
      business_entity_created, business_entity_updated, business_entity_deleted, purchase_created.


      **Supported operators :**

      is, is_not, in, not_in


      **Example →**

      *event_type\[is\] = "customer_created"*
  source:
    type: object
    description: >-
      optional, enumerated string filter


      Source of the event. Possible values are : admin_console, api, scheduled_job, hosted_page,
      portal, system, none, js_api, migration, bulk_operation, external_service.


      **Supported operators :**

      is, is_not, in, not_in


      **Example →**

      *source\[is_not\] = "hosted_page"*
  occurred_at:
    type: object
    description: |-
      optional, timestamp(UTC) in seconds filter

      Timestamp indicating when this event had occurred.
      **Supported operators :**
      after, before, on, between

      **Example →**
      *occurred_at\[after\] = "1349116200"*
  sort_by:
    type: object
    description: >-
      optional, string filter


      Sorts based on the specified attribute.

      **Supported attributes :**

      occurred_at


      **Supported sort-orders :**

      asc, desc


      **Example →**

      *sort_by\[asc\] = "occurred_at"*


      This will sort the result based on the 'occurred_at' attribute in ascending(earliest first)
      order.
output:
  event_id:
    type: string
    path: $.event.id
    description: Unique identifier of an event.
  event_occurred_at:
    type: integer
    path: $.event.occurred_at
    description: Timestamp indicating when this event had occurred.
  event_source:
    type: string
    path: $.event.source
    description: Indicates the origin of the operation that triggered the event.
  event_user:
    type: string
    path: $.event.user
  event_event_type:
    type: string
    path: $.event.event_type
    description: The type of event provided by Chargebee.
  event_api_version:
    type: string
    path: $.event.api_version
    description: The Chargebee API version used to render this event content.
  event_content:
    type: object
    path: $.event.content
    description: The JSON data associated with this event.
  event_origin_user:
    type: string
    path: $.event.origin_user
    description: The email address of the user, if captured, in the API operation that triggered the event.
  event_webhooks:
    type: array
    path: $.event.webhooks
    description: 'Array of webhook call statuses: one for each of the webhooks configured for the site.'
extract:
  record_path: $.list
  pagination:
    type: offset
    offset_param: offset
    limit_param: limit
  table:
    primary_key:
      - event_id
    trust_tier: silver
lookup:
  description: Retrieve an event
  api:
    endpoint: /events/${{ input.event_id }}
    method: GET
  input:
    event_id:
      type: string
      required: true
test:
  fixtures:
    - name: list_events_smoke
      input:
        chargebee_request_origin_device: Android
        chargebee_request_origin_user: user@example.com
        chargebee_request_origin_user_encoded: dXNlci7QutCy0ZbRgtC+0YfQutCwQGV4YW1wbGUuY29t
        chargebee_request_origin_ip: 192.168.1.2
        chargebee_business_entity_id: null
        limit: null
        offset: null
        id: 8ndk0hbKm
        webhook_status: succeeded
        event_type: customer_created
        source: hosted_page
        occurred_at: '1349116200'
        sort_by: null
