type: resource
name: list_coupons
description: List coupons
api:
  endpoint: /coupons
  method: GET
  query_params:
    limit: ${{ input.limit }}
    offset: ${{ input.offset }}
    id: ${{ input.id }}
    name: ${{ input.name }}
    discount_type: ${{ input.discount_type }}
    duration_type: ${{ input.duration_type }}
    status: ${{ input.status }}
    apply_on: ${{ input.apply_on }}
    created_at: ${{ input.created_at }}
    updated_at: ${{ input.updated_at }}
    sort_by: ${{ input.sort_by }}
    currency_code: ${{ input.currency_code }}
    applicable_item_price_ids: ${{ input.applicable_item_price_ids }}
input:
  limit:
    type: integer
    description: The number of resources to be returned.
    default: 10
    minimum: 1
    maximum: 100
  offset:
    type: string
    description: >-
      Determines your position in the list for pagination. To ensure that the next page is retrieved
      correctly, always set `offset`

      to the value of `next_offset`

      obtained in the previous iteration of the API call.
    maxLength: 1000
  id:
    type: object
    description: >-
      optional, string filter

      Used to uniquely identify the coupon in your website/application and to integrate with
      Chargebee.

      Note:When the coupon ID contains a special character; for example: `#`, the API returns an
      error. Make sure that you encode the coupon ID in the path parameter before making an API
      call.

      .

      Supported operators :

      is, is_not, starts_with, in, not_in

      Example →

      id[is] = "OFF2008"
  name:
    type: object
    description: >-
      optional, string filter

      The display name used in web interface for identifying the coupon.

      Note:When the name of the coupon set contains a special character; for example: `#`, the API
      returns an error. Make sure that you encode the name of the coupon set in the path parameter
      before making an API call.

      .

      Supported operators :

      is, is_not, starts_with, in, not_in

      Example →

      name[is_not] = "Offer 10"
  discount_type:
    type: object
    description: |-
      optional, enumerated string filter

      The type of deduction. Possible values are : fixed_amount, percentage.

      **Supported operators :**
      is, is_not, in, not_in

      **Example →**
      *discount_type\[is\] = "fixed_amount"*
  duration_type:
    type: object
    description: >-
      optional, enumerated string filter


      Specifies the time duration for which this coupon is attached to the subscription. Possible
      values are : one_time, forever, limited_period.


      **Supported operators :**

      is, is_not, in, not_in


      **Example →**

      *duration_type\[is\] = "forever"*
  status:
    type: object
    description: |-
      optional, enumerated string filter

      Status of the coupon. Possible values are : active, expired, archived, deleted.

      **Supported operators :**
      is, is_not, in, not_in

      **Example →**
      *status\[is_not\] = "active"*
  apply_on:
    type: object
    description: >-
      optional, enumerated string filter


      The amount on the invoice to which the coupon is applied. Possible values are :
      invoice_amount, each_specified_item.


      **Supported operators :**

      is, is_not, in, not_in


      **Example →**

      *apply_on\[is\] = "invoice_amount"*
  created_at:
    type: object
    description: |-
      optional, timestamp(UTC) in seconds filter

      Timestamp indicating when this coupon is created.
      **Supported operators :**
      after, before, on, between

      **Example →**
      *created_at\[before\] = "145222875"*
  updated_at:
    type: object
    description: >-
      optional, timestamp(UTC) in seconds filter


      To filter based on updated at. This attribute will be present only if the resource has been
      updated after 2016-11-09.

      **Supported operators :**

      after, before, on, between


      **Example →**

      *updated_at\[on\] = "1243545465"*
  sort_by:
    type: object
    description: >-
      optional, string filter


      Sorts based on the specified attribute.

      **Supported attributes :**

      created_at


      **Supported sort-orders :**

      asc, desc


      **Example →**

      *sort_by\[asc\] = "created_at"*


      This will sort the result based on the 'created_at' attribute in ascending(earliest first)
      order.
  currency_code:
    type: object
    description: |-
      optional, string filter

      The currency code ([ISO 4217 format](https://www.chargebee.com/docs/supported-currencies.html)
      ) of the coupon. Applicable for *fixed_amount*
      coupons alone.
      **Supported operators :**
      is, is_not, starts_with, in, not_in

      **Example →**
      *currency_code\[is\] = "USD"*
  applicable_item_price_ids:
    type: object
    description: |-
      optional, string filter

      List of itemPrice ids for which these coupons are applicable.

      **Supported operators :**
      in, is

      **Example →**
      *applicable_item_price_ids\[is\] = "day-pass-USD"*
output:
  coupon_id:
    type: string
    path: $.coupon.id
    description: Unique Chargebee coupon identifier
  coupon:
    type: object
    path: $.coupon
    description: Resource object representing coupon
extract:
  record_path: $.list
  pagination:
    type: offset
    offset_param: offset
    limit_param: limit
  table:
    primary_key:
      - coupon_id
    trust_tier: silver
lookup:
  description: Retrieve a coupon
  api:
    endpoint: /coupons/${{ input.coupon_id }}
    method: GET
  input:
    coupon_id:
      type: string
      required: true
test:
  fixtures:
    - name: list_coupons_smoke
      input:
        chargebee_request_origin_device: Android
        chargebee_request_origin_user: user@example.com
        chargebee_request_origin_user_encoded: dXNlci7QutCy0ZbRgtC+0YfQutCwQGV4YW1wbGUuY29t
        chargebee_request_origin_ip: 192.168.1.2
        chargebee_business_entity_id: null
        limit: null
        offset: null
        id: OFF2008
        name: Offer 10
        discount_type: fixed_amount
        duration_type: forever
        status: active
        apply_on: invoice_amount
        created_at: '145222875'
        updated_at: '1243545465'
        sort_by: null
        currency_code: USD
        applicable_item_price_ids: day-pass-USD
