type: resource
name: list_subscriptions
description: List subscriptions
api:
  endpoint: /subscriptions
  method: GET
  query_params:
    limit: ${{ input.limit }}
    offset: ${{ input.offset }}
    include_deleted: ${{ input.include_deleted }}
    id: ${{ input.id }}
    customer_id: ${{ input.customer_id }}
    item_id: ${{ input.item_id }}
    item_price_id: ${{ input.item_price_id }}
    status: ${{ input.status }}
    cancel_reason: ${{ input.cancel_reason }}
    cancel_reason_code: ${{ input.cancel_reason_code }}
    remaining_billing_cycles: ${{ input.remaining_billing_cycles }}
    created_at: ${{ input.created_at }}
    activated_at: ${{ input.activated_at }}
    next_billing_at: ${{ input.next_billing_at }}
    cancelled_at: ${{ input.cancelled_at }}
    has_scheduled_changes: ${{ input.has_scheduled_changes }}
    updated_at: ${{ input.updated_at }}
    offline_payment_method: ${{ input.offline_payment_method }}
    auto_close_invoices: ${{ input.auto_close_invoices }}
    override_relationship: ${{ input.override_relationship }}
    sort_by: ${{ input.sort_by }}
    business_entity_id: ${{ input.business_entity_id }}
    channel: ${{ input.channel }}
input:
  limit:
    type: integer
    description: The number of resources to be returned.
    default: 10
    minimum: 1
    maximum: 100
  offset:
    type: string
    description: >-
      Determines your position in the list for pagination. To ensure that the next page is retrieved
      correctly, always set `offset`

      to the value of `next_offset`

      obtained in the previous iteration of the API call.
    maxLength: 1000
  include_deleted:
    type: boolean
    description: >-
      Indicates whether to include deleted objects in the list. The deleted objects have the
      attribute `deleted`

      as `true`

      .
    default: false
  id:
    type: object
    description: |-
      optional, string filter

      A unique and immutable identifier for the subscription. If not provided, it is autogenerated.
      **Supported operators :**
      is, is_not, starts_with, in, not_in

      **Example →**
      *id\[is_not\] = "8gsnbYfsMLds"*
  customer_id:
    type: object
    description: |-
      optional, string filter

      Identifier of the customer with whom this subscription is associated.
      **Supported operators :**
      is, is_not, starts_with, in, not_in

      **Example →**
      *customer_id\[is\] = "8gsnbYfsMLds"*
  item_id:
    type: object
    description: |-
      optional, string filter

      The plan item code.
      **Supported operators :**
      is, is_not, starts_with, in, not_in

      **Example →**
      *item_id\[is_not\] = "silver"*
  item_price_id:
    type: object
    description: |-
      optional, string filter

      The plan item price code.
      **Supported operators :**
      is, is_not, starts_with, in, not_in

      **Example →**
      *item_price_id\[is\] = "silver-USD-monthly"*
  status:
    type: object
    description: >-
      optional, enumerated string filter


      Current state of the subscription. Possible values are : future, in_trial, active,
      non_renewing, paused, cancelled.


      **Supported operators :**

      is, is_not, in, not_in


      **Example →**

      *status\[is_not\] = "active"*
  cancel_reason:
    type: object
    description: >-
      optional, enumerated string filter


      The reason for canceling the subscription. Set by Chargebee automatically. Possible values are
      : not_paid, no_card, fraud_review_failed, non_compliant_eu_customer, tax_calculation_failed,
      currency_incompatible_with_gateway, non_compliant_customer.


      **Supported operators :**

      is, is_not, in, not_in, is_present


      **Example →**

      *cancel_reason\[is\] = "not_paid"*
  cancel_reason_code:
    type: object
    description: >-
      optional, string filter


      Reason code for canceling the subscription. Must be one from a list of reason codes set in the
      Chargebee app in **Settings \> Configure Chargebee \> Reason Codes \> Subscriptions \>
      Subscription Cancellation** .

      Must be passed if set as mandatory in the app. The codes are case-sensitive.

      **Supported operators :**

      is, is_not, starts_with, in, not_in


      **Example →**

      *cancel_reason_code\[is\] = "Not Paid"*
  remaining_billing_cycles:
    type: object
    description: >-
      optional, integer filter


      * When the subscription is not on a contract term: this value is the number of billing cycles
      remaining after the current cycle, at the end of which, the subscription cancels.

      * When the subscription is on a [contract term](/docs/api/contract_terms): this value is the
      number of billing cycles remaining in the contract term after the current billing cycle. .
      **Supported operators :** is, is_not, lt, lte, gt, gte, between, is_present


      **Example →**

      *remaining_billing_cycles\[is_not\] = "3"*
  created_at:
    type: object
    description: |-
      optional, timestamp(UTC) in seconds filter

      The time at which the subscription was created.
      **Supported operators :**
      after, before, on, between

      **Example →**
      *created_at\[before\] = "1435054328"*
  activated_at:
    type: object
    description: |-
      optional, timestamp(UTC) in seconds filter
      Time at which the subscription `status`
      last changed to
      `active`.
      For example, this value is updated when an `in_trial`
      or
      `cancelled`
      subscription activates.
      Supported operators :
      after, before, on, between, is_present
      Example →
      activated_at[after] = "1435054328"
  next_billing_at:
    type: object
    description: >-
      optional, timestamp(UTC) in seconds filter

      The date/time at which the next billing for the subscription happens. This is usually right
      after `current_term_end`

      unless multiple subscription terms were invoiced in advance using the `terms_to_charge`

      parameter.

      Supported operators :

      after, before, on, between

      Example →

      next_billing_at[after] = "1435054328"
  cancelled_at:
    type: object
    description: |-
      optional, timestamp(UTC) in seconds filter

      Time at which subscription was cancelled or is set to be cancelled.
      **Supported operators :**
      after, before, on, between

      **Example →**
      *cancelled_at\[after\] = "1435054328"*
  has_scheduled_changes:
    type: object
    description: |-
      optional, boolean filter
      If `true`
      , there are subscription changes scheduled on next renewal. Possible values are : true, false
      Supported operators :
      is
      Example →
      has_scheduled_changes[is] = "true"
  updated_at:
    type: object
    description: >-
      optional, timestamp(UTC) in seconds filter

      To filter based on `updated_at`.

      This attribute will be present only if the resource has been updated after 2016-09-28. It is
      advisable when using this filter, to pass the `sort_by`

      input parameter as `updated_at`

      for a faster response.

      Supported operators :

      after, before, on, between

      Example →

      updated_at[after] = "1243545465"
  offline_payment_method:
    type: object
    description: >-
      optional, enumerated string filter


      The preferred offline payment method for the subscription. Possible values are :
      no_preference, cash, check, bank_transfer, ach_credit, sepa_credit.


      **Supported operators :**

      is, is_not, in, not_in


      **Example →**

      *offline_payment_method\[is_not\] = "cash"*
  auto_close_invoices:
    type: object
    description: >-
      optional, boolean filter

      Set to `false`

      to override for this subscription, the site-level setting

      for auto-closing invoices. Only applicable when auto-closing invoices has been enabled for the
      site. This attribute has a higher precedence than the same attribute at the customer level.

      Possible values are : true, false

      Supported operators :

      is

      Example →

      auto_close_invoices[is] = "true"
  override_relationship:
    type: object
    description: |-
      optional, boolean filter
      If `true`
      , ignores the hierarchy relationship
      and uses customer as payment and invoice owner. Possible values are : true, false
      Supported operators :
      is
      Example →
      override_relationship[is] = "false"
  sort_by:
    type: object
    description: >-
      optional, string filter


      Sorts based on the specified attribute.

      **Supported attributes :**

      created_at, updated_at


      **Supported sort-orders :**

      asc, desc


      **Example →**

      *sort_by\[asc\] = "created_at"*


      This will sort the result based on the 'created_at' attribute in ascending(earliest first)
      order.
  business_entity_id:
    type: object
    description: |-
      optional, string filter

      The unique ID of the
      [business entity](/docs/api/advanced-features)
      of this subscription. This is always the same as the
      [business entity](/docs/api/subscriptions/subscription-object#customer_id)
      of the customer.

      **Supported operators :**
      is, is_not, starts_with

      **Example →**
      *business_entity_id\[is_not\] = "business_entity_id"*
  channel:
    type: object
    description: >-
      optional, enumerated string filter


      The subscription channel this object originated from and is maintained in. Possible values are
      : web, app_store, play_store.


      **Supported operators :**

      is, is_not, in, not_in


      **Example →**

      *channel\[is_not\] = "APP STORE"*
output:
  subscription_id:
    type: string
    path: $.subscription.id
    description: Unique Chargebee subscription identifier
  subscription:
    type: object
    path: $.subscription
    description: Resource object representing subscription
  customer:
    type: object
    path: $.customer
    description: Resource object representing customer
  card:
    type: object
    path: $.card
    description: Resource object representing card
extract:
  record_path: $.list
  pagination:
    type: offset
    offset_param: offset
    limit_param: limit
  table:
    primary_key:
      - subscription_id
    trust_tier: silver
lookup:
  description: Retrieve a subscription
  api:
    endpoint: /subscriptions/${{ input.subscription_id }}
    method: GET
  input:
    subscription_id:
      type: string
      required: true
test:
  fixtures:
    - name: list_subscriptions_smoke
      input:
        chargebee_request_origin_device: Android
        chargebee_request_origin_user: user@example.com
        chargebee_request_origin_user_encoded: dXNlci7QutCy0ZbRgtC+0YfQutCwQGV4YW1wbGUuY29t
        chargebee_request_origin_ip: 192.168.1.2
        chargebee_business_entity_id: null
        limit: null
        offset: null
        include_deleted: null
        id: 8gsnbYfsMLds
        customer_id: 8gsnbYfsMLds
        item_id: silver
        item_price_id: silver-USD-monthly
        status: active
        cancel_reason: not_paid
        cancel_reason_code: Not Paid
        remaining_billing_cycles: '3'
        created_at: '1435054328'
        activated_at: '1435054328'
        next_billing_at: '1435054328'
        cancelled_at: '1435054328'
        has_scheduled_changes: 'true'
        updated_at: '1243545465'
        offline_payment_method: cash
        auto_close_invoices: 'true'
        override_relationship: 'false'
        sort_by: null
        business_entity_id: business_entity_id
        channel: APP STORE
