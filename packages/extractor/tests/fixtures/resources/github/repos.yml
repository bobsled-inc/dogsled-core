spec_version: '0.1'
name: repos
type: resource
connection: github

endpoint: /orgs/{org}/repos
method: GET
params:
  per_page: 100

variables:
  org: bobsled-inc

response:
  record_path: '$'

schema:
  columns:
    - name: id
      type: integer
      primary_key: true
    - name: name
      type: string
    - name: full_name
      type: string
    - name: private
      type: boolean
    - name: created_at
      type: timestamp
    - name: updated_at
      type: timestamp
    - name: owner_login
      type: string
      path: '$.owner.login'
