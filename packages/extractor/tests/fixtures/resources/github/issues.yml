spec_version: '0.1'
name: issues
type: resource
connection: github

endpoint: /repos/{owner}/{repo}/issues
lookup:
  endpoint: /repos/{owner}/{repo}/issues/{id}
  method: GET
  id_variable: id
method: GET
params:
  state: all
  per_page: 100

variables:
  owner: bobsled-inc
  repo: demo-repo

response:
  record_path: '$'

incremental:
  cursor_field: updated_at
  cursor_param: since

schema:
  columns:
    - name: id
      type: integer
      primary_key: true
    - name: title
      type: string
    - name: state
      type: string
    - name: created_at
      type: timestamp
    - name: updated_at
      type: timestamp
    - name: user_login
      type: string
      path: '$.user.login'

  semantic:
    trust_tier: bronze
