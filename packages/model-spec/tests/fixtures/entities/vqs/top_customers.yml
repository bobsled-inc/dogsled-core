spec_version: '0.2'
type: vq
name: top_customers
nlq: Who are our top 10 customers by revenue?
sql: |
  SELECT customer_id, SUM(amount) AS revenue
  FROM {fct_orders}
  GROUP BY customer_id
  ORDER BY revenue DESC
  LIMIT {limit}
parameters:
  - name: limit
    type: integer
    required: false
    default: 10
tags: [customer360]
