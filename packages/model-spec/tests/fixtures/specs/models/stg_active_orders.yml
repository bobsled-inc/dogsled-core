spec_version: '0.2'
name: stg_active_orders
type: model
description: 'Active orders filtered by status.'
grain: order_id

source:
  ref: ecom.raw_orders
  filter: "STATUS != 'cancelled'"

columns:
  - name: ORDER_ID
    expr: ID
  - name: SUBTOTAL
    expr: 'CAST(SUBTOTAL / 100.0 AS NUMERIC(16, 2))'
  - name: ORDERED_AT
    expr: "DATE_TRUNC('day', ORDERED_AT)"

materialization:
  type: view
