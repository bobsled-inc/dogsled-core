spec_version: '0.2'
name: shopify_customers
type: seed
description: Synthetic Shopify customers for end-to-end customer entity resolution.

payload:
  format: csv
  path: data/shopify_customers.csv
  delimiter: ','

schema:
  columns:
    - name: shopify_customer_id
      type: STRING
      primary_key: true
    - name: email
      type: STRING
    - name: first_name
      type: STRING
    - name: last_name
      type: STRING
    - name: phone
      type: STRING
    - name: country
      type: STRING

materialization:
  type: table
  target_schema: raw
  on_conflict: replace

validation:
  required_columns:
    - shopify_customer_id
    - email
    - first_name
    - last_name
    - phone
    - country
  unique_columns: [shopify_customer_id]
