spec_version: '0.2'
name: hubspot_contacts
type: seed
description: Synthetic HubSpot contacts for end-to-end customer entity resolution.

payload:
  format: csv
  path: data/hubspot_contacts.csv
  delimiter: ','

schema:
  columns:
    - name: hubspot_contact_id
      type: STRING
      primary_key: true
    - name: email
      type: STRING
    - name: first_name
      type: STRING
    - name: last_name
      type: STRING
    - name: phone
      type: STRING
    - name: country
      type: STRING

materialization:
  type: table
  target_schema: raw
  on_conflict: replace

validation:
  required_columns:
    - hubspot_contact_id
    - email
    - first_name
    - last_name
    - phone
    - country
  unique_columns: [hubspot_contact_id]
