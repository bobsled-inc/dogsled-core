spec_version: '1'
type: resource
name: documents
integration: gcs_documents
description: Parse and chunk documents stored under the GCS bucket's documents/ prefix.

source:
  # Glob is provider-relative (no leading slash, no `..`). Adjust to your layout.
  path: 'documents/**/*'
  format: document
  parse:
    formats: [pdf, docx, pptx, html, md, txt, eml]
    max_file_size_mb: 50
    on_error: record
  chunk:
    # strategy: paragraph # cut at blank lines; remove overlap_tokens to use it
    max_tokens: 800
    overlap_tokens: 120
    tokenizer: cl100k_base
  ingest:
    mode: extract

replication:
  method: full_refresh

output:
  document_id:
    type: string
