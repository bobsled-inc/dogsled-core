spec_version: '1'
type: integration
name: linear
auth_env_vars: [LINEAR_API_KEY]
description: Linear GraphQL API
transport:
  type: http
  base_url: https://api.linear.app
  auth:
    type: api-key
    header: Authorization
    key: '${{ env.LINEAR_API_KEY }}'
  timeout_ms: 30000
  retry:
    retry_on: [429, 500, 502, 503]
    max_retries: 3
    backoff: exponential
    retry_after_header: true
  rate_limit:
    requests_per_second: 1.3
    burst: 5
  headers:
    User-Agent: dogsled-example
