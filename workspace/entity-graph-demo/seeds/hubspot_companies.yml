spec_version: '0.2'
name: hubspot_companies
type: seed
description: Synthetic HubSpot companies export for the Entity Graph demo.

payload:
  format: csv
  path: data/hubspot_companies.csv
  delimiter: ','

schema:
  columns:
    - name: hs_object_id
      type: STRING
      primary_key: true
    - name: name
      type: STRING
    - name: website
      type: STRING
    - name: phone
      type: STRING
    - name: country
      type: STRING
    - name: updated_at
      type: TIMESTAMP

materialization:
  type: table
  target_schema: raw
  on_conflict: replace

validation:
  required_columns: [hs_object_id, name, website, phone, country, updated_at]
  unique_columns: [hs_object_id]
