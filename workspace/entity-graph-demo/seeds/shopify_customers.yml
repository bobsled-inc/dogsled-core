spec_version: '0.2'
name: shopify_customers
type: seed
description: Synthetic Shopify B2B customer export for the Entity Graph demo.

payload:
  format: csv
  path: data/shopify_customers.csv
  delimiter: ','

schema:
  columns:
    - name: source_id
      type: STRING
      primary_key: true
    - name: name
      type: STRING
    - name: website
      type: STRING
    - name: phone
      type: STRING
    - name: country
      type: STRING
    - name: updated_at
      type: TIMESTAMP

materialization:
  type: table
  target_schema: raw
  on_conflict: replace

validation:
  required_columns: [source_id, name, website, phone, country, updated_at]
  unique_columns: [source_id]
