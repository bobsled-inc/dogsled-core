spec_version: '0.2'
name: fct_orders
type: model
description: Order fact table joining headers, cleaned customers, line items, and payments.
grain: order_id
source:
  ref: stg_orders
joins:
  - ref: stg_customers
    type: left
    on: stg_orders.customer_id = stg_customers.customer_id
  - ref: stg_order_items
    type: left
    on: stg_orders.order_id = stg_order_items.order_id
  - ref: stg_payments
    type: left
    on: stg_orders.order_id = stg_payments.order_id
columns:
  - name: order_id
    expr: stg_orders.order_id
    primary_key: true
    semantic_role: entity_id
  - name: customer_id
    expr: stg_orders.customer_id
    references: stg_customers.customer_id
    semantic_role: entity_id
  - name: customer_email
    expr: stg_customers.email
    semantic_role: email
    pii: true
  - name: order_total
    expr: SUM(stg_order_items.line_total)
    semantic_role: currency
    unit: usd
  - name: item_count
    expr: COUNT(stg_order_items.order_item_id)
    semantic_role: count
  - name: payment_status
    expr: stg_payments.status
    semantic_role: categorical
  - name: ordered_at
    expr: stg_orders.ordered_at
    semantic_role: event_timestamp
  - name: status
    expr: stg_orders.status
    semantic_role: categorical
materialization:
  type: table
group_by: [order_id, customer_id, customer_email, payment_status, ordered_at, status]
expect:
  - kind: primary_key
    columns: [order_id]
