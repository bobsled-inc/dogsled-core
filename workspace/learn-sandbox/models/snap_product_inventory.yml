spec_version: '0.2'
name: snap_product_inventory
type: model
description: Snapshot model for product price and stock changes over time.
grain: product_id
source:
  ref: stg_products_clean
columns:
  - name: product_id
    expr: stg_products_clean.product_id
    primary_key: true
  - name: product_name
    expr: stg_products_clean.product_name
  - name: price
    expr: stg_products_clean.price
  - name: in_stock
    expr: stg_products_clean.in_stock
materialization:
  type: snapshot
  unique_key: product_id
  tracked_columns: [price, in_stock]
