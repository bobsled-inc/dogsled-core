version: 2
# Routine version-update PRs are off (limit 0). Dependabot security-update PRs
# are enabled in repository settings and still open for security advisories.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
