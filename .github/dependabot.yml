version: 2
# Weekly grouped minor/patch version updates. Major updates stay manual.
# Dependabot security-update PRs stay enabled in repository settings. When a
# fix version is younger than the 7-day release age, its PR goes green once the
# version is old enough, or the owner adds an exemption if it is urgent.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    labels:
      - dependencies
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
