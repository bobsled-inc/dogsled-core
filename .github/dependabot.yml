version: 2
# Weekly grouped minor/patch version updates, Mondays 06:00 UTC (just before the
# 06:17 UTC daily release health check). Major updates stay manual.
# Dependabot security-update PRs stay enabled in repository settings. When a
# fix version is younger than the 7-day release age, its PR goes green once the
# version is old enough, or the owner adds an exemption if it is urgent.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 6
    cooldown:
      default-days: 7
    labels:
      - dependencies
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      ai:
        patterns:
          - '@ai-sdk/*'
          - '@openrouter/ai-sdk-provider'
          - ai
        update-types: [minor, patch]
      data-and-cloud:
        patterns:
          - '@aws-sdk/*'
          - '@smithy/*'
          - '@google-cloud/*'
          - '@clickhouse/client'
          - '@databricks/sql'
          - '@polyglot-sql/sdk'
          - '@turbopuffer/turbopuffer'
          - '@types/pg'
          - pg
          - snowflake-sdk
        update-types: [minor, patch]
      frontend:
        patterns:
          - '@tailwindcss/*'
          - '@types/react'
          - '@types/react-dom'
          - highlight.js
          - mermaid
          - next
          - react
          - react-dom
          - react-test-renderer
          - tailwindcss
        update-types: [minor, patch]
      lint-and-security:
        patterns:
          - '@secretlint/*'
          - '@typescript-eslint/*'
          - eslint
          - fast-check
          - globals
          - prettier
          - secretlint
          - semver
        update-types: [minor, patch]
      build-and-types:
        patterns:
          - '@types/*'
          - playwright
          - tsx
          - turbo
        update-types: [minor, patch]
      runtime-other:
        patterns:
          - '*'
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    labels:
      - dependencies
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
