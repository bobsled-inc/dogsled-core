name: Bug report
description: Report reproducible behavior that is incorrect or unsafe
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Bobsled Core bug. Do not include credentials, customer data, or undisclosed vulnerabilities. Report security issues through SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal config, command sequence, or repository that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bobsled Core version
      placeholder: 'X.Y.Z'
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - CLI
        - Extractor or integration
        - Loader or destination
        - Model Spec
        - Entity Graph
        - Runner or GitHub Actions
        - SDK or public API
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Node.js version, warehouse, and any relevant runtime details.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, tokens, customer data, and private infrastructure identifiers.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
