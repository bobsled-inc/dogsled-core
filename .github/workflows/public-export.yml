name: Public export

on:
  pull_request:
    branches: [rename/bobsled-core]
  push:
    branches: [rename/bobsled-core]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  public-export:
    name: public export (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: [model, graph, bobsled, rest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Export exact commit and verify the public tree
        env:
          UNIT_LEG: ${{ matrix.leg }}
          EXPORT_COMMIT: ${{ github.sha }}
        run: node scripts/release/public-export.mjs --commit "$EXPORT_COMMIT" --out "$RUNNER_TEMP/public-source" --verify --unit-leg "$UNIT_LEG"

  public-export-ok:
    name: public export dry run
    if: always()
    needs: public-export
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all exported-tree verification legs
        env:
          EXPORT: ${{ needs.public-export.result }}
        run: test "$EXPORT" = success
