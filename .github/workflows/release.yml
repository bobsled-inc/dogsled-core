name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Create a release (auto derives the bump from merged pull requests), retry an immutable tag, or perform first-time restricted publication
        required: true
        default: new
        type: choice
        options: [new, auto, preview, retry, bootstrap]
      bump:
        description: Version increment for new releases (auto ignores it); major under 0.x advances the minor
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      version:
        description: New 0.x.y-preview.N version for preview, or existing stable/preview version for retry
        required: false
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: '1'
  NPM_CONFIG_FETCH_TIMEOUT: '60000'
  NPM_CONFIG_FETCH_RETRIES: '4'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '60000'

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1: version decision (fast, gates everything else)
  # ---------------------------------------------------------------------------
  prepare:
    if: github.repository == 'bobsled-inc/dogsled-core' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      breaking: ${{ steps.plan.outputs.breaking }}
      breaking_prs: ${{ steps.plan.outputs.breaking_prs }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      notify_summary: ${{ steps.plan.outputs.notify_summary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate retry origin before using tag contents
        if: inputs.mode == 'retry'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/release/version.mjs validate-retry-origin
          git -c core.hooksPath=/dev/null checkout --detach "refs/tags/v$RELEASE_VERSION"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: Check dependency expiry dates
        run: pnpm deps:expiries --fail-within 0
      - name: Require reviewed package access settings
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('packages/dogsled/package.json', 'utf8'));
          if (pkg.name !== '@bobsled-inc/dogsled' || !['restricted', 'public'].includes(pkg.publishConfig?.access)) throw new Error('Apply the reviewed version/access release PR first.');
          JS
      - name: Plan immutable version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          case "$RELEASE_MODE" in
            new) node scripts/release/version.mjs prepare-manual ;;
            auto) node scripts/release/version.mjs prepare-auto ;;
            preview) node scripts/release/version.mjs prepare-preview ;;
            retry) node scripts/release/version.mjs verify-retry ;;
            bootstrap) node scripts/release/version.mjs prepare-bootstrap ;;
            *) exit 1 ;;
          esac

  # ---------------------------------------------------------------------------
  # Phase 2: parallel release checks (mirror ci.yml without cache)
  # ---------------------------------------------------------------------------

  # Mirrors ci.yml `checks`: build, types, lint, structural, security guards.
  release-checks:
    if: >-
      github.repository == 'bobsled-inc/dogsled-core' &&
      needs.prepare.outputs.release == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.mode == 'retry' && needs.prepare.outputs.tag || github.sha }}
          fetch-depth: ${{ inputs.mode == 'retry' && 0 || 1 }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - run: pnpm run setup:sqlite
      - run: pnpm security:fast
      - name: Check committed skill and plugin output before builds
        run: pnpm skills:check
      - name: Build
        run: pnpm build
        timeout-minutes: 10
      - name: Verify bundled third-party notices
        run: node scripts/release/third-party-notices.mjs --check
      - name: Check types, lint, docs, and formatting
        run: pnpm check
        timeout-minutes: 15
      - name: Structural tests
        run: pnpm test:structural
        timeout-minutes: 3

  # Mirrors ci.yml `unit`: four partitions, each builds its own closure.
  release-unit:
    if: >-
      github.repository == 'bobsled-inc/dogsled-core' &&
      needs.prepare.outputs.release == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        leg: [model, graph, dogsled, rest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.mode == 'retry' && needs.prepare.outputs.tag || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - run: pnpm run setup:sqlite
      - name: Run unit-test partition and its build closure
        env:
          UNIT_LEG: ${{ matrix.leg }}
        run: pnpm "test:unit:ci:$UNIT_LEG"

  # Validates the packed tarball can be imported and queried.
  release-packed-catalog:
    if: >-
      github.repository == 'bobsled-inc/dogsled-core' &&
      needs.prepare.outputs.release == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.mode == 'retry' && needs.prepare.outputs.tag || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: Build
        run: pnpm build
        timeout-minutes: 10
      - name: Test the packed catalog, retrying once after a registry stall
        timeout-minutes: 20
        run: |
          for attempt in 1 2; do
            if timeout 10m pnpm test:packed-catalog -- --skip-build; then exit 0; fi
            echo "::warning::Packed-catalog attempt $attempt failed."
          done
          exit 1

  # Creates the release tag, builds and audits the tarball, and uploads the
  # release artifact.  Runs in parallel with the check and unit jobs.
  release-audit:
    if: >-
      github.repository == 'bobsled-inc/dogsled-core' &&
      needs.prepare.outputs.release == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.mode == 'retry' && needs.prepare.outputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: Stamp the release version into the package manifest
        if: inputs.mode != 'retry'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release/version.mjs stamp-version
      - name: Create immutable release tag
        if: inputs.mode != 'retry' && inputs.mode != 'bootstrap'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- packages/dogsled/package.json; then
            git add packages/dogsled/package.json
            git commit -m "Release $RELEASE_TAG"
          fi
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
      - name: Install reviewed SBOM generator
        timeout-minutes: 5
        run: npm install --global @cyclonedx/cdxgen@12.8.0 --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Verify reviewed release tarball
        timeout-minutes: 15
        run: pnpm security:release --execute --out "$RUNNER_TEMP/npm-release"
      - name: Preserve the verified release commit and tag
        id: candidate
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git bundle create "$RUNNER_TEMP/npm-release/release.bundle" "refs/tags/$RELEASE_TAG"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/npm-release
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Phase 3: gate — all release checks must pass before approval
  # ---------------------------------------------------------------------------
  release-checks-ok:
    if: >-
      always() && github.repository == 'bobsled-inc/dogsled-core' &&
      needs.prepare.outputs.release == 'true'
    needs: [prepare, release-checks, release-unit, release-packed-catalog, release-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      commit: ${{ needs.release-audit.outputs.commit }}
    steps:
      - name: Require every release check
        env:
          CHECKS: ${{ needs.release-checks.result }}
          UNIT: ${{ needs.release-unit.result }}
          PACKED: ${{ needs.release-packed-catalog.result }}
          AUDIT: ${{ needs.release-audit.result }}
        run: |
          test "$CHECKS" = success
          test "$UNIT" = success
          test "$PACKED" = success
          test "$AUDIT" = success

  # ---------------------------------------------------------------------------
  # Phase 4: approval, tag, publish, finalize
  # ---------------------------------------------------------------------------
  notify:
    if: >-
      github.repository == 'bobsled-inc/dogsled-core' &&
      needs.release-checks-ok.result == 'success' &&
      needs.prepare.outputs.release == 'true'
    needs: [prepare, release-checks-ok]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Slack that a release awaits approval
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          NOTIFY_SUMMARY: ${{ needs.prepare.outputs.notify_summary }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            printf '%s\n' 'Slack notification skipped: SLACK_RELEASE_WEBHOOK_URL is not set.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          text="${NOTIFY_SUMMARY}
          Approve with the GitHub app message in this channel."
          payload="$(jq -n --arg text "$text" '{text: $text}')"
          curl -fsS --retry 2 -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK" 2>/dev/null || {
            printf '%s\n' 'Slack notification failed (non-blocking).' >> "$GITHUB_STEP_SUMMARY"
          }

  approve:
    if: >-
      github.repository == 'bobsled-inc/dogsled-core' &&
      needs.release-checks-ok.result == 'success' &&
      needs.prepare.outputs.release == 'true'
    needs: [prepare, release-checks-ok, notify]
    environment: release-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Release summary
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_BREAKING: ${{ needs.prepare.outputs.breaking }}
        run: |
          printf '### Approving release %s\n\n' "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RELEASE_BREAKING" = "true" ]; then
            printf '> [!WARNING]\n> This release contains breaking changes.\n\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'Review the **prepare** job summary for the full pull request table before approving.\n' >> "$GITHUB_STEP_SUMMARY"

  tag:
    if: >-
      github.repository == 'bobsled-inc/dogsled-core' && github.ref == 'refs/heads/main' &&
      inputs.mode != 'retry' && needs.prepare.outputs.release == 'true'
    needs: [prepare, release-checks-ok, approve]
    environment: release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/npm-release
      - name: Push the verified immutable tag without running hooks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release-checks-ok.outputs.commit }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          git -c core.hooksPath=/dev/null fetch "$RUNNER_TEMP/npm-release/release.bundle" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          node scripts/release/version.mjs verify-candidate
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin "refs/tags/$RELEASE_TAG"

  publish:
    if: >-
      !cancelled() && github.repository == 'bobsled-inc/dogsled-core' &&
      needs.prepare.result == 'success' && needs.approve.result == 'success' &&
      needs.release-checks-ok.result == 'success' &&
      needs.prepare.outputs.release == 'true' &&
      (needs.tag.result == 'success' || (inputs.mode == 'retry' && needs.tag.result == 'skipped'))
    needs: [prepare, release-checks-ok, approve, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install reviewed trusted-publishing client
        run: npm install --global npm@11.18.0 --ignore-scripts --registry=https://registry.npmjs.org/
      - run: test "$(npm --version)" = '11.18.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/npm-release
      - name: Read current repository visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility')"
          case "$visibility" in private|public) ;; *) exit 1 ;; esac
          printf 'RELEASE_REPOSITORY_VISIBILITY=%s\n' "$visibility" >> "$GITHUB_ENV"
      - name: Publish subsequent releases with OIDC
        if: inputs.mode != 'bootstrap'
        env:
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
        run: node scripts/release/publish.mjs "$RUNNER_TEMP/npm-release"
      - name: Publish the first restricted package with a short-lived token
        if: inputs.mode == 'bootstrap'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-bootstrap.npmrc
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          if (!process.env.NODE_AUTH_TOKEN) throw new Error('The protected bootstrap environment token is required.');
          writeFileSync(process.env.NPM_CONFIG_USERCONFIG, '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n', { mode: 0o600 });
          JS
          node scripts/release/publish.mjs "$RUNNER_TEMP/npm-release" --bootstrap
      - name: Remove bootstrap configuration and require token revocation
        if: always() && inputs.mode == 'bootstrap'
        run: |
          rm -f "$RUNNER_TEMP/npm-bootstrap.npmrc"
          printf '%s\n' 'Verify registry integrity. Revoke the bootstrap token and delete the npm-release environment secret immediately, including on failure. An npm owner adds the trusted publisher with 2FA before the next release.' >> "$GITHUB_STEP_SUMMARY"

  finalize:
    if: >-
      !cancelled() && github.repository == 'bobsled-inc/dogsled-core' &&
      needs.prepare.result == 'success' && needs.publish.result == 'success'
    needs: [prepare, release-checks-ok, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/npm-release
      - name: Create or complete the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release-checks-ok.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_BREAKING: ${{ needs.prepare.outputs.breaking }}
          RELEASE_BREAKING_PRS: ${{ needs.prepare.outputs.breaking_prs }}
        run: |
          node scripts/release/finalize-github-release.mjs \
            "$RUNNER_TEMP/npm-release/release-report.json#npm release artifact report" \
            "$RUNNER_TEMP/npm-release/sbom.json#CycloneDX SBOM"
