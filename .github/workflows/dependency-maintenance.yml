name: Daily release health check

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check mode
        id: mode
        env:
          RELEASE_HEALTH: ${{ vars.RELEASE_HEALTH }}
        run: |
          mode="${RELEASE_HEALTH:-off}"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "off" ]; then
            echo "RELEASE_HEALTH is off or unset; exiting."
            exit 0
          fi
          echo "RELEASE_HEALTH=$mode"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.mode.outputs.mode != 'off'
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.mode.outputs.mode != 'off'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.mode.outputs.mode != 'off'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.mode.outputs.mode != 'off'
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        if: steps.mode.outputs.mode != 'off'
        run: pnpm build
        timeout-minutes: 15

      - name: Setup SQLite
        if: steps.mode.outputs.mode != 'off'
        run: pnpm run setup:sqlite

      - name: Run consumer audit with look-ahead
        if: steps.mode.outputs.mode != 'off'
        run: >-
          node scripts/deps/consumer-check.mjs
          --output "$RUNNER_TEMP/health-check"
          --lookahead-days 3
        timeout-minutes: 20

      - name: Run health check
        if: steps.mode.outputs.mode != 'off'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_HEALTH_CHANNEL_ID: ${{ vars.SLACK_HEALTH_CHANNEL_ID }}
          SLACK_RELEASE_CHANNEL_ID: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
          HUSKY_SLACK_USER_ID: ${{ vars.HUSKY_SLACK_USER_ID }}
        run: >-
          node scripts/deps/health-check.mjs
          --output "$RUNNER_TEMP/health-check"
