name: Preview publish

# Publishes restricted @bobsled-inc/bobsled-core-preview builds from the
# rename/bobsled-core branch only. Pull requests that change this workflow or
# its script run the build job as a dry run; nothing is published from them.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version, 0.1.0-preview.N
        required: true
        type: string
      dry_run:
        description: Build and verify only; do not publish
        required: true
        default: true
        type: boolean
      bootstrap:
        description: First publish only - use the one-time NPM_BOOTSTRAP_TOKEN instead of trusted publishing
        required: true
        default: false
        type: boolean
  pull_request:
    branches: [rename/bobsled-core]
    paths:
      - .github/workflows/preview-publish.yml
      - scripts/release/preview.mjs

concurrency:
  group: preview-publish-${{ github.event_name == 'pull_request' && github.ref || 'dispatch' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: '1'
  NPM_CONFIG_FETCH_TIMEOUT: '60000'
  NPM_CONFIG_FETCH_RETRIES: '4'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '60000'

jobs:
  build:
    if: >-
      github.repository == 'bobsled-inc/dogsled-core' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/rename/bobsled-core')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check the preview version
        id: version
        env:
          PREVIEW_VERSION: ${{ github.event_name == 'pull_request' && '0.1.0-preview.1' || inputs.version }}
        run: |
          node --input-type=module -e "import { assertPreviewVersion } from './scripts/release/preview.mjs'; assertPreviewVersion(process.env.PREVIEW_VERSION);"
          printf 'version=%s\n' "$PREVIEW_VERSION" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: Stamp the preview version into a local commit
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release/version.mjs stamp-version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit --quiet --all -m "Preview $RELEASE_VERSION"
      - name: Install reviewed SBOM generator
        timeout-minutes: 5
        run: npm install --global @cyclonedx/cdxgen@12.8.0 --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Run the normal release gate
        timeout-minutes: 20
        run: pnpm security:release --execute --out "$RUNNER_TEMP/release-gate"
      - name: Rename the gated tarball to the preview package and verify it
        run: node scripts/release/preview.mjs stage --gate "$RUNNER_TEMP/release-gate" --out "$RUNNER_TEMP/preview"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bobsled-core-preview-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/preview
          if-no-files-found: error
          retention-days: 7

  publish:
    if: >-
      github.repository == 'bobsled-inc/dogsled-core' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/rename/bobsled-core' &&
      inputs.dry_run == false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-preview-bobsled
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install reviewed trusted-publishing client
        run: npm install --global npm@11.18.0 --ignore-scripts --registry=https://registry.npmjs.org/
      - run: test "$(npm --version)" = '11.18.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobsled-core-preview-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/preview
      - name: Read current repository visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility')"
          test "$visibility" = private
          printf 'RELEASE_REPOSITORY_VISIBILITY=%s\n' "$visibility" >> "$GITHUB_ENV"
      - name: Publish with trusted publishing and verify registry integrity
        if: inputs.bootstrap == false
        env:
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
        run: node scripts/release/preview.mjs publish "$RUNNER_TEMP/preview"
      - name: Publish the first preview with the one-time token
        if: inputs.bootstrap == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-bootstrap.npmrc
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          if (!process.env.NODE_AUTH_TOKEN) throw new Error('The npm-preview-bobsled environment token is required.');
          writeFileSync(process.env.NPM_CONFIG_USERCONFIG, '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n', { mode: 0o600 });
          JS
          node scripts/release/preview.mjs publish "$RUNNER_TEMP/preview" --bootstrap
      - name: Remove bootstrap configuration and require token revocation
        if: always() && inputs.bootstrap == true
        run: |
          rm -f "$RUNNER_TEMP/npm-bootstrap.npmrc"
          printf '%s\n' 'Revoke the bootstrap token and delete NPM_BOOTSTRAP_TOKEN from npm-preview-bobsled now, then add the trusted publisher.' >> "$GITHUB_STEP_SUMMARY"
      - name: Summary
        if: always()
        env:
          PREVIEW_VERSION: ${{ needs.build.outputs.version }}
        run: |
          integrity="$(node -p "require(process.env.RUNNER_TEMP + '/preview/preview-report.json').sha512" 2>/dev/null || echo unavailable)"
          printf '| Package | Version | Tag | Integrity |\n| --- | --- | --- | --- |\n| `@bobsled-inc/bobsled-core-preview` | `%s` | `preview` | `%s` |\n' "$PREVIEW_VERSION" "$integrity" >> "$GITHUB_STEP_SUMMARY"
