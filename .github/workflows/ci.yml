name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:
    inputs:
      dependency_audit:
        description: Query the package registry for high-severity dependency advisories
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability audit
        if: >-
          ${{ github.event_name == 'schedule' ||
              (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
              (github.event_name == 'workflow_dispatch' && inputs.dependency_audit) }}
        run: pnpm security:audit
      - run: pnpm run setup:sqlite
      - run: pnpm security:fast
      - name: Build
        run: pnpm build
        timeout-minutes: 10
      - name: Verify bundled third-party notices
        run: node scripts/release/third-party-notices.mjs --check
      - name: Check types, lint, docs, and formatting
        run: pnpm check
        timeout-minutes: 15
      - name: Structural tests
        run: pnpm test:structural
        timeout-minutes: 3
      - name: Verify packed catalog import
        run: pnpm test:packed-catalog -- --skip-build

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        leg: [model, graph, dogsled, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:sqlite
      - name: Run unit-test partition and its build closure
        env:
          UNIT_LEG: ${{ matrix.leg }}
        run: pnpm "test:unit:ci:$UNIT_LEG"

  showcases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        leg: [audit, core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:sqlite
      - name: Install public native audit and browser tools
        run: |
          sudo apt-get update
          sudo apt-get install -y strace openssl
          pnpm exec playwright install --with-deps chromium
      - name: Build toolkit and Explorer dependencies
        run: pnpm run build
      - name: Run credential-free showcase partition
        env:
          SHOWCASE_LEG: ${{ matrix.leg }}
        run: pnpm e2e -- --leg "$SHOWCASE_LEG" --results "test-results/showcases/$SHOWCASE_LEG.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: showcases-${{ matrix.leg }}
          overwrite: true
          path: test-results/showcases/${{ matrix.leg }}.json
          if-no-files-found: error

  showcase-results:
    needs: showcases
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: showcases-*
          path: test-results/showcases
          merge-multiple: true
      - name: Require every showcase to have run and passed exactly once
        run: node scripts/e2e/run.mjs --aggregate test-results/showcases

  outsider:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:sqlite
      - name: Build the CLI package closure
        run: pnpm --filter @bobsled-inc/dogsled... build
      - name: Install the packed CLI without a workspace or npm token
        run: pnpm e2e:outsider

  ci-ok:
    if: always()
    needs: [checks, unit, showcases, showcase-results, outsider]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every check
        env:
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
          SHOWCASE_RESULTS: ${{ needs.showcase-results.result }}
          SHOWCASES: ${{ needs.showcases.result }}
          OUTSIDER: ${{ needs.outsider.result }}
        run: test "$CHECKS" = success && test "$UNIT" = success && test "$SHOWCASE_RESULTS" = success && test "$SHOWCASES" = success && test "$OUTSIDER" = success
