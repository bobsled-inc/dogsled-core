name: CI

on:
  push:
    branches: [main, rename/bobsled-core]
  pull_request:
    branches: [main, rename/bobsled-core]
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:
    inputs:
      dependency_audit:
        description: Query the package registry for high-severity dependency advisories
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Detect dependency changes
        id: dependency-changes
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '(^|/)package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check committed skill and plugin output before builds
        run: pnpm skills:check
      - name: Check committed built-in integration sources before builds
        run: pnpm --filter @bobsled-inc/integrations check:sources
      - name: Dependency vulnerability audit
        if: >-
          ${{ github.event_name == 'schedule' ||
              (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
              (github.event_name == 'pull_request' && steps.dependency-changes.outputs.changed == 'true') ||
              (github.event_name == 'workflow_dispatch' && inputs.dependency_audit) }}
        run: pnpm security:audit
      - run: pnpm run setup:sqlite
      - run: pnpm security:fast
      - name: Report old Bobsled Core names (report-only until the rename is done)
        run: pnpm guard:rename
      - name: Build
        run: pnpm build
        timeout-minutes: 10
      - name: Verify the build did not change committed generated integration files
        run: git diff --exit-code -- packages/integrations/src/builtin-sources packages/integrations/src/catalog/generated-data.ts packages/integrations/src/validation/generated-data.ts
      - name: Verify bundled third-party notices
        run: node scripts/release/third-party-notices.mjs --check
      - name: Check types, lint, docs, and formatting
        run: pnpm check
        timeout-minutes: 15
      - name: Structural tests
        run: pnpm test:structural
        timeout-minutes: 3
      - name: Verify packed catalog import
        run: pnpm test:packed-catalog -- --skip-build

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        leg: [model, graph, bobsled, rest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:sqlite
      - name: Run unit-test partition and its build closure
        env:
          UNIT_LEG: ${{ matrix.leg }}
        run: pnpm "test:unit:ci:$UNIT_LEG"

  showcases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        leg: [audit, core]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:sqlite
      - name: Install public native audit and browser tools
        run: |
          sudo apt-get update
          sudo apt-get install -y strace openssl
          pnpm exec playwright install --with-deps chromium
      - name: Build toolkit and Explorer dependencies
        run: pnpm run build
      - name: Run credential-free showcase partition
        env:
          SHOWCASE_LEG: ${{ matrix.leg }}
        run: pnpm e2e -- --leg "$SHOWCASE_LEG" --results "test-results/showcases/$SHOWCASE_LEG.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcases-${{ matrix.leg }}
          overwrite: true
          path: test-results/showcases/${{ matrix.leg }}.json
          if-no-files-found: error

  showcase-results:
    needs: showcases
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: showcases-*
          path: test-results/showcases
          merge-multiple: true
      - name: Require every showcase to have run and passed exactly once
        run: node scripts/e2e/run.mjs --aggregate test-results/showcases

  outsider:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:sqlite
      - name: Build the CLI package closure
        run: pnpm --filter @bobsled-inc/bobsled-core... build
      - name: Install the packed CLI without a workspace or npm token
        run: pnpm e2e:outsider

  ci-ok:
    if: always()
    needs: [checks, unit, showcases, showcase-results, outsider]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every check
        env:
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
          SHOWCASE_RESULTS: ${{ needs.showcase-results.result }}
          SHOWCASES: ${{ needs.showcases.result }}
          OUTSIDER: ${{ needs.outsider.result }}
        run: test "$CHECKS" = success && test "$UNIT" = success && test "$SHOWCASE_RESULTS" = success && test "$SHOWCASES" = success && test "$OUTSIDER" = success
