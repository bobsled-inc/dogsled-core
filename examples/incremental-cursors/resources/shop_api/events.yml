spec_version: '1'
type: resource
description: Fictional paginated shop records.
name: events
integration: shop_api
api:
  endpoint: /events
  method: GET
input:
  id:
    type: integer
query:
  filters:
    id:
      operators:
        - eq
      bind:
        eq:
          input: id
output:
  id:
    type: integer
    path: $.id
  name:
    type: string
    path: $.name
extract:
  record_path: $.data
  pagination:
    type: cursor
    cursor_path: $.next_cursor
    cursor_param: cursor
  incremental:
    cursor_field: id
    cursor_param: since
    cursor_type: integer
  table:
    primary_key:
      - id
    load_strategy: append
