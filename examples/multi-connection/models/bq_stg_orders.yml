spec_version: '0.2'
name: bq_stg_orders
type: model
description: BigQuery staging — orders with TPC-H columns renamed.
grain: order_id
source:
  ref: bigquery.orders
columns:
  - name: order_id
    expr: o_orderkey
    primary_key: true
  - name: customer_id
    expr: o_custkey
  - name: order_date
    expr: o_orderdate
  - name: total
    expr: o_totalprice
  - name: status
    expr: o_status
materialization:
  type: view
