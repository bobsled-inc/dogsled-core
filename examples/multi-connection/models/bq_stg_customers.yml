spec_version: '0.2'
name: bq_stg_customers
type: model
description: BigQuery staging — cleaned customer rows, TPC-H-flavored columns renamed.
grain: customer_id
source:
  ref: bigquery.customers
columns:
  - name: customer_id
    expr: c_custkey
    primary_key: true
  - name: customer_name
    expr: c_name
  - name: email
    expr: c_email
  - name: country
    expr: c_country
  - name: created_at
    expr: c_created_at
materialization:
  type: view
