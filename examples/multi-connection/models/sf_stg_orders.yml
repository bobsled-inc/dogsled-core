spec_version: '0.2'
name: sf_stg_orders
type: model
description: Snowflake staging — orders with TPC-H columns renamed.
grain: order_id
source:
  ref: snowflake.orders
columns:
  - name: ORDER_ID
    expr: O_ORDERKEY
    primary_key: true
  - name: CUSTOMER_ID
    expr: O_CUSTKEY
  - name: ORDER_DATE
    expr: O_ORDERDATE
  - name: TOTAL
    expr: O_TOTALPRICE
  - name: STATUS
    expr: O_STATUS
materialization:
  type: view
