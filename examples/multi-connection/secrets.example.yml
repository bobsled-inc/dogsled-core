# Copy to `secrets.yml` and fill in. `secrets.yml` is gitignored.
# Used with `dogsled model run --secrets secrets.yml`.

# Snowflake — RSA-key auth.
BOBSLED_CORE_MC_SF_ACCOUNT: MYORG-MYACCOUNT
BOBSLED_CORE_MC_SF_USER: analytics@example.com
BOBSLED_CORE_MC_SF_PRIVATE_KEY_PATH: /Users/you/.ssh/snowflake/multi_conn.p8
# Only set if the key is encrypted; omit otherwise.
# BOBSLED_CORE_MC_SF_PRIVATE_KEY_PASSPHRASE: <passphrase>

# BigQuery — ADC auth reads project from integration YAML; only the GCP
# project id is secret-ish (all else lives in integrations/bigquery.yml).
BOBSLED_CORE_MC_BQ_PROJECT: my-gcp-project
