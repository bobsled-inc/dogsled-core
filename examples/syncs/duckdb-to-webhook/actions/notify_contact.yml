spec_version: '1'
type: action
transport: webhook
auth_env_vars: []
integration: webhook
name: notify_contact
tags: [example, contacts]
description: Send a contact row to an HTTPS webhook endpoint.
webhook:
  url: https://example.com/bobsled-sync-webhook
  method: POST
  request_body:
    email: ${{ input.email }}
    first_name: ${{ input.first_name }}
    last_name: ${{ input.last_name }}
input:
  email:
    type: string
    required: true
  first_name:
    type: string
  last_name:
    type: string
    required: true
