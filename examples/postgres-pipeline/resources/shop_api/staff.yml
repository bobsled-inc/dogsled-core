spec_version: '1'
type: resource
description: Fictional paginated shop records.
name: staff
integration: shop_api
api:
  endpoint: /staff
  method: GET
input:
  id:
    type: integer
query:
  filters:
    id:
      operators:
        - eq
      bind:
        eq:
          input: id
output:
  id:
    type: integer
    path: $.id
  department_id:
    type: integer
    path: $.department_id
  salary:
    type: number
    path: $.salary
extract:
  record_path: $.data
  pagination:
    type: cursor
    cursor_path: $.next_cursor
    cursor_param: cursor
  table:
    primary_key:
      - id
    load_strategy: full_refresh
