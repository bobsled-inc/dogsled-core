spec_version: '1'
auth_env_vars: [SNOWFLAKE_ACCOUNT, SNOWFLAKE_PAT, SNOWFLAKE_USER, XWH_SHARED_STAGING_URI]
type: integration
name: snowflake
source_type: snowflake
connection:
  account_identifier: ${{ env.SNOWFLAKE_ACCOUNT }}
  user: ${{ env.SNOWFLAKE_USER }}
  warehouse: TRANSFORMING_WH
  database: RAW
  schema: PUBLIC
  role: TRANSFORMER
auth:
  type: pat
  token: ${{ env.SNOWFLAKE_PAT }}
cross_warehouse_staging:
  uri: ${{ env.XWH_SHARED_STAGING_URI }}
