# Copy to secrets.yml and fill in. Loaded via `--secrets secrets.yml`.
SNOWFLAKE_ACCOUNT: your-account
SNOWFLAKE_USER: your-user
SNOWFLAKE_PAT: your-pat
BIGQUERY_PROJECT: your-gcp-project
# Inline service-account JSON or a path to the key file.
BIGQUERY_CREDENTIALS: '{"type":"service_account", ...}'
# Object-store prefix the source warehouse can write and the engine can read.
# Enables the native UNLOAD substrate for the Snowflake -> BigQuery hop; remove
# to force host-side streaming.
XWH_SHARED_STAGING_URI: gs://my-bucket/bobsled-xwh/
# The example API source uses env-var indirection for its token; set whatever
# your bundled catalog integration expects (e.g. EXAMPLE_API_TOKEN).
EXAMPLE_API_TOKEN: your-api-token
