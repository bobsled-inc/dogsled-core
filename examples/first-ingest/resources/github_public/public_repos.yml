spec_version: '1'
type: resource
name: public_repos
integration: github_public
description: Public repositories for a GitHub organization
api:
  endpoint: /orgs/${{ input.org }}/repos
  method: GET
  query_params:
    per_page: ${{ input.per_page }}
    sort: updated
    direction: desc
input:
  org:
    type: string
    default: bobsled-inc
  per_page:
    type: integer
    default: 25
output:
  id:
    type: integer
    path: $.id
  name:
    type: string
    path: $.name
  full_name:
    type: string
    path: $.full_name
  html_url:
    type: string
    path: $.html_url
  description:
    type: string
    path: $.description
  language:
    type: string
    path: $.language
  stargazers_count:
    type: integer
    path: $.stargazers_count
  updated_at:
    type: timestamp
    path: $.updated_at
extract:
  record_path: $
  pagination:
    type: link_header
  table:
    primary_key: [id]
    load_strategy: full_refresh
