# Copy to secrets.yml (gitignored), uncomment the keys, and fill in local
# values before running with `--secrets secrets.yml`. Do NOT commit real
# credentials. If the same variables are already exported in your shell, omit
# `--secrets` and the integrations will resolve `${{ env.NAME }}` directly.
#
# See docs/reference/advanced/cross-warehouse-cookbook.md for the full setup walkthrough including
# permission grants required on each warehouse for the publish flow.
#
# OAuth auth is NOT supported on sources for published models because OAuth
# tokens (default 1h Snowflake TTL) cannot cover multi-hour publishes.
# Snowflake: prefer rsa_key (no TTL) over pat (long-lived but rotatable).
# Databricks: pat is fine; OAuth M2M is rejected at validation time.

# SNOWFLAKE_ACCOUNT:
# SNOWFLAKE_USER:
# SNOWFLAKE_PAT:

# Or for Snowflake rsa_key auth (recommended for production):
# SNOWFLAKE_PRIVATE_KEY_PATH: /path/to/rsa_key.p8
# SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: <passphrase-if-encrypted>

# DATABRICKS_WORKSPACE_URL:
# DATABRICKS_HTTP_PATH:
# DATABRICKS_TOKEN:

# Shared staging prefix for native UNLOAD. Must be writable by source
# warehouses and readable by the publish destination. Remove the
# cross_warehouse_staging blocks from the integration YAMLs to force streaming.
# XWH_SHARED_STAGING_URI: s3://my-bucket/bobsled-xwh/
